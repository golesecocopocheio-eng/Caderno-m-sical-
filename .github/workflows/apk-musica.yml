name: Gerar APK do Clan music

on:
  push:
    branches: [main, claude/caderno-musical-apk]
    paths: ['musica/**', 'android-build-musica/**', '.github/workflows/apk-musica.yml']
  workflow_dispatch:

permissions:
  contents: write

# Cada versão (commit) tem o seu próprio grupo: rodar de novo uma execução antiga
# não cancela mais o build de uma versão nova.
concurrency:
  group: apk-musica-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-build-musica
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        run: npm install

      - name: Copiar o aplicativo (pasta musica/)
        run: |
          rm -rf www && cp -r ../musica www
          git rev-list --count HEAD > www/versao.txt

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Permitir o microfone (gravação e letra)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          grep -n "RECORD_AUDIO\|MODIFY_AUDIO" "$M"

      - name: Gerar ícones e tela de abertura
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1F0C3C' --splashBackgroundColor '#1F0C3C'

      - name: Definir a versão do app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Assinar sempre com a mesma chave (permite atualizar sem desinstalar)
        run: |
          cp ../android-build/debug.keystore android/app/debug.keystore
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          assert 'android {' in s
          bloco = """android {
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """
          open(p, 'w').write(s.replace('android {', bloco, 1))
          PY
          sed -n '1,22p' android/app/build.gradle

      - name: Gerar o APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Conferir a assinatura (tem de ser sempre a da chave fixa)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          QUERO=$(keytool -list -v -keystore ../android-build/debug.keystore -storepass android | grep -m1 'SHA256:' | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          TEM=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "chave fixa: $QUERO"
          echo "apk:        $TEM"
          if [ "$QUERO" != "$TEM" ]; then echo "ERRO: o APK não foi assinado com a chave fixa. O Android recusaria a atualização."; exit 1; fi

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../ClanMusic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClanMusic-apk
          path: ClanMusic.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: musica-apk-${{ github.run_number }}
          name: Clan music (Android) · versão 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: ClanMusic.apk

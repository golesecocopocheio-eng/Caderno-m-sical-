name: Gerar APK do Clã Speak (tradutor)

on:
  push:
    branches: [main, ccr-4277b803-nnu57g]
    paths: ['app/tradutor*', 'app/icons/tradutor*.svg', 'app/firebase-config.js', 'android-tradutor/**', '.github/workflows/apk-tradutor.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-tradutor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tradutor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor e os plugins de voz
        run: npm ci

      - name: Copiar só o tradutor (o app abre em index.html)
        run: |
          rm -rf www && mkdir -p www/icons www/vendor
          cp ../app/tradutor.html www/index.html
          cp ../app/tradutor.js ../app/tradutor.webmanifest ../app/firebase-config.js www/
          cp ../app/icons/tradutor.svg ../app/icons/tradutor-gato.svg www/icons/
          cp ../app/vendor/qrcode.js ../app/vendor/firebase-app-compat.js ../app/vendor/firebase-auth-compat.js ../app/vendor/firebase-firestore-compat.js www/vendor/

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Gerar ícones e tela de abertura
        run: npx capacitor-assets generate --android --iconBackgroundColor '#6d28d9' --splashBackgroundColor '#3b0764' --splashBackgroundColorDark '#3b0764'

      - name: Definir a versão do app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Usar sempre a mesma chave de assinatura (permite atualizar sem desinstalar)
        run: mkdir -p ~/.android && cp ../android-build/debug.keystore ~/.android/debug.keystore

      - name: Gerar o APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../ClaSpeak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClaSpeak-apk
          path: ClaSpeak.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tradutor-apk-${{ github.run_number }}
          name: Clã Speak (Android) · versão 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: ClaSpeak.apk
          body: |
            ## 🐱 Clã Speak · versão 1.${{ github.run_number }}
            Tradução de voz em tempo real, entre celulares (sala) ou frente a frente.

            ### 📥 Como instalar
            1. No celular Android, toque em **ClaSpeak.apk** aqui embaixo (abra no Chrome).
            2. Toque na notificação do download e em **Instalar** / **Atualizar**.
            3. Se o Android pedir, permita **instalar apps desconhecidos**.
            4. Na primeira vez que tocar no 🎤, permita o **microfone**.

            É um app separado do Bar Conect (os dois podem ficar instalados).
            O reconhecimento de voz usa o do Google: o app **Google** precisa estar instalado e atualizado.

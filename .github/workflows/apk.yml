name: Gerar APK Android

on:
  push:
    branches: [main, claude/caixar-portaria-app-101i7h]
    paths: ['app/**', 'android-build/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        run: npm install

      - name: Copiar o aplicativo (pasta app/)
        run: |
          rm -rf www && cp -r ../app www
          echo "1.${{ github.run_number }}" > www/versao.txt
          cp dados-iniciais.json www/dados-iniciais.json

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Gerar ícones e tela de abertura
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3b0764' --splashBackgroundColor '#12051f' --splashBackgroundColorDark '#12051f'

      - name: Ajustes do Android (abertura sem tela branca e câmera)
        run: python3 ajustar-android.py

      - name: Definir a versão do app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Usar sempre a mesma chave de assinatura (permite atualizar sem desinstalar)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Gerar o APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ../BarConect.apk
          cp ../BarConect.apk ../Bar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BarConect-apk
          path: BarConect.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bar Conect (Android) · versão 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            BarConect.apk
            Bar.apk
          body: |
            ## 🍸 Bar Conect · versão 1.${{ github.run_number }}
            **Caixa · Portaria · Estoque** do bar, num app só para Android.

            ### 📥 Como instalar
            1. No celular, toque em **BarConect.apk** aqui embaixo (abra no Chrome).
            2. Toque na notificação do download e em **Instalar** / **Atualizar**.
            3. Se o Android pedir, permita **instalar apps desconhecidos**.

            Instala **por cima** da versão anterior e **mantém todos os dados**.

            ### ✨ O que tem no app
            - 🍸 **Caixa**: fechamento do dia, painel com comissão, equipe, cofre, fornecedores, ficha técnica e custo das receitas
            - 🚪 **Portaria**: entradas da noite por categoria e forma de pagamento, QR Code para a equipe
            - 📦 **Estoque**: itens, compras, mínimo ideal e valor em estoque
            - 💲 **Preços**: foto da nota de compra atualiza a ficha técnica, o estoque e a tabela de preços
            - 📸 **Foto**: fechamento pelas fotos dos comprovantes das maquininhas (crédito + débito, Pix + QR Code)
            - 💾 **Backup**: backup completo, restaurar e histórico de alterações com "Voltar"
            - ⚙️ **Ajustes**: tamanho da letra, importar dados e versão do app

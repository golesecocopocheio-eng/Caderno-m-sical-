name: Gerar APK Android

on:
  push:
    branches: [main, claude/caixar-portaria-app-101i7h]
    paths: ['app/**', 'android-build/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        run: npm install

      - name: Copiar o aplicativo (pasta app/)
        run: |
          rm -rf www && cp -r ../app www
          echo "1.${{ github.run_number }}" > www/versao.txt

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Gerar ícones e tela de abertura
        run: npx capacitor-assets generate --android --iconBackgroundColor '#6d28d9' --splashBackgroundColor '#6d28d9'

      - name: Definir a versão do app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Usar sempre a mesma chave de assinatura (permite atualizar sem desinstalar)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Gerar o APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../Bar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bar-apk
          path: Bar.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Aplicativo do Bar (Android) · versão 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Bar.apk
          body: |
            Aplicativo do bar (Caixa, Portaria e Estoque) para Android.

            Como instalar: no celular Android, toque em **Bar.apk** abaixo para baixar,
            abra o arquivo e permita "instalar apps desconhecidos" quando o Android pedir.

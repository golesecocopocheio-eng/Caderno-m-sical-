name: Limpeza dos dados do bar (roda uma vez)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/limpeza-dados.yml']

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Apagar as versões do APK que levavam os dados do bar
        run: |
          for t in $APAGAR; do
            gh release delete "$t" --cleanup-tag -y -R "$REPO" && echo "apagada $t" || echo "falhou $t"
          done
        env:
          APAGAR: >-
            apk-100

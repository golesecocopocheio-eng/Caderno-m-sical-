name: Clan Music Studio no Chrome (pasta clan-music-studio do site)
# Só ADICIONA/ATUALIZA a pasta clan-music-studio/ no ramo gh-pages. Não mexe nos outros apps do site.
on:
  push:
    branches: [clan-music-rebuild]
    paths: ['clan-music/**', '.github/workflows/pages-clan-studio.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-clan-studio
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git rev-list --count HEAD > /tmp/versao.txt
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - run: |
          rm -rf site/clan-music-studio && mkdir site/clan-music-studio
          cp -r clan-music/. site/clan-music-studio/
          cp /tmp/versao.txt site/clan-music-studio/versao.txt
          cd site
          git config user.name "Clan music bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A clan-music-studio
          if git diff --cached --quiet; then echo "nada novo"; else git commit -m "Clan Music Studio: publica versão $(cat clan-music-studio/versao.txt)" && git push; fi

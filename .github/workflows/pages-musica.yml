name: Clan music no Chrome (pasta musica do site)
# Só ADICIONA/ATUALIZA a pasta musica/ no ramo gh-pages. Não mexe nos outros apps do site.
on:
  push:
    branches: [main, claude/caderno-musical-apk]
    paths: ['musica/**', '.github/workflows/pages-musica.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-musica
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git rev-list --count HEAD > /tmp/versao.txt
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - run: |
          rm -rf site/musica && mkdir site/musica
          cp -r musica/. site/musica/
          cp /tmp/versao.txt site/musica/versao.txt
          cd site
          git config user.name "Clan music bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A musica
          if git diff --cached --quiet; then echo "nada novo"; else git commit -m "Clan music: publica versão $(cat musica/versao.txt)" && git push; fi

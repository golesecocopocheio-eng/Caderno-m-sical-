<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixa bar</title>
<meta name="apple-mobile-web-app-title" content="Caixa bar">
<meta name="application-name" content="Caixa bar">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2f3f7;--card:#fff;--ink:#161826;--mute:#667085;--line:#dcdfe8;--acc:#6d28d9;--accT:#fff;--pos:#15803d;--neg:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1018;--card:#1a1b27;--ink:#ecedf6;--mute:#9aa0b5;--line:#2c2e40;--acc:#a78bfa;--accT:#17102e;--pos:#4ade80;--neg:#f87171}}
:root[data-theme="dark"]{--bg:#0f1018;--card:#1a1b27;--ink:#ecedf6;--mute:#9aa0b5;--line:#2c2e40;--acc:#a78bfa;--accT:#17102e;--pos:#4ade80;--neg:#f87171}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
h1{flex:1;margin:0;font:800 22px/1.2 -apple-system,"Segoe UI",Roboto,sans-serif}
h2{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
button.ic{padding:6px 12px;font-size:20px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.f{display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:10px;margin-bottom:8px}
.f label{color:var(--ink)}
.f input{text-align:right}
.tot{display:flex;justify-content:space-between;padding-top:8px;border-top:1px dashed var(--line);font-weight:700}
.r{display:flex;justify-content:space-between;padding:3px 0}
.big{font-size:22px;font-weight:800}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px}
.item small{display:block;color:var(--mute)}
pre{white-space:pre-wrap;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.hint{color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:18px;text-align:left;min-height:112px;box-shadow:0 1px 2px rgba(16,24,40,.06);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--tc);opacity:.08}
.tile:active{transform:scale(.97)}
.tile .tic{font-size:24px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent);margin-bottom:6px}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--mute);font-size:12.5px;line-height:1.3}
/* visual moderno das telas internas (Comissão, Equipe, Cofre, Fornecedores...) */
.card{border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.item{border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
button{border-radius:12px;transition:transform .12s}
button:active{transform:scale(.98)}
button.pri{box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 30%,transparent)}
input,textarea{border-radius:12px}
h2{font-weight:700}
.r{gap:12px;align-items:baseline}
.r>:last-child{white-space:nowrap;text-align:right;flex-shrink:0}
.tot>:last-child{white-space:nowrap}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script src="claude-local.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const BAR=[['bd','Dinheiro'],['bc','Cartão'],['bp','Pix']],POR=[['pd','Dinheiro'],['pc','Cartão'],['pp','Pix']],OUT=[['dj','DJ'],['ex','Extra bar']];
const KEYS=['fundo','cofre',...BAR.map(x=>x[0]),...POR.map(x=>x[0]),...OUT.map(x=>x[0]),'ad'];
let days={};try{days=JSON.parse(localStorage.getItem('caixa-bar')||'{}')}catch(e){}
let meta={};try{meta=JSON.parse(localStorage.getItem('caixa-bar-meta')||'{}')}catch(e){}
const CL={db:null,ready:false,busy:false,t:null,st:'☁️ Nuvem: conectando…'};
const cstat=m=>{CL.st=m;const e=document.querySelector('#cst');if(e)e.textContent=m};
const CS=()=>{try{return JSON.parse(localStorage.getItem('caixa-bar-sync')||'{}')}catch(e){return{}}};
const CSset=o=>{try{localStorage.setItem('caixa-bar-sync',JSON.stringify(o))}catch(e){}};
const hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length};
const cdocs=()=>{const o={},ms={};Object.keys(days).forEach(k=>{const m=k.slice(0,7);(ms[m]=ms[m]||{})[k]=days[k]});Object.keys(ms).forEach(m=>{o['cxdays/'+m]=JSON.stringify(ms[m])});Object.keys(meta).forEach(k=>{const j=JSON.stringify(meta[k]);if(j!==undefined)o['cxmeta/'+k]=j});return o};
const capply=(p,j,merge)=>{const id=p.split('/')[1],v=JSON.parse(j);if(p.startsWith('cxdays/')){if(merge){Object.keys(v).forEach(k=>{days[k]=v[k]})}else{Object.keys(days).filter(k=>k.slice(0,7)===id).forEach(k=>delete days[k]);Object.assign(days,v)}}else meta[id]=v};
const cloudSoon=()=>{if(!CL.ready)return;clearTimeout(CL.t);CL.t=setTimeout(()=>cloudPush(),1500)};
async function cloudPush(){if(!CL.ready||!CL.db)return;if(CL.busy){cloudSoon();return}CL.busy=true;try{const S=CS();S.h=S.h||{};const L=cdocs();let n=0;for(const p of Object.keys(L)){const h=hs(L[p]);if(S.h[p]===h)continue;const[c,id]=p.split('/');await CL.db.collection(c).doc(id).set({j:L[p],t:Date.now()});S.h[p]=h;n++;CSset(S)}cstat('☁️ Salvo na nuvem '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))}catch(e){cstat('⚠️ Não salvou na nuvem agora. Vou tentar de novo. Seus dados continuam neste celular.');clearTimeout(CL.t);CL.t=setTimeout(()=>cloudPush(),20000)}finally{CL.busy=false}}
async function cloudSync(){if(CL.busy)return;CL.busy=true;let pulled=0;try{if(typeof claude==='undefined'){cstat('☁️ Nuvem indisponível aqui. Salvando só neste celular.');return}const db=CL.db||(CL.db=await claude.use('db'));if(!db){cstat('☁️ Nuvem indisponível. Salvando só neste celular.');return}
const cloud={};for(const c of['cxdays','cxmeta']){const s=await db.collection(c).limit(1000).get();s.docs.forEach(d=>{const x=d.data();if(x&&x.j)cloud[c+'/'+d.id]=x})}
const S=CS(),first=!S.init,L=cdocs();S.h=S.h||{};
for(const p of new Set([...Object.keys(L),...Object.keys(cloud)])){const lj=L[p],c=cloud[p],last=S.h[p];if(c&&lj===undefined){capply(p,c.j);S.h[p]=hs(c.j);pulled++}else if(c){const ch=hs(c.j),lh=hs(lj);if(ch===lh){S.h[p]=lh}else if(first){if(p.startsWith('cxdays/')){const cv=JSON.parse(c.j),lv=JSON.parse(lj);const mg=Object.assign({},lv,cv);capply(p,JSON.stringify(mg))}else capply(p,c.j);S.h[p]=ch;pulled++}else if(last===lh){capply(p,c.j);S.h[p]=ch;pulled++}else if(last===ch){}else{if(p.startsWith('cxdays/'))capply(p,c.j,true);S.h[p]=ch}}}
S.init=1;CSset(S);if(pulled){persist()}CL.ready=true;CL.busy=false;if(pulled){cstat('☁️ Dados carregados da nuvem');if(document.querySelector('#bm'))home();else toast('Dados da nuvem carregados. Volte à tela inicial.')}await cloudPush()}catch(e){cstat('⚠️ Não consegui conectar à nuvem. Salvando só neste celular.')}finally{CL.busy=false}}
const persist=()=>{try{const a=JSON.stringify(days);localStorage.setItem('caixa-bar',a);localStorage.setItem('caixa-bar-meta',JSON.stringify(meta));if(localStorage.getItem('caixa-bar')!==a)throw 0;cloudSoon();return true}catch(e){toast('Não consegui gravar neste navegador. Copie o backup.');return false}};
const num=s=>{s=String(s||'').trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.split('.').join('');const n=parseFloat(s);return isNaN(n)?0:n};
const R=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const lbl=k=>new Date(k+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
const short=k=>new Date(k+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function calc(d){const g=k=>num(d[k]);const kk=Object.keys(days).find(x=>days[x]===d),fa=kk?fornDia(kk):0,fcsh=kk?fornDia(kk,true):0;const bar=g('bd')+g('bc')+g('bp'),por=g('pd')+g('pc')+g('pp'),vendas=bar+por,saidas=g('dj')+g('ex')+gsT(d);
 const din=g('bd')+g('pd'),car=g('bc')+g('pc'),pix=g('bp')+g('pp'),cofre=g('cofre'),sdn=gsT(d,'Dinheiro')+advT(d,'Dinheiro')+((d.ad_f||'Dinheiro')==='Dinheiro'?g('ad'):0)+['dj','ex'].reduce((a,x)=>a+((d[x+'_f']||'Dinheiro')==='Dinheiro'?g(x):0),0),cfg=cgx(d),esp=g('fundo')+din-sdn-cofre;
 return{cofre,bar,por,vendas,saidas,forn:fa,adiant:g('ad')+advT(d),res:bar,din,car,pix,esp,sdn,cfg,dif:(d.cont||'').trim()===''?null:num(d.cont)-esp}}
const sign=n=>n>0?'pos':n<0?'neg':'';

function home(){const ks=Object.keys(days).sort().reverse(),ym=today().slice(0,7);
 let mv=0,ms=0,mf=0,mr=0,mb=0,mdj=0,mex=0;ks.filter(k=>k.startsWith(ym)).forEach(k=>{const c=calc(days[k]);mv+=c.vendas;mb+=c.bar;mdj+=num(days[k].dj);mex+=num(days[k].ex);mr+=c.res;ms+=c.saidas;if(c.dif<0)mf-=c.dif});
 app.innerHTML=`<header><h1>Caixa do bar</h1></header>
 <button class="pri" id="hoje" style="width:100%;padding:14px;font-size:17px;margin-bottom:10px">${days[today()]?'Continuar fechamento de hoje':'Fechar o caixa de hoje'}</button>
 <div class="row" style="margin-bottom:14px"><input type="date" id="dt" value="${today()}" aria-label="Outra data"><button id="go">Abrir esta data</button></div>
 <div class="card"><h2>Mês atual</h2><div class="r"><span>Bar vendeu (sem portaria)</span><b>${R(mb)}</b></div><div class="r"><span>Vendas (bar + portaria)</span><b>${R(mv)}</b></div><div class="r"><span>Gasto com DJ</span><b>${R(mdj)}</b></div><div class="r"><span>Gasto com Extra bar</span><b>${R(mex)}</b></div><div class="r"><span>Pago a fornecedores</span><b>${R(FO(ym))}</b></div><div class="r"><span>Saídas (total)</span><b>${R(ms+FO(ym))}</b></div><div class="r"><span>Resultado</span><b class="${sign(mr)}">${R(mr)}</b></div>${mf?`<div class="r"><span>Dinheiro a menos no mês</span><b class="neg">${R(mf)}</b></div>`:''}</div>
  ${(()=>{const I=cxPainel();const T=(id,ic,cor,t,sub)=>`<button class="tile" id="${id}" style="--tc:${cor}"><span class="tic">${ic}</span><b>${t}</b><small>${sub}</small></button>`;
 return `<h2 style="margin-top:22px">Equipe e pagamentos</h2><div class="menu">`
 +T('sw','💰','#f59e0b','Comissão da semana','Semana de '+I.semana)
 +T('eq','👥','#3b82f6','Equipe',I.pessoas+' pessoas · vales '+R(I.vales))
 +T('pz','💼','#8b5cf6','Piso salarial','Salários e piso do mês')
 +T('cf','🔒','#10b981','Cofre do mês',R(I.cofre)+' guardado')
 +`</div><h2 style="margin-top:18px">Contas e controles</h2><div class="menu">`
 +T('fn','🧾','#ef4444','Fornecedores e contas',I.aPagar?I.aPagar+' com valor a pagar':'Tudo pago no mês')
 +T('pt0','🚪','#c2410c','Controle da portaria','Entradas e valores')
 +T('es','📦','#0ea5e9','Controle de estoque','Itens e compras')
 +T('ck','🍸','#ec4899','Ficha técnica','Receitas dos cocktails')
 +`</div><h2 style="margin-top:18px">Arquivo</h2><div class="menu">`
 +T('va','📁','#64748b',meta.verArq?'← Voltar':'Arquivados',meta.verArq?'Voltar aos fechamentos':I.arquivados+' fechamentos')
 +T('ar','📊','#14b8a6','Resumo geral','Todos os meses')
 +`</div>`})()}
 <div style="margin-top:22px"></div><h2>${meta.verArq?'Arquivados':'Fechamentos'}</h2>${ks.filter(k=>!!days[k].arq===!!meta.verArq).map(k=>{const c=calc(days[k]);return `<button class="item" data-k="${k}"><span><b>${short(k)}</b><small>Bar ${R(c.bar)} · Portaria ${R(c.por)}${c.dif<0?' · <span class="neg">A menos '+R(-c.dif)+'</span>':''}</small></span><b class="${sign(c.res)}">${R(c.res)}</b></button>`}).join('')||'<p class="hint">Nenhum fechamento ainda.</p>'}

 <p class="hint" id="cst" style="margin:8px 0 0">${CL.st}</p><button id="cls" style="width:100%;margin-top:4px">☁️ Sincronizar agora</button>
 <button class="pri" id="bm" style="width:100%;margin-top:8px">✉️ Enviar backup por e-mail</button><p class="hint" style="margin:4px 0 0">${meta.bkAt?'Último backup enviado: '+new Date(meta.bkAt).toLocaleDateString('pt-BR')+' '+new Date(meta.bkAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Você ainda não enviou nenhum backup.'}</p>
 <div class="row" style="margin-top:8px"><button id="bk">Copiar backup</button><button id="rs">Restaurar backup</button></div><div id="rsbox" style="margin-top:8px"></div><p class="hint" style="margin-top:16px">Atalho: no Chrome, toque em ⋮ e depois em <b>Adicionar à tela inicial</b>. O atalho vai se chamar <b>Caixa bar</b>.</p>`;
 $('#va').onclick=()=>{meta.verArq=!meta.verArq;home()};const ac=$('#ac');if(ac)ac.onclick=()=>copy(ks.filter(k=>days[k].arq).sort().map(k=>text(k)).join('\n\n'),'Relatórios copiados');$('#eq').onclick=()=>equipe(today().slice(0,7));$('#pz').onclick=()=>piso();$('#sw').onclick=()=>semana(wStart(today()));$('#cf').onclick=()=>cofre(today().slice(0,7));$('#fn').onclick=()=>forn(today().slice(0,7));$('#pt0').onclick=()=>portaria(today().slice(0,7));$('#ar').onclick=()=>arquivo(today().slice(0,7));$('#ck').onclick=()=>fichas();$('#es').onclick=()=>estoque();$('#hoje').onclick=()=>edit(today());$('#go').onclick=()=>{if($('#dt').value)edit($('#dt').value)};
 document.querySelectorAll('.item').forEach(b=>b.onclick=()=>edit(b.dataset.k));
 $('#cls').onclick=async()=>{cstat('☁️ Sincronizando…');await cloudSync();await cloudPush();if(document.querySelector('#bm'))home()};
 $('#bk').onclick=()=>copy(JSON.stringify({days,meta}),'Backup copiado. Cole em uma conversa sua para guardar.');
 $('#bm').onclick=async()=>{const js=JSON.stringify({days,meta}),nome='caixa-bar-backup-'+today()+'.json',ok=()=>{meta.bkAt=Date.now();persist();home()};
  try{const f=new File([js],nome,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup Caixa bar '+today(),text:'Backup do Caixa bar. Guarde este arquivo.'});ok();return}}catch(e){if(e&&e.name==='AbortError')return}
  await copy(js,'Backup copiado. Cole no e-mail.');mail('Backup Caixa bar - '+today(),'Cole aqui o backup (ele já foi copiado):\n\n');ok()};
 $('#rs').onclick=()=>{$('#rsbox').innerHTML='<textarea id="bt" rows="4" placeholder="Cole aqui o backup copiado"></textarea><button class="pri" id="bgo" style="width:100%;margin-top:8px">Restaurar</button>';$('#bgo').onclick=()=>{const t=$('#bt').value.trim();if(!t)return toast('Cole o backup primeiro.');try{const o=JSON.parse(t);if(typeof o!=='object')throw 0;if(o.days){Object.assign(days,o.days);meta=o.meta||meta}else Object.assign(days,o);persist();toast('Backup restaurado');home()}catch(e){toast('Backup inválido.')}}}}

const advT=(d,f)=>{const k=Object.keys(days).find(x=>days[x]===d);return k?(meta.adv||[]).filter(a=>a.d===k&&(!f||(a.f||'Dinheiro')===f)).reduce((s,a)=>s+num(a.v),0):0};
const gsT=(d,f)=>(d.gs||[]).reduce((a,y)=>a+((!f||(y.f||'Dinheiro')===f)?num(y.v):0),0);
const cgx=d=>['dj','ex','ad'].reduce((a,x)=>a+((d[x+'_f'])==='Cofre'?num(d[x]):0),0)+gsT(d,'Cofre')+advT(d,'Cofre');
const saldoAte=k=>(+meta.base||0)+Object.keys(days).filter(x=>x<=k).reduce((s,x)=>s+num(days[x].cofre)-cgx(days[x]),0)-(meta.cfOut||[]).filter(s=>s.d<=k).reduce((a,s)=>a+num(s.v),0);
function cofre(ym){
 const ks=Object.keys(days).sort().filter(k=>k.startsWith(ym)&&String(days[k].cofre||'').trim()!=='');
 const nm=new Date(ym+'-15T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 const mv=n=>{const d=new Date(ym+'-15T12:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
 const sums=()=>{$('#tm').textContent=M(ks.reduce((s,k)=>s+num(days[k].cofre),0));$('#ta').textContent=M(saldoAte('9999'));$('#tt').value=saldoAte('9999').toFixed(2).replace('.',',');ks.forEach(k=>{const e=$('#s_'+k);if(e)e.textContent='Saldo '+M(saldoAte(k))})};
 app.innerHTML=`<header><button class="ic" id="back" aria-label="Voltar">‹</button><h1>Cofre</h1></header>
 <div style="display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;margin-bottom:12px"><button id="pm" aria-label="Mês anterior">‹</button><b style="text-align:center;text-transform:capitalize">${nm}</b><button id="nx" aria-label="Próximo mês">›</button></div>

  const f=(meta.fin||{})[m]||{};Object.values(f).forEach(x=>{const pago=(x.pays||[]).reduce((s,y)=>s+num(y.v),0);if(num(x.due)-pago>0.009)o.aPagar++})}catch(e){}
 return o}

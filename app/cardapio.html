<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio e Vendas</title>
<style>
:root{color-scheme:light;--bg:#f2f3f7;--card:#fff;--tx:#161826;--mut:#667085;--ac:#6d28d9;--on:#fff;--bd:#dcdfe8;--ok:#15803d;--bad:#b91c1c;--am:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1018;--card:#1a1b27;--tx:#ecedf6;--mut:#9aa0b5;--ac:#a78bfa;--on:#17102e;--bd:#2c2e40;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1018;--card:#1a1b27;--tx:#ecedf6;--mut:#9aa0b5;--ac:#a78bfa;--on:#17102e;--bd:#2c2e40;--ok:#4ade80;--bad:#f87171}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 150px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:8px 0 12px}
.tabs button{border:0;background:none;color:var(--tx);padding:9px 2px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.2}
.tabs button.on{background:var(--ac);color:var(--on)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 12px;font-size:13.5px}
.cats button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod button{position:relative;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 10px;min-height:74px;font-size:14.5px;font-weight:600;line-height:1.25}
.prod button small{display:block;color:var(--ac);font-weight:800;font-size:15px;margin-top:6px}
.prod button .qt{position:absolute;top:6px;right:6px;background:var(--ac);color:var(--on);border-radius:99px;min-width:22px;height:22px;font-size:12.5px;display:grid;place-items:center;padding:0 6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:14.5px}
.it:first-of-type{border-top:0}
.it small{display:block;color:var(--mut);font-size:12.5px}
.q{display:flex;align-items:center;gap:6px}.q button{width:32px;height:32px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;line-height:1}
.q b{min-width:22px;text-align:center}
.carrinho{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -8px 24px rgba(0,0,0,.12);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.carrinho .in{max-width:560px;margin:0 auto}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:700;font-size:16px;margin-top:8px}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.pgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:14px 6px;font-size:15px;font-weight:700}
.pgs button.on{border-color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.opc{display:flex;flex-direction:column;gap:6px}
.opc button{text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 12px;font-size:14.5px}
.opc button.on{border-color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.opc button small{display:block;color:var(--mut);font-size:12px}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
label{display:block;font-size:12.5px;color:var(--mut);margin-top:8px}
.tot{font-size:28px;font-weight:800}
.big{font-size:22px;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font-size:17px}.grid3 span{font-size:12px;color:var(--mut)}
.msg{color:var(--mut);font-size:13px;margin:8px 0;text-align:center}
.link{border:0;background:none;color:var(--ac);font-size:14px;padding:0;font-weight:600}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:4px 6px}
.fundo{position:fixed;inset:0;background:rgba(8,6,20,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.qr{display:flex;justify-content:center;background:#fff;border-radius:14px;padding:12px;margin:8px auto;width:fit-content}
.copia{font:12px/1.3 monospace;word-break:break-all;background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:8px}
.foto{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px;border-radius:14px;background:var(--ac);color:var(--on);font-weight:700;cursor:pointer;margin-top:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);font-weight:600;white-space:nowrap}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:90vw;text-align:center}
.prev .it input{padding:6px 8px;font-size:14.5px}
</style>
<script src="claude-local.js"></script>
<script src="vendor/qrcode.js"></script>
</head>
<body>
<main id="app"><h1>🍽️ Cardápio</h1><p class="sub">Carregando…</p></main>
<div class="carrinho" id="carrinho" hidden></div>
<div class="toast" id="toast"></div>
<script>
/* Cardápio e vendas do bar.
   - Cardápio: itens por categoria, montado pela foto do cardápio (leitura do texto) ou à mão.
   - Vender: toca nos itens, cobra em Dinheiro (com troco), Pix (QR Code com o valor, na conta
     escolhida), Crédito ou Débito (na maquininha escolhida).
   - Vendas: totais da noite por forma de pagamento, maquininha e conta; aplica no Caixa.
   Sincroniza ao vivo entre os celulares quando a nuvem está ligada. */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nv=v=>{let s=String(v??'').trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isNaN(n)?0:n};
const campo=v=>(Math.round(v*100)/100).toFixed(2).replace('.',',');
const noiteDe=t=>new Date(t-6*3600e3).toLocaleDateString('sv-SE');
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};
const PG={dinheiro:'💵 Dinheiro',pix:'⚡ Pix',credito:'💳 Crédito',debito:'💳 Débito'};
const CFG0={maquinas:[{id:'mp',n:'Mercado Pago (Point)'},{id:'sant',n:'Santander (Getnet)'}],contas:[{id:'cmp',n:'Mercado Pago',tipo:'Conta digital',chave:'',nome:'',cidade:''},{id:'csant',n:'Santander',tipo:'Banco físico',chave:'',nome:'',cidade:''}]};
let db=null,dono=true,me='',itens=[],vendas=[],cfg=JSON.parse(JSON.stringify(CFG0)),aba='vender',cat='',carrinho={},ver=noiteDe(Date.now()),leitura=null,folha=null,carAberto=false;

/* ---------- Pix: BR Code (copia e cola) com o valor, para a chave da conta ---------- */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
const semAcento=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').trim();
function pixCodigo(conta,valor){
  const chave=String(conta.chave||'').trim();if(!chave)return '';
  const nome=(semAcento(conta.nome)||'BAR').toUpperCase().slice(0,25),cid=(semAcento(conta.cidade)||'BRASIL').toUpperCase().slice(0,15);
  let p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',chave))+tlv('52','0000')+tlv('53','986');
  if(valor>0)p+=tlv('54',valor.toFixed(2));
  p+=tlv('58','BR')+tlv('59',nome)+tlv('60',cid)+tlv('62',tlv('05','***'))+'6304';
  return p+crc16(p);
}
window.__pixCodigo=pixCodigo;

/* ---------- Leitura do cardápio pela foto ---------- */
function lerCardapio(txt){
  const linhas=String(txt||'').split(/\n/).map(l=>l.replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  const out=[];let categoria='Cardápio',pendente='';
  const PRECO=/(?:R\s?\$\s*)?(\d{1,4}(?:[.,]\d{2}))\s*$/;
  for(const l of linhas){
    const m=l.match(PRECO);
    if(m){
      let nome=l.slice(0,m.index).replace(/[.\-–—·…:=]+\s*$/,'').replace(/\s*R\s?\$?\s*$/,'').trim();
      if(!/[A-Za-zÀ-ú]{2}/.test(nome)&&pendente){nome=pendente}
      else if(pendente&&nome.length<4){nome=pendente+' '+nome}
      pendente='';
      const p=nv(m[1]);
      if(/[A-Za-zÀ-ú]{2}/.test(nome)&&p>0&&p<5000)out.push({n:nome.replace(/^[\d\W]+/,'').trim()||nome,c:categoria,p,ok:true});
    }else if(/[A-Za-zÀ-ú]{3}/.test(l)&&l.length<=40){
      const letras=l.replace(/[^A-Za-zÀ-ú]/g,'');
      const maiusc=letras&&letras===letras.toUpperCase();
      if(maiusc&&letras.length>=3){categoria=l.replace(/[^\wÀ-ú &/-]/g,'').trim();pendente=''}
      else pendente=l;
    }
  }
  return out;
}
window.__lerCardapio=lerCardapio;

/* ---------- cálculo ---------- */
const ativos=()=>itens.filter(i=>i.on!==false);
const categorias=()=>{const c=[];itens.forEach(i=>{const k=i.c||'Outros';if(!c.includes(k))c.push(k)});return c};
const totalCarrinho=()=>Object.entries(carrinho).reduce((s,[id,q])=>{const i=itens.find(x=>x.id===id);return s+(i?i.p*q:0)},0);
const qtdCarrinho=()=>Object.values(carrinho).reduce((a,b)=>a+b,0);
const daNoite=()=>vendas.filter(v=>v.noite===ver).sort((a,b)=>b.t-a.t);
function resumo(lista){
  const r={total:0,n:lista.length,pg:{dinheiro:0,pix:0,credito:0,debito:0},via:{},itens:{}};
  lista.forEach(v=>{r.total+=v.total;r.pg[v.pg]=(r.pg[v.pg]||0)+v.total;if(v.via){r.via[v.via]=(r.via[v.via]||0)+v.total}
    (v.itens||[]).forEach(x=>{const k=x.n;r.itens[k]=r.itens[k]||{q:0,v:0};r.itens[k].q+=x.q;r.itens[k].v+=x.p*x.q})});
  return r;
}
const nomeVia=id=>{const m=cfg.maquinas.find(x=>x.id===id);if(m)return m.n;const c=cfg.contas.find(x=>x.id===id);return c?c.n:id};

/* ---------- desenho ---------- */
function draw(){
  const a=document.activeElement;if(a&&a.dataset&&a.dataset.k&&!folha)return;
  let h=`<h1>🍽️ Cardápio e vendas</h1><div class="tabs">${[['vender','🛒 Vender'],['cardapio','📋 Cardápio'],['vendas','📊 Vendas'],['pag','💳 Receber']].map(([k,n])=>`<button data-aba="${k}" class="${aba===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(aba==='vender')h+=telaVender();
  else if(aba==='cardapio')h+=telaCardapio();
  else if(aba==='vendas')h+=telaVendas();
  else h+=telaPag();
  $('#app').innerHTML=h;
  desenharCarrinho();
}
function telaVender(){
  const A=ativos();if(!A.length)return `<div class="card"><p class="sub" style="margin:0">O cardápio está vazio. Vá em <b>📋 Cardápio</b> e tire uma foto do seu cardápio (ou adicione os itens).</p><button class="btn" data-aba="cardapio">📋 Montar o cardápio</button></div>`;
  const C=categorias().filter(c=>A.some(i=>(i.c||'Outros')===c));if(cat&&!C.includes(cat))cat='';
  let h=`<div class="cats"><button data-cat="" class="${!cat?'on':''}">Tudo</button>${C.map(c=>`<button data-cat="${esc(c)}" class="${cat===c?'on':''}">${esc(c)}</button>`).join('')}</div>`;
  (cat?[cat]:C).forEach(c=>{const l=A.filter(i=>(i.c||'Outros')===c).sort((x,y)=>(x.o??0)-(y.o??0)||x.n.localeCompare(y.n,'pt'));if(!l.length)return;
    h+=`${cat?'':`<h2 style="margin:12px 2px 6px">${esc(c)}</h2>`}<div class="prod">${l.map(i=>`<button data-add="${i.id}">${esc(i.n)}<small>${R(i.p)}</small>${carrinho[i.id]?`<span class="qt">${carrinho[i.id]}</span>`:''}</button>`).join('')}</div>`});
  return h;
}
function desenharCarrinho(){
  const el=$('#carrinho');const n=qtdCarrinho();
  if(aba!=='vender'||!n){el.hidden=true;return}
  el.hidden=false;
  const linhas=Object.entries(carrinho).map(([id,q])=>{const i=itens.find(x=>x.id===id);return i?`<div class="it"><span>${esc(i.n)}<small>${R(i.p)} cada</small></span><span class="q"><button data-menos="${id}">−</button><b>${q}</b><button data-mais="${id}">+</button></span><b style="min-width:76px;text-align:right">${R(i.p*q)}</b></div>`:''}).join('');
  el.innerHTML=`<div class="in"><details id="carDet"${carAberto?' open':''}><summary class="row" style="justify-content:space-between;list-style:none;cursor:pointer"><span>🛒 <b>${n}</b> ${n>1?'itens':'item'} · <span class="link">ver</span></span><span class="big">${R(totalCarrinho())}</span></summary><div style="max-height:34vh;overflow:auto;margin-top:6px">${linhas}</div><button class="btn sec" id="limpar" style="margin-top:6px">Limpar</button></details><button class="btn ok" id="cobrar">Cobrar ${R(totalCarrinho())}</button></div>`;
}
function telaCardapio(){
  let h='';
  if(dono)h+=`<div class="card"><h2>📷 Montar pela foto do cardápio</h2><p class="sub">Tire uma foto bem reta e com luz do cardápio impresso (ou escolha da galeria). O app lê nomes e preços e monta o cardápio digital. Você confere antes de salvar.</p>
    <div class="row"><label class="foto" style="flex:1;margin:0">📷 Tirar foto<input type="file" id="fotoCam" accept="image/*" capture="environment" hidden></label><label class="foto" style="flex:1;margin:0;background:#4c1d95;color:#fff">🖼️ Galeria<input type="file" id="fotoGal" accept="image/*" multiple hidden></label></div>
    <p class="msg" id="fotoMsg">${leitura&&leitura.msg?esc(leitura.msg):''}</p></div>`;
  if(leitura&&leitura.itens&&leitura.itens.length){
    h+=`<div class="card prev"><h2>Confira o que foi lido (${leitura.itens.length})</h2><p class="sub">Corrija nome, categoria e preço. Desmarque o que não for item.</p>${leitura.itens.map((x,k)=>`<div class="it" style="align-items:flex-start"><input type="checkbox" data-lk="ok" data-li="${k}" ${x.ok?'checked':''} style="width:22px;height:22px;margin-top:8px"><div style="flex:1;display:grid;grid-template-columns:1fr 92px;gap:6px"><input data-k="ln" data-lk="n" data-li="${k}" value="${esc(x.n)}"><input data-k="lp" data-lk="p" data-li="${k}" value="${campo(x.p)}" inputmode="decimal" style="text-align:right"><input data-k="lc" data-lk="c" data-li="${k}" value="${esc(x.c)}" style="grid-column:1/3;font-size:13px;color:var(--mut)"></div></div>`).join('')}
    <button class="btn ok" id="lerSalvar">✅ Adicionar ${leitura.itens.filter(x=>x.ok).length} itens ao cardápio</button><button class="btn sec" id="lerDescartar">Descartar leitura</button></div>`;
  }
  const C=categorias();
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">📋 Cardápio (${itens.length})</h2>${dono?'<button class="link" id="novoBtn">+ Item</button>':''}</div>`;
  if(dono)h+=`<div id="novoBox" hidden><div style="display:grid;grid-template-columns:1fr 100px;gap:6px;margin-top:8px"><input data-k="nn" id="nn" placeholder="Nome do item"><input data-k="np" id="np" inputmode="decimal" placeholder="Preço" style="text-align:right"><input data-k="nc" id="nc" list="catsL" placeholder="Categoria (ex.: Drinks)" style="grid-column:1/3"></div><datalist id="catsL">${C.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><button class="btn" id="novoOk">Salvar item</button></div>`;
  if(!itens.length)h+='<p class="sub" style="margin-top:8px">Nenhum item ainda.</p>';
  C.forEach(c=>{const l=itens.filter(i=>(i.c||'Outros')===c).sort((x,y)=>x.n.localeCompare(y.n,'pt'));
    h+=`<h2 style="margin:14px 0 2px">${esc(c)} <span class="chip">${l.length}</span></h2>`+l.map(i=>dono?`<div class="it"><div style="flex:1;display:grid;grid-template-columns:1fr 92px;gap:6px"><input data-k="en" data-ed="n" data-id="${i.id}" value="${esc(i.n)}" style="${i.on===false?'opacity:.5':''}"><input data-k="ep" data-ed="p" data-id="${i.id}" value="${campo(i.p)}" inputmode="decimal" style="text-align:right"></div><button class="x" data-on="${i.id}" title="${i.on===false?'Mostrar na venda':'Esconder da venda'}">${i.on===false?'🙈':'👁️'}</button><button class="x" data-del="${i.id}">✕</button></div>`
      :`<div class="it"><span>${esc(i.n)}</span><b>${R(i.p)}</b></div>`).join('')});
  h+='</div>';
  if(itens.length)h+=`<button class="btn sec" id="copiarCard">📋 Copiar cardápio (texto para WhatsApp)</button>`;
  return h;
}
function telaVendas(){
  const L=daNoite(),r=resumo(L),hoje=noiteDe(Date.now());
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Noite de ${ver.split('-').reverse().join('/')}</h2><input type="date" id="dia" value="${ver}" style="width:auto;padding:6px"></div>
  <div class="tot" style="margin-top:8px">${R(r.total)}</div><p class="sub">${r.n} ${r.n===1?'venda':'vendas'}${ver===hoje?' · hoje':''}</p>
  <div class="grid3"><div><b>${R(r.pg.dinheiro)}</b><span>Dinheiro</span></div><div><b>${R(r.pg.credito+r.pg.debito)}</b><span>Cartão (créd.+déb.)</span></div><div><b>${R(r.pg.pix)}</b><span>Pix</span></div></div></div>`;
  const vias=Object.entries(r.via);
  if(vias.length)h+=`<div class="card"><h2>Por maquininha e conta</h2>${vias.map(([k,v])=>`<div class="it"><span>${esc(nomeVia(k))}</span><b>${R(v)}</b></div>`).join('')}<div class="it"><span>Crédito</span><b>${R(r.pg.credito)}</b></div><div class="it"><span>Débito</span><b>${R(r.pg.debito)}</b></div></div>`;
  const top=Object.entries(r.itens).sort((a,b)=>b[1].v-a[1].v);
  if(top.length)h+=`<div class="card"><h2>Mais vendidos</h2>${top.slice(0,15).map(([n,x])=>`<div class="it"><span>${esc(n)}<small>${x.q} un</small></span><b>${R(x.v)}</b></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>Vendas</h2>${L.length?L.slice(0,60).map(v=>`<div class="it"><span>${new Date(v.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${PG[v.pg]||v.pg}${v.via?' · '+esc(nomeVia(v.via)):''}<small>${(v.itens||[]).map(x=>x.q+'× '+esc(x.n)).join(', ')}${v.quem?' · '+esc(v.quem):''}</small></span><span class="row"><b>${R(v.total)}</b>${dono?`<button class="x" data-vdel="${v.id}">✕</button>`:''}</span></div>`).join(''):'<p class="sub" style="margin:0">Nenhuma venda nesta noite.</p>'}</div>`;
  if(L.length){h+=`<button class="btn" id="relBtn">📋 Copiar relatório da noite</button>`;if(dono)h+=`<button class="btn ok" id="caixaBtn">✅ Aplicar no Caixa (bar) de ${ver.split('-').reverse().join('/')}</button>`;h+=`<p class="msg" id="vMsg"></p>`}
  return h;
}
function telaPag(){
  let h=`<div class="card"><h2>💳 Maquininhas</h2><p class="sub">Na hora de cobrar no cartão você escolhe em qual maquininha passou. Assim as vendas ficam separadas por máquina.</p>${cfg.maquinas.map((m,k)=>`<div class="it"><input data-k="mq" data-mq="${k}" value="${esc(m.n)}" ${dono?'':'readonly'}>${dono?`<button class="x" data-mqdel="${k}">✕</button>`:''}</div>`).join('')}${dono?'<button class="link" id="mqNova" style="margin-top:8px">+ Maquininha</button>':''}</div>`;
  h+=`<div class="card"><h2>🏦 Contas (Pix)</h2><p class="sub">Cadastre a <b>chave Pix</b> de cada conta. Na venda em Pix o app mostra um <b>QR Code já com o valor</b>: o cliente paga direto na sua conta.</p>${cfg.contas.map((c,k)=>`<div class="card" style="margin:8px 0;background:var(--bg)"><div class="row" style="justify-content:space-between"><b>${esc(c.n)}</b><span class="chip">${esc(c.tipo||'')}</span></div>
    <label>Nome da conta<input data-k="ct" data-ct="${k}" data-cf="n" value="${esc(c.n)}" ${dono?'':'readonly'}></label>
    <label>Tipo<input data-k="ct" data-ct="${k}" data-cf="tipo" value="${esc(c.tipo||'')}" placeholder="Banco físico / Conta digital" ${dono?'':'readonly'}></label>
    <label>Chave Pix (CPF, CNPJ, celular +55…, e-mail ou aleatória)<input data-k="ct" data-ct="${k}" data-cf="chave" value="${esc(c.chave||'')}" autocapitalize="none" ${dono?'':'readonly'}></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label>Nome do recebedor<input data-k="ct" data-ct="${k}" data-cf="nome" value="${esc(c.nome||'')}" placeholder="Como no banco" ${dono?'':'readonly'}></label><label>Cidade<input data-k="ct" data-ct="${k}" data-cf="cidade" value="${esc(c.cidade||'')}" ${dono?'':'readonly'}></label></div>
    ${dono?`<button class="link" data-ctdel="${k}" style="margin-top:8px;color:var(--bad)">Remover conta</button>`:''}</div>`).join('')}${dono?'<button class="link" id="ctNova">+ Conta</button>':''}</div>`;
  h+=`<div class="card"><h2>🔌 Ligação automática com a maquininha</h2><p class="sub" style="margin:0">Hoje o valor é passado na maquininha e confirmado aqui com um toque. A ligação automática (o app manda o valor direto para a maquininha) é possível com a <b>Mercado Pago Point</b>, usando a chave de integração da sua conta Mercado Pago. Para a <b>Santander/Getnet</b>, a ligação depende de liberação comercial do banco.</p></div>`;
  if(!dono)h+='<p class="msg">Só o dono altera maquininhas e contas.</p>';
  return h;
}

/* ---------- cobrança ---------- */
function abrirCobranca(){
  const total=totalCarrinho();if(!total)return;
  folha={pg:'',via:'',recebido:''};desenharFolha();
}
function desenharFolha(){
  let f=$('#folha');if(!folha){if(f)f.remove();return}
  if(!f){f=document.createElement('div');f.id='folha';f.className='fundo';document.body.appendChild(f);f.addEventListener('click',e=>{if(e.target===f){folha=null;desenharFolha()}})}
  const total=totalCarrinho(),F=folha;
  let h=`<div class="folha"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Cobrar</h2><button class="x" id="fFechar">✕</button></div><div class="tot" style="text-align:center;margin:6px 0 10px">${R(total)}</div>
  <div class="pgs">${Object.entries(PG).map(([k,n])=>`<button data-pg="${k}" class="${F.pg===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(F.pg==='dinheiro'){const rec=nv(F.recebido),tr=rec-total;
    h+=`<label>Valor recebido<input data-k="rec" id="rec" inputmode="decimal" placeholder="${campo(total)}" value="${esc(F.recebido)}" style="font-size:20px;text-align:right"></label><div class="row" style="gap:6px;margin-top:6px">${[total,...[10,20,50,100,200].filter(v=>v>total).slice(0,3)].map(v=>`<button class="btn sec" style="margin:0;padding:9px" data-rec="${v}">${R(v)}</button>`).join('')}</div>
    <p class="big" style="text-align:center;margin:12px 0 0;color:${tr<0?'var(--bad)':'var(--ok)'}">${rec?(tr<0?'Falta '+R(-tr):'Troco '+R(tr)):''}</p>`}
  if(F.pg==='credito'||F.pg==='debito'){
    h+=`<label>Qual maquininha?</label><div class="opc">${cfg.maquinas.map(m=>`<button data-via="${m.id}" class="${F.via===m.id?'on':''}">${esc(m.n)}</button>`).join('')}</div>`;
    if(F.via)h+=`<p class="msg" style="font-size:15px">Passe <b>${R(total)}</b> no <b>${F.pg==='credito'?'crédito':'débito'}</b> da <b>${esc(nomeVia(F.via))}</b> e confirme quando aprovar.</p>`}
  if(F.pg==='pix'){
    h+=`<label>Receber em qual conta?</label><div class="opc">${cfg.contas.map(c=>`<button data-via="${c.id}" class="${F.via===c.id?'on':''}">${esc(c.n)}<small>${esc(c.tipo||'')}${c.chave?' · chave '+esc(c.chave):' · sem chave Pix cadastrada'}</small></button>`).join('')}</div>`;
    const c=cfg.contas.find(x=>x.id===F.via);
    if(c){const cod=pixCodigo(c,total);
      if(cod){let img='';try{const q=qrcode(0,'M');q.addData(cod);q.make();img=q.createImgTag(5,0)}catch(e){}
        h+=`<div class="qr">${img}</div><p class="msg">O cliente lê o QR Code no app do banco e paga <b>${R(total)}</b> direto na conta <b>${esc(c.n)}</b>. Confira no extrato e confirme.</p><div class="copia" id="pixCod">${esc(cod)}</div><button class="btn sec" id="pixCopiar">📋 Copiar Pix copia e cola</button>`}
      else h+=`<p class="msg">Essa conta não tem chave Pix. ${dono?'Cadastre em <b>💳 Receber</b>.':'Peça ao dono para cadastrar.'} Você ainda pode confirmar se o cliente pagou pelo QR Code da conta.</p>`}}
  const pode=F.pg&&(F.pg==='dinheiro'?(!F.recebido||nv(F.recebido)>=total):!!F.via);
  h+=`<button class="btn ok" id="fConfirmar" ${pode?'':'disabled'}>✅ Confirmar venda</button></div>`;
  f.innerHTML=h;
}
async function confirmarVenda(){
  const total=totalCarrinho();if(!total||!folha||!folha.pg)return;
  const lista=Object.entries(carrinho).map(([id,q])=>{const i=itens.find(x=>x.id===id);return i?{i:id,n:i.n,p:i.p,q}:null}).filter(Boolean);
  const t=Date.now(),v={itens:lista,total:Math.round(total*100)/100,pg:folha.pg,noite:noiteDe(t),t,quem:(localStorage.getItem('bar-nome')||'').trim()};
  if(folha.via)v.via=folha.via;
  if(folha.pg==='dinheiro'&&nv(folha.recebido)){v.recebido=nv(folha.recebido);v.troco=Math.round((v.recebido-total)*100)/100}
  try{await db.collection('vendas').add(v);carrinho={};folha=null;desenharFolha();ver=noiteDe(Date.now());toast('✅ Venda de '+R(v.total)+' registrada'+(v.troco?' · troco '+R(v.troco):''));draw()}
  catch(e){toast('Não consegui salvar a venda: '+(e.message||e))}
}

/* ---------- relatório e Caixa ---------- */
function relatorio(){
  const L=daNoite(),r=resumo(L);
  const T=['*VENDAS DO CARDÁPIO - '+ver.split('-').reverse().join('/')+'*','','*DINHEIRO*: '+R(r.pg.dinheiro),'*CARTÃO*: '+R(r.pg.credito+r.pg.debito)+' (crédito '+R(r.pg.credito)+' · débito '+R(r.pg.debito)+')','*PIX*: '+R(r.pg.pix),'_Total_: '+R(r.total)+' · '+r.n+' vendas'];
  const vias=Object.entries(r.via);if(vias.length){T.push('','*POR MAQUININHA / CONTA*');vias.forEach(([k,v])=>T.push(nomeVia(k)+': '+R(v)))}
  const top=Object.entries(r.itens).sort((a,b)=>b[1].v-a[1].v);if(top.length){T.push('','*ITENS*');top.forEach(([n,x])=>T.push(x.q+'× '+n+': '+R(x.v)))}
  return T.join('\n');
}
let armado=false;
function aplicarCaixa(){
  const r=resumo(daNoite()),P=window.parent,msg=$('#vMsg');
  let days={};try{days=JSON.parse(P.localStorage.getItem('caixa-bar'))||{}}catch(e){}
  const dia=days[ver]||{},novo={bd:campo(r.pg.dinheiro),bc:campo(r.pg.credito+r.pg.debito),bp:campo(r.pg.pix)};
  if(!armado){armado=true;msg.textContent='Vou gravar no Caixa (bar) de '+ver.split('-').reverse().join('/')+': Dinheiro '+(dia.bd||'vazio')+' → '+novo.bd+' · Cartão '+(dia.bc||'vazio')+' → '+novo.bc+' · Pix '+(dia.bp||'vazio')+' → '+novo.bp+'. Toque de novo para confirmar.';setTimeout(()=>armado=false,8000);return}
  armado=false;days[ver]=Object.assign({},dia,novo);P.localStorage.setItem('caixa-bar',JSON.stringify(days));
  try{const f=P.document.getElementById('f-caixa');if(f&&f.src)f.contentWindow.location.reload()}catch(e){}
  msg.textContent='✅ Aplicado no Caixa de '+ver.split('-').reverse().join('/')+'. Abra a aba Caixa para conferir.';
}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast('✅ Copiado')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('✅ Copiado')}catch(x){toast('Não consegui copiar')}a.remove()}}

/* ---------- foto do cardápio ---------- */
async function lerFotos(e){
  const arqs=[...(e.target.files||[])];e.target.value='';if(!arqs.length)return;
  const ocr=window.parent&&window.parent.__barOCR;if(!ocr){toast('A leitura de foto só funciona dentro do app.');return}
  leitura={itens:(leitura&&leitura.itens)||[],msg:'Lendo a foto… (a primeira vez demora um pouco)'};draw();
  for(const [k,a] of arqs.entries()){
    try{const r=await ocr(a,m=>{if(m.status==='recognizing text'){const el=$('#fotoMsg');if(el)el.textContent='Lendo a foto '+(k+1)+'/'+arqs.length+'… '+Math.round(m.progress*100)+'%'}},2200);
      const novos=lerCardapio(r.texto);leitura.itens.push(...novos)}
    catch(err){leitura.msg='Não consegui ler a foto: '+(err.message||err)}
  }
  leitura.msg=leitura.itens.length?'✅ Li '+leitura.itens.length+' itens. Confira abaixo.':'Não achei itens com preço. Tente uma foto mais reta, perto e com luz, ou adicione à mão.';
  draw();
}
async function salvarLeitura(){
  const ok=leitura.itens.filter(x=>x.ok&&x.n.trim()&&x.p>0);let n=0;
  for(const x of ok){const ja=itens.find(i=>i.n.toLowerCase()===x.n.trim().toLowerCase());
    if(ja)await db.collection('itens').doc(ja.id).set({...strip(ja),p:x.p,c:x.c.trim()||ja.c});
    else await db.collection('itens').add({n:x.n.trim(),c:x.c.trim()||'Cardápio',p:x.p,on:true,t:Date.now()});n++}
  leitura=null;toast('✅ '+n+' itens no cardápio');aba='cardapio';draw();
}
const strip=i=>{const o={...i};delete o.id;return o};
async function salvarCfg(){try{await db.doc('config/pagamento').set(JSON.parse(JSON.stringify(cfg)))}catch(e){toast('Sem permissão para alterar')}}

/* ---------- eventos ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.aba){aba=d.aba;draw();return}
  if(d.cat!==undefined&&b.closest('.cats')){cat=d.cat;draw();return}
  if(d.add){carrinho[d.add]=(carrinho[d.add]||0)+1;if(navigator.vibrate)navigator.vibrate(15);draw();return}
  if(d.mais){carrinho[d.mais]++;desenharCarrinho();draw();return}
  if(d.menos){if(--carrinho[d.menos]<=0)delete carrinho[d.menos];draw();return}
  if(b.id==='limpar'){carrinho={};draw();return}
  if(b.id==='cobrar'){abrirCobranca();return}
  if(b.id==='fFechar'){folha=null;desenharFolha();return}
  if(d.pg&&folha){folha.pg=d.pg;folha.via=d.pg==='dinheiro'?'':(folha.pg===d.pg?folha.via:'');if(d.pg==='pix'&&cfg.contas.length===1)folha.via=cfg.contas[0].id;desenharFolha();return}
  if(d.via&&folha){folha.via=d.via;desenharFolha();return}
  if(d.rec&&folha){folha.recebido=campo(+d.rec);desenharFolha();return}
  if(b.id==='pixCopiar'){copiar($('#pixCod').textContent);return}
  if(b.id==='fConfirmar'){b.disabled=true;await confirmarVenda();return}
  if(b.id==='relBtn'){copiar(relatorio());return}
  if(b.id==='caixaBtn'){aplicarCaixa();return}
  if(b.id==='copiarCard'){const T=['*CARDÁPIO*'];categorias().forEach(c=>{const l=ativos().filter(i=>(i.c||'Outros')===c);if(!l.length)return;T.push('','*'+c.toUpperCase()+'*');l.forEach(i=>T.push(i.n+' — '+R(i.p)))});copiar(T.join('\n'));return}
  if(!dono)return;
  try{
    if(b.id==='novoBtn'){$('#novoBox').hidden=!$('#novoBox').hidden;if(!$('#novoBox').hidden)$('#nn').focus();return}
    if(b.id==='novoOk'){const n=$('#nn').value.trim(),p=nv($('#np').value),c=$('#nc').value.trim()||'Outros';if(!n||!p){toast('Preencha nome e preço');return}await db.collection('itens').add({n,c,p,on:true,t:Date.now()});toast('✅ '+n+' adicionado');return}
    if(d.on){const i=itens.find(x=>x.id===d.on);if(i)await db.collection('itens').doc(i.id).set({...strip(i),on:i.on===false});return}
    if(d.del){if(b.dataset.s){await db.collection('itens').doc(d.del).delete();delete carrinho[d.del]}else{b.dataset.s=1;b.textContent='Apagar?';setTimeout(()=>{b.dataset.s='';b.textContent='✕'},2500)}return}
    if(d.vdel){if(b.dataset.s)await db.collection('vendas').doc(d.vdel).delete();else{b.dataset.s=1;b.textContent='Apagar?';setTimeout(()=>{b.dataset.s='';b.textContent='✕'},2500)}return}
    if(b.id==='lerSalvar'){b.disabled=true;await salvarLeitura();return}
    if(b.id==='lerDescartar'){leitura=null;draw();return}
    if(b.id==='mqNova'){cfg.maquinas.push({id:'m'+Date.now().toString(36),n:'Nova maquininha'});await salvarCfg();return}
    if(d.mqdel!==undefined){cfg.maquinas.splice(+d.mqdel,1);await salvarCfg();return}
    if(b.id==='ctNova'){cfg.contas.push({id:'c'+Date.now().toString(36),n:'Nova conta',tipo:'',chave:'',nome:'',cidade:''});await salvarCfg();return}
    if(d.ctdel!==undefined){cfg.contas.splice(+d.ctdel,1);await salvarCfg();return}
  }catch(e){toast('Não consegui salvar: '+(e.message||e))}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='rec'&&folha){folha.recebido=t.value;const pos=t.selectionStart;desenharFolha();const n=$('#rec');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}
  if(t.dataset.lk&&leitura){const x=leitura.itens[+t.dataset.li];if(!x)return;if(t.dataset.lk==='ok'){x.ok=t.checked;const s=$('#lerSalvar');if(s)s.textContent='✅ Adicionar '+leitura.itens.filter(y=>y.ok).length+' itens ao cardápio'}else if(t.dataset.lk==='p')x.p=nv(t.value);else x[t.dataset.lk]=t.value}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='fotoCam'||t.id==='fotoGal'){lerFotos(e);return}
  if(t.id==='dia'){ver=t.value||noiteDe(Date.now());draw();return}
  if(!dono)return;
  try{
    if(t.dataset.ed){const i=itens.find(x=>x.id===t.dataset.id);if(!i)return;const v=t.dataset.ed==='p'?nv(t.value):t.value.trim();if(!v)return;await db.collection('itens').doc(i.id).set({...strip(i),[t.dataset.ed]:v})}
    if(t.dataset.mq!==undefined){cfg.maquinas[+t.dataset.mq].n=t.value.trim()||'Maquininha';await salvarCfg()}
    if(t.dataset.ct!==undefined){cfg.contas[+t.dataset.ct][t.dataset.cf]=t.value.trim();await salvarCfg()}
  }catch(x){toast('Não consegui salvar')}
});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.k)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.k))draw()},400)});
document.addEventListener('toggle',e=>{if(e.target.id==='carDet')carAberto=e.target.open},true);

(async()=>{
  try{db=await claude.use('db');const u=await claude.use('user');if(u){dono=await u.isOwner();me=await u.id()}}catch(e){}
  if(!db){$('#app').innerHTML='<h1>🍽️ Cardápio</h1><p class="sub">Não foi possível abrir o banco de dados.</p>';return}
  db.collection('itens').onSnapshot(s=>{itens=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{});
  db.collection('vendas').onSnapshot(s=>{vendas=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{});
  db.doc('config/pagamento').onSnapshot(s=>{const d=s.exists&&s.data();if(d)cfg={maquinas:d.maquinas||CFG0.maquinas,contas:d.contas||CFG0.contas};draw()},()=>{});
  draw();
})();
</script>
</body>
</html>

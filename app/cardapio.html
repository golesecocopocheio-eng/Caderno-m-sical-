<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio e Vendas</title>
<style>
:root{color-scheme:light;--bg:#f2f3f7;--card:#fff;--tx:#161826;--mut:#667085;--ac:#6d28d9;--on:#fff;--bd:#dcdfe8;--ok:#15803d;--bad:#b91c1c;--am:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1018;--card:#1a1b27;--tx:#ecedf6;--mut:#9aa0b5;--ac:#a78bfa;--on:#17102e;--bd:#2c2e40;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1018;--card:#1a1b27;--tx:#ecedf6;--mut:#9aa0b5;--ac:#a78bfa;--on:#17102e;--bd:#2c2e40;--ok:#4ade80;--bad:#f87171}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 150px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:8px 0 12px}
.tabs button{border:0;background:none;color:var(--tx);padding:7px 2px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px}.tabs button span{font-size:18px;line-height:1}
.tabs button.on{background:var(--ac);color:var(--on)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 12px;font-size:13.5px}
.cats button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* venda com vida: cor e ícone por grupo */
body.venda{background:linear-gradient(180deg,#f5f3ff 0%,#fdf4ff 45%,var(--bg) 100%)}
@media (prefers-color-scheme:dark){body.venda{background:linear-gradient(180deg,#1e1033 0%,#160c26 50%,var(--bg) 100%)}}
.gtit{display:flex;align-items:center;gap:10px;margin:18px 0 8px;padding:10px 14px;border-radius:16px;color:#fff;background:linear-gradient(120deg,var(--gc),color-mix(in srgb,var(--gc) 55%,#000));box-shadow:0 6px 18px color-mix(in srgb,var(--gc) 35%,transparent)}
.gtit i{font-style:normal;font-size:24px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.gtit b{font-size:15.5px;letter-spacing:.08em;text-transform:uppercase}
.gtit small{margin-left:auto;background:rgba(255,255,255,.22);padding:2px 9px;border-radius:99px;font-weight:700;font-size:12px}
.prod .pc{position:relative;display:flex;flex-direction:column;text-align:left;border:0;border-radius:18px;padding:12px 12px 11px;min-height:96px;color:var(--tx);font-size:15px;font-weight:700;line-height:1.25;
 background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 16%,var(--card)) 0%,var(--card) 70%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gc) 30%,transparent),0 4px 14px color-mix(in srgb,var(--gc) 14%,transparent);overflow:hidden;transition:transform .08s}
.prod .pc:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gc)}
.prod .pc:active{transform:scale(.96)}
.prod .pc .ic{font-size:26px;line-height:1;margin-bottom:6px}
.prod .pc .nm{flex:1}
.prod .pc small{display:block;width:fit-content;margin-top:8px;padding:3px 10px;border-radius:99px;font-weight:800;font-size:14px;color:#fff;background:var(--gc)}
.prod .pc .qt{position:absolute;top:8px;right:8px;background:#facc15;color:#2e1065;border-radius:99px;min-width:24px;height:24px;font-size:13px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.prod .pc.tem{box-shadow:inset 0 0 0 2.5px var(--gc),0 6px 18px color-mix(in srgb,var(--gc) 30%,transparent)}
.cats button.cc{border:0;color:#fff;background:color-mix(in srgb,var(--gc) 75%,#000);opacity:.75}
.cats button.cc.on{opacity:1;box-shadow:0 0 0 2px #fff inset,0 3px 10px color-mix(in srgb,var(--gc) 40%,transparent)}
.prod .pc.auto{grid-column:1/3;min-height:0;flex-direction:row;align-items:center;gap:12px;padding:14px 14px 14px 16px;color:#fff;
 background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--dc) 85%,#fff) 0%,var(--dc) 45%,color-mix(in srgb,var(--dc) 55%,#000) 100%);box-shadow:0 8px 22px color-mix(in srgb,var(--dc) 40%,transparent)}
.prod .pc.auto:before{display:none}
.prod .pc.auto .ic{font-size:40px;margin:0;width:58px;height:58px;display:grid;place-items:center;background:rgba(255,255,255,.18);border-radius:16px;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.prod .pc.auto .tx{flex:1;min-width:0}
.prod .pc.auto .nm{display:block;font-size:17px;font-weight:800;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.prod .pc.auto .ds{display:block;font-weight:500;font-size:12.5px;opacity:.9;margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .pc.auto .sl{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.22);padding:2px 8px;border-radius:99px}
.prod .pc.auto small{margin:0;background:#fff;color:var(--dc);font-size:15px;flex:none;align-self:center}
.prod .pc.auto .qt{top:6px;right:6px}
.prod .pc.auto.tem{box-shadow:0 0 0 3px #facc15,0 8px 22px color-mix(in srgb,var(--dc) 45%,transparent)}
/* ===== visual clean (por cima do anterior) ===== */
body.venda{background:var(--bg)}
@media (prefers-color-scheme:dark){body.venda{background:var(--bg)}}
.gtit{background:none;color:var(--tx);box-shadow:none;padding:4px 2px 8px;margin:22px 0 10px;border-radius:0;border-bottom:2px solid color-mix(in srgb,var(--gc) 35%,transparent)}
.gtit i{width:34px;height:34px;display:grid;place-items:center;font-size:19px;border-radius:11px;background:color-mix(in srgb,var(--gc) 14%,transparent);filter:none}
.gtit b{font-size:14px;letter-spacing:.12em;color:color-mix(in srgb,var(--gc) 80%,var(--tx))}
.gtit small{background:color-mix(in srgb,var(--gc) 12%,transparent);color:color-mix(in srgb,var(--gc) 85%,var(--tx))}
.prod{gap:10px}
.prod .pc{background:var(--card);box-shadow:0 1px 2px rgba(16,24,40,.05),0 1px 0 var(--bd);border:1px solid var(--bd);border-radius:16px;min-height:92px;font-weight:650}
.prod .pc:before{width:4px;background:var(--gc);opacity:.9}
.prod .pc .ic{width:34px;height:34px;display:grid;place-items:center;font-size:20px;border-radius:10px;background:color-mix(in srgb,var(--gc) 12%,transparent)}
.prod .pc small{background:color-mix(in srgb,var(--gc) 12%,transparent);color:color-mix(in srgb,var(--gc) 85%,var(--tx));font-size:14px}
.prod .pc.tem{box-shadow:0 0 0 2px var(--gc);border-color:transparent}
.prod .pc .qt{background:var(--gc);color:#fff;box-shadow:none}
.prod .pc.auto{color:var(--tx);background:var(--card);border:1px solid var(--bd);box-shadow:0 1px 2px rgba(16,24,40,.05);padding:12px 12px 12px 16px;gap:12px}
.prod .pc.auto:before{display:block;width:5px;background:var(--dc)}
.prod .pc.auto .ic{width:52px;height:52px;font-size:30px;border-radius:14px;background:color-mix(in srgb,var(--dc) 13%,transparent);filter:none}
.prod .pc.auto .nm{font-size:16.5px;color:var(--tx);text-shadow:none}
.prod .pc.auto .ds{color:var(--mut);opacity:1}
.prod .pc.auto .sl{background:none;padding:0;margin-top:4px;color:var(--dc);font-size:10px;letter-spacing:.14em}
.prod .pc.auto small{background:var(--dc);color:#fff;font-size:14.5px;padding:5px 11px}
.prod .pc.auto.tem{box-shadow:0 0 0 2px var(--dc);border-color:transparent}
.prod .pc.auto .qt{background:var(--dc);color:#fff}
.cats button.cc{opacity:1;color:color-mix(in srgb,var(--gc) 85%,var(--tx));background:color-mix(in srgb,var(--gc) 10%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gc) 30%,transparent)}
.cats button.cc.on{color:#fff;background:var(--gc);box-shadow:none}
/* ===== visual profissional: uma cor só, lista organizada (por cima dos anteriores) ===== */
.prod,.prod .pc,.gtit,.cats button.cc{--gc:var(--ac)!important;--dc:var(--ac)!important}
.gtit{margin:22px 4px 8px;padding:0;border:0;gap:8px}
.gtit i{width:auto;height:auto;background:none;font-size:15px}
.gtit b{font-size:12.5px;letter-spacing:.14em;color:var(--mut)}
.gtit small{background:none;color:var(--mut);font-weight:600;padding:0}
.prod{grid-template-columns:1fr;gap:0;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.prod .pc,.prod .pc.auto{grid-column:auto;flex-direction:row;align-items:center;gap:12px;min-height:0;padding:12px 14px;border:0;border-radius:0!important;border-bottom:1px solid var(--bd);box-shadow:none;background:var(--card);color:var(--tx);font-weight:600}
.prod .pc:last-child{border-bottom:0}
.prod .pc:before,.prod .pc.auto:before{display:block;width:3px;background:var(--ac);opacity:0;transition:opacity .15s}
.prod .pc.tem:before{opacity:1}
.prod .pc.tem,.prod .pc.auto.tem{box-shadow:none;background:color-mix(in srgb,var(--ac) 5%,var(--card))}
.prod .pc:active{transform:none;background:color-mix(in srgb,var(--ac) 8%,var(--card))}
.prod .pc .ic,.prod .pc.auto .ic{width:40px;height:40px;margin:0;font-size:20px;border-radius:12px;background:var(--bg);flex:none;filter:none}
.prod .pc .nm{flex:1;font-size:15px;font-weight:650}
.prod .pc.auto .tx{flex:1;min-width:0}
.prod .pc.auto .nm{font-size:15px;font-weight:700;color:var(--tx)}
.prod .pc.auto .ds{color:var(--mut);font-size:12.5px;margin-top:2px}
.prod .pc.auto .sl{color:var(--mut);font-size:10px;letter-spacing:.14em;margin-top:3px;background:none;padding:0}
.prod .pc small,.prod .pc.auto small{margin:0;padding:0;background:none;color:var(--tx);font-size:15px;font-weight:800;flex:none;white-space:nowrap}
.prod .pc .qt,.prod .pc.auto .qt{position:static;order:-1;background:var(--ac);color:#fff;min-width:24px;height:24px;font-size:12.5px;box-shadow:none;margin-right:-4px}
.cats button.cc{color:var(--tx);background:var(--card);box-shadow:inset 0 0 0 1px var(--bd)}
.cats button.cc.on{color:var(--bg);background:var(--tx);box-shadow:none}
/* ===== ✨ Drinks Autorais em destaque; 🥃 Clássicos logo abaixo ===== */
.gtit.dest{margin:16px 0 0;padding:16px 16px 14px;border-radius:18px 18px 0 0;background:linear-gradient(125deg,#5b21b6,#7c3aed 55%,#a855f7);box-shadow:none;gap:10px}
.gtit.dest i{width:38px;height:38px;font-size:21px;border-radius:12px;background:rgba(255,255,255,.18)}
.gtit.dest b{color:#fff;font-size:14px;letter-spacing:.16em}
.gtit.dest b{white-space:nowrap}.gtit.dest em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:#ede9fe;letter-spacing:.04em;text-transform:none;margin-top:2px}
.gtit.dest small{color:#5b21b6;background:#fff;padding:3px 10px;border-radius:99px;font-weight:800}
.prod.dest{border-radius:0 0 18px 18px;border:1.5px solid #c4b5fd;border-top:0;box-shadow:0 10px 26px rgba(124,58,237,.14)}
.prod.dest .pc,.prod.dest .pc.auto{padding:14px 14px}
.prod.dest .pc .ic,.prod.dest .pc.auto .ic{width:48px;height:48px;font-size:25px;background:#f5f3ff;border-radius:14px}
.prod.dest .pc.auto .nm,.prod.dest .pc .nm{font-size:16.5px;font-weight:800}
.prod.dest .pc.auto .sl{color:#7c3aed;font-weight:800}
.prod.dest .pc small,.prod.dest .pc.auto small{color:#fff;background:#7c3aed;padding:6px 11px;border-radius:99px;font-size:14.5px}
.gtit.clas{margin:22px 0 0;padding:16px 16px 14px;border-radius:18px 18px 0 0;background:linear-gradient(125deg,#92400e,#d97706 55%,#f59e0b);box-shadow:none;gap:10px}
.gtit.clas i{width:38px;height:38px;font-size:21px;border-radius:12px;background:rgba(255,255,255,.2)}
.gtit.clas b{color:#fff;font-size:14px;letter-spacing:.16em;white-space:nowrap}
.gtit.clas em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:#fef3c7;letter-spacing:.04em;text-transform:none;margin-top:2px}
.gtit.clas small{color:#92400e;background:#fff;padding:3px 10px;border-radius:99px;font-weight:800}
.prod.clas{border-radius:0 0 18px 18px;border:1.5px solid #fcd34d;border-top:0;box-shadow:0 10px 26px rgba(217,119,6,.14)}
.prod.clas .pc,.prod.clas .pc.auto{padding:14px 14px}
.prod.clas .pc .ic,.prod.clas .pc.auto .ic{width:48px;height:48px;font-size:25px;background:#fffbeb;border-radius:14px}
.prod.clas .pc.auto .nm,.prod.clas .pc .nm{font-size:16.5px;font-weight:800}
.prod.clas .pc.auto .sl{color:#b45309;font-weight:800}
.prod.clas .pc small,.prod.clas .pc.auto small{color:#fff;background:#d97706;padding:6px 11px;border-radius:99px;font-size:14.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prod.dest{border-color:#4c1d95}:root:not([data-theme="light"]) .prod.dest .pc .ic{background:#2e1f52}:root:not([data-theme="light"]) .prod.clas{border-color:#78350f}:root:not([data-theme="light"]) .prod.clas .pc .ic{background:#3b2a0a}}
.emo{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/3}
.emo button{border:1px solid var(--bd);background:var(--card);border-radius:10px;font-size:18px;padding:4px 6px;line-height:1}
.emo button.on{border-color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.menu{background:radial-gradient(120% 80% at 50% 0%,#5b21b6 0%,#2e1065 45%,#12051f 100%);color:#f5f3ff;border-radius:22px;padding:26px 20px 22px;box-shadow:0 14px 40px rgba(46,16,101,.35);margin-bottom:12px}
.menu .mt{text-align:center;font:900 26px/1.1 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.menu .mt span{color:#facc15}
.menu .ms{text-align:center;color:#fcd34d;font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;margin:8px 0 4px}
.menu .mc{display:flex;align-items:center;gap:10px;margin:22px 0 8px;color:#facc15;font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.menu .mc:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(250,204,21,.6),transparent)}
.menu .mi{display:flex;align-items:baseline;gap:6px;padding:7px 0;font-size:16px}
.menu .mi .mn{font-weight:600}
.menu .mi .ml{flex:1;border-bottom:2px dotted rgba(245,243,255,.28);transform:translateY(-4px);min-width:16px}
.menu .mi .mp{font-weight:800;color:#fde047;white-space:nowrap}
.menu .md{color:rgba(245,243,255,.62);font-size:13px;font-style:italic;margin:-5px 0 6px;line-height:1.3}
.cliente .menu .md{font-size:15px}
.menu .mf{text-align:center;color:rgba(245,243,255,.55);font-size:11px;letter-spacing:.12em;margin-top:22px}
.scan{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 80% at 50% 0%,#3b0764,#12051f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;color:#f5f3ff;text-align:center}
.scan .quadro{position:relative;width:min(78vw,320px);aspect-ratio:3/4;border-radius:18px;overflow:hidden;box-shadow:0 0 0 2px rgba(250,204,21,.6),0 18px 50px rgba(0,0,0,.5);background:#000}
.scan .quadro img{width:100%;height:100%;object-fit:contain;opacity:.9}
.scan .linha{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#facc15,transparent);box-shadow:0 0 18px 4px rgba(250,204,21,.55);animation:varre 1.6s ease-in-out infinite alternate}
.scan .canto{position:absolute;width:26px;height:26px;border:3px solid #facc15}
.scan .c1{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}.scan .c2{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}.scan .c3{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 8px}.scan .c4{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.scan b{font-size:19px;letter-spacing:.02em}.scan p{margin:0;color:#fcd34d;font-size:14px;min-height:20px}
@keyframes varre{from{top:4%}to{top:94%}}
.cliente{position:fixed;inset:0;z-index:30;overflow:auto;background:#12051f;padding:20px 14px 40px}
.cliente .menu{max-width:620px;margin:0 auto;box-shadow:none}
.cliente .menu .mi{font-size:19px}.cliente .menu .mt{font-size:32px}
.prod button{position:relative;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 10px;min-height:74px;font-size:14.5px;font-weight:600;line-height:1.25}
.prod button small{display:block;width:fit-content;color:var(--ac);font-weight:800;font-size:14.5px;margin-top:8px;background:rgba(109,40,217,.09);padding:2px 9px;border-radius:99px}
.prod button{box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);border-radius:16px!important;transition:transform .08s}
.prod button:active{transform:scale(.97)}
.prod button .qt{position:absolute;top:6px;right:6px;background:var(--ac);color:var(--on);border-radius:99px;min-width:22px;height:22px;font-size:12.5px;display:grid;place-items:center;padding:0 6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:14.5px}
.it:first-of-type{border-top:0}
.it small{display:block;color:var(--mut);font-size:12.5px}
.q{display:flex;align-items:center;gap:6px}.q button{width:32px;height:32px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;line-height:1}
.q b{min-width:22px;text-align:center}
.carrinho{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -8px 24px rgba(0,0,0,.12);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.carrinho .in{max-width:560px;margin:0 auto}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:700;font-size:16px;margin-top:8px}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.pgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:14px 6px;font-size:15px;font-weight:700}
.pgs button.on{border-color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.opc{display:flex;flex-direction:column;gap:6px}
.opc button{text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 12px;font-size:14.5px}
.opc button.on{border-color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.opc button small{display:block;color:var(--mut);font-size:12px}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
label{display:block;font-size:12.5px;color:var(--mut);margin-top:8px}
.tot{font-size:28px;font-weight:800}
.big{font-size:22px;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 b{display:block;font-size:17px}.grid3 span{font-size:12px;color:var(--mut)}
.msg{color:var(--mut);font-size:13px;margin:8px 0;text-align:center}
.link{border:0;background:none;color:var(--ac);font-size:14px;padding:0;font-weight:600}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:4px 6px}

<body>
<main id="app"><h1>🍽️ Cardápio</h1><p class="sub">Carregando…</p></main>
<div class="carrinho" id="carrinho" hidden></div>
<div class="toast" id="toast"></div>
<script>
/* Cardápio e vendas do bar.
   - Cardápio: itens por categoria, montado pela foto do cardápio (leitura do texto) ou à mão.
   - Vender: toca nos itens, cobra em Dinheiro (com troco), Pix (QR Code com o valor, na conta
     escolhida), Crédito ou Débito (na maquininha escolhida).
   - Vendas: totais da noite por forma de pagamento, maquininha e conta; aplica no Caixa.
   Sincroniza ao vivo entre os celulares quando a nuvem está ligada. */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nv=v=>{let s=String(v??'').trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isNaN(n)?0:n};
const campo=v=>(Math.round(v*100)/100).toFixed(2).replace('.',',');
const noiteDe=t=>new Date(t-6*3600e3).toLocaleDateString('sv-SE');
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};
const PG={dinheiro:'💵 Dinheiro',pix:'⚡ Pix',credito:'💳 Crédito',debito:'💳 Débito'};
const CFG0={maquinas:[{id:'mp',n:'Mercado Pago (Point)'},{id:'sant',n:'Santander (Getnet)'}],contas:[{id:'cmp',n:'Mercado Pago',tipo:'Conta digital',chave:'',nome:'',cidade:''},{id:'csant',n:'Santander',tipo:'Banco físico',chave:'',nome:'',cidade:''}]};
let db=null,dono=true,me='',itens=[],vendas=[],cfg=JSON.parse(JSON.stringify(CFG0)),aba='vender',cat='',carrinho={},ver=noiteDe(Date.now()),leitura=null,folha=null,carAberto=false,fotos=[],editar=false,carregado=false,fotoVer=null;

/* ---------- Pix: BR Code (copia e cola) com o valor, para a chave da conta ---------- */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
const semAcento=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').trim();
function pixCodigo(conta,valor){
  const chave=String(conta.chave||'').trim();if(!chave)return '';
  const nome=(semAcento(conta.nome)||'BAR').toUpperCase().slice(0,25),cid=(semAcento(conta.cidade)||'BRASIL').toUpperCase().slice(0,15);
  let p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',chave))+tlv('52','0000')+tlv('53','986');
  if(valor>0)p+=tlv('54',valor.toFixed(2));
  p+=tlv('58','BR')+tlv('59',nome)+tlv('60',cid)+tlv('62',tlv('05','***'))+'6304';
  return p+crc16(p);
}
window.__pixCodigo=pixCodigo;

/* ---------- Leitura do cardápio pela foto ---------- */
/* Leitura do cardápio a partir do texto escaneado.
   - Cada linha é dividida em colunas (espaço grande); "¦" marca coluna vazia.
   - Preço: número no fim ("Caipirinha 25", "Gin .... R$ 32,00") ou sozinho na linha de baixo.
   - Grupo (categoria): só título com palavra de cardápio (Drinks Autorais, Clássicos, Cervejas,
     Doses, Sem álcool…) ou letra bem maior ("§" vindo do scanner), e que não tenha preço logo
     abaixo (aí é nome de item, ex.: "Gin Tônica" / "32").
   - Nome × descrição: a descrição (ingredientes, com vírgula/minúscula) fica no item. */
const CATKW=/\b(drinks?|drinques?|autora(?:l|is)|cl[aá]ssic[oa]s?|coquet[eé]is|caipirinhas?|caipis|cervejas?|chopps?|petiscos?|por[cç][oõ]es|lanches?|entradas?|pratos?|sobremesas?|sem\s+[aá]lcool|n[aã]o\s+alco[oó]lic[oa]s?|bebidas?|doses?|destilados?|vinhos?|espumantes?|whiske?ys?|whiskies|shots?|combos?|cozinha|refrigerantes?|sucos?|softs?|batidas?|cacha[çc]as?|baldes?|garrafas?|happy\s+hour|promo[cç][oõ]es|especiais|da\s+casa|tradicionais|cl[aá]ssicos)\b/i;
const MINUSC=new Set(['de','da','do','das','dos','e','com','ao','à','a','o','na','no','em','para']);
const titulo=t=>{const l=t.replace(/[^A-Za-zÀ-ú]/g,'');if(!l||l!==l.toUpperCase())return t.charAt(0).toUpperCase()+t.slice(1);return t.toLowerCase().split(' ').map((w,k)=>k&&MINUSC.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ')};
function lerCardapio(txt,semPreco){
  const SEM='\u0000sem';
  const LET=/[A-Za-zÀ-ú]{3}/;
  const limpa=t=>t.replace(/^§\s*/,'').replace(/[|_~«»"“”!¡?*•·…]+/g,' ').replace(/[.\-–—:=]{2,}/g,' ').replace(/\s+/g,' ').replace(/^[\s.\-–—:=\d]+(?=[A-Za-zÀ-ú])/,'').replace(/[\s.\-–—:=,]+$/,'').trim();
  const PRECO=/^(.*?)(?:^|[\s.:\-–—·…_=$])(?:R\s?\$\s*)?(\d{1,3}(?:\s?[.,]\s?\d{1,2})?)\s*[,.\-–]*\s*$/;
  const segs=[]; // pedaços de texto com a coluna (k); "¦" = coluna vazia, conta mas não entra
  String(txt||'').split(/\n/).forEach(l=>{if(!l.trim())return;l.replace(/\t/g,'    ').split(/\s{3,}/).map(x=>x.trim()).filter(x=>x).forEach((x,k)=>{if(x!=='¦')segs.push({k,raw:x,grande:/^§/.test(x)})})});
  segs.forEach(sg=>{const r=sg.raw.replace(/^§\s*/,'').replace(/(\d)[oO](?=\d|\b)/g,'$10').replace(/[oO](?=\d)/g,'0');const m=r.match(PRECO);
    sg.p=m?nv(m[2].replace(/\s/g,'')):0;sg.nome=m?limpa(m[1]):'';sg.t=limpa(r);
    if(!(m&&sg.p>=0.5&&sg.p<1000)){sg.p=0;sg.nome=''}
    sg.soPreco=sg.p>0&&!LET.test(sg.nome);sg.comPreco=sg.p>0&&LET.test(sg.nome);
    const w=sg.t.split(' ').length;sg.desc=!sg.p&&(/,/.test(sg.t)||/^[a-zà-ú]/.test(sg.t)||w>6)});
  const prox=(i,k)=>{for(let j=i+1;j<segs.length&&j<i+8;j++)if(segs[j].k===k)return segs[j];return null};
  const out=[],sobra=[],cats=[],pend=[],ult=[];let ordem=0;
  const novo=(n,k,p,d)=>{const it={n:titulo(n),c:cats[k]||cats[0]||SEM,p,o:ordem++};if(d)it.d=d;out.push(it);ult[k]=it;return it};
  segs.forEach((sg,i)=>{const k=sg.k;pend[k]=pend[k]||[];
    if(sg.comPreco){if(pend[k].length){/* linhas soltas antes: descrição deste item? */const d=pend[k].filter(x=>x.desc).map(x=>x.t).join(' ');pend[k].filter(x=>!x.desc).forEach(x=>sobra.push({n:titulo(x.t),c:cats[k]||SEM,p:0}));novo(sg.nome,k,sg.p,d)}else novo(sg.nome,k,sg.p);pend[k]=[];return}
    if(sg.soPreco){const P=pend[k];pend[k]=[];if(!P.length)return;const nm=P.find(x=>!x.desc)||P[0];novo(nm.t,k,sg.p,P.filter(x=>x!==nm).map(x=>x.t).join(' '));return}
    if(!LET.test(sg.t))return;
    const nx=prox(i,k),w=sg.t.split(' ').length,semDig=!/\d/.test(sg.t);
    const eTitulo=semDig&&w<=5&&!(nx&&nx.soPreco)&&((CATKW.test(sg.t)&&!sg.desc)||(sg.grande&&!(nx&&nx.desc)));
    if(eTitulo){pend[k].filter(x=>!x.desc).forEach(x=>sobra.push({n:titulo(x.t),c:cats[k]||SEM,p:0}));cats[k]=titulo(sg.t);pend[k]=[];ult[k]=null;return}
    if(sg.desc&&ult[k]&&!pend[k].length){ult[k].d=(ult[k].d?ult[k].d+' ':'')+sg.t;return}
    pend[k].push(sg)});
  pend.forEach((P,k)=>(P||[]).filter(x=>!x.desc).forEach(x=>sobra.push({n:titulo(x.t),c:cats[k]||SEM,p:0})));
  // itens antes do primeiro título: se o cardápio tem "Clássicos", os de cima são os autorais
  // (ex.: Clandestino — Momosuke, Cabra da Peste, Lei Seca… e depois "Drinks Clássicos")
  const grupos=[...out,...sobra].map(x=>x.c).filter(c=>c!==SEM);
  const semTitulo=grupos.some(c=>/cl[aá]ssic/i.test(c))?'Drinks Autorais':grupos.some(c=>/drink|coquet/i.test(c))?'Drinks':'Cardápio';
  [...out,...sobra].forEach(x=>{if(x.c===SEM)x.c=semTitulo});
  const m=new Map();out.forEach(x=>m.set(x.n.toLowerCase(),x));
  if(semPreco||!m.size){if(semPreco)sobra.forEach(x=>{if(!m.has(x.n.toLowerCase())&&x.n.split(' ').some(w=>w.length>=3))m.set(x.n.toLowerCase(),{...x,o:ordem++})})}
  return [...m.values()];
}
window.__lerCardapio=lerCardapio;

/* ---------- cálculo ---------- */
const ativos=()=>itens.filter(i=>i.on!==false);
// Drinks Autorais primeiro, Clássicos logo abaixo; depois os outros grupos na ordem do cardápio
const rankCat=c=>/autora/i.test(c)?0:/cl[aá]ssic/i.test(c)?1:2;
const categorias=()=>{const m=new Map();itens.forEach(i=>{const k=i.c||'Outros',o=i.o??1e9;if(!m.has(k)||o<m.get(k))m.set(k,o)});return [...m.entries()].sort((a,b)=>rankCat(a[0])-rankCat(b[0])||a[1]-b[1]||a[0].localeCompare(b[0],'pt')).map(x=>x[0])};
const classeCat=c=>rankCat(c)===0?' dest':rankCat(c)===1?' clas':'';
const PALETA=['#7c3aed','#d97706','#0891b2','#db2777','#16a34a','#dc2626','#2563eb','#9333ea','#0d9488','#ea580c'];
const corCat=c=>{const m=(cfg.cores||{})[c];if(m)return m;const k=categorias().indexOf(c);if(/autora/i.test(c))return '#7c3aed';if(/cl[aá]ssic/i.test(c))return '#d97706';if(/cerveja|chopp/i.test(c))return '#ca8a04';if(/petisco|por[cç]|cozinha|lanche/i.test(c))return '#ea580c';if(/sem\s*[aá]lcool|suco|refri|[aá]gua|soft/i.test(c))return '#0891b2';if(/vinho|espumante/i.test(c))return '#9f1239';if(/dose|shot|destilad|whisk|gin/i.test(c))return '#0f766e';return PALETA[(k<0?0:k)%PALETA.length]};
const iconeCat=c=>/autora/i.test(c)?'🍸':/cl[aá]ssic/i.test(c)?'🥃':/caipi/i.test(c)?'🍋':/cerveja|chopp/i.test(c)?'🍺':/petisco|por[cç]|cozinha|lanche/i.test(c)?'🍟':/sem\s*[aá]lcool|suco|refri|soft/i.test(c)?'🥤':/[aá]gua/i.test(c)?'💧':/vinho/i.test(c)?'🍷':/espumante/i.test(c)?'🥂':/dose|shot|destilad|whisk/i.test(c)?'🥃':/drink|coquet/i.test(c)?'🍹':/sobremesa/i.test(c)?'🍨':'✨';
const EMOJIS=['🍸','🍹','🥃','🍋','🍊','🍓','🍍','🥥','🌿','🔥','🍺','🍷','🥂','🍾','🧉','🥤','💧','🍟','🍕','🌮','🍨','⭐','💜','🌶️'];
// drinks autorais: cada um com ícone e cor próprios, pelo nome e pelos ingredientes
const ehAutoral=i=>/autora/i.test(i.c||'')||!!i.ficha;
const ehClassico=i=>/cl[aá]ssic/i.test(i.c||'');
const ehDestaque=i=>ehAutoral(i)||ehClassico(i);
const ICONE_CLASSICO=[[/negroni|boulevard/i,'🍊'],[/gin\s*t[oô]nica|g&t|tonica/i,'🫧'],[/caipiro?s?ka|caipirinha|caipi/i,'🍋'],[/mojito/i,'🌿'],[/moscow|mule/i,'🫚'],[/aperol|spritz/i,'🍊'],[/margarita/i,'🧂'],[/cosmo/i,'🍸'],[/old\s*fashion/i,'🥃'],[/sour/i,'🍋'],[/pi[nñ]a\s*colada/i,'🍍'],[/daiquiri/i,'🍓'],[/bloody|mary/i,'🍅'],[/espresso|caf[eé]/i,'☕'],[/dry\s*martini|martini/i,'🫒'],[/manhattan/i,'🍒'],[/mai\s*tai|tiki/i,'🌺'],[/cuba\s*libre|cuba/i,'🥤'],[/sex\s*on|beach/i,'🍑'],[/blue|lagoa|lagoon/i,'💙'],[/fitzgerald/i,'🍋'],[/clover|framboesa/i,'🍓'],[/irish|whisk/i,'🥃'],[/sangria|vinho/i,'🍷'],[/mimosa|espumante|bellini/i,'🥂'],[/campari|americano/i,'🍊'],[/tequila|paloma/i,'🌵'],[/gin\b/i,'🍸'],[/vodka/i,'🍸']];
const ICONE_NOME=[[/momo|p[eê]ssego/i,'🍑'],[/cabra|bode/i,'🐐'],[/lei\s*seca|lei\b/i,'⚖️'],[/luffy|pirata|monkey/i,'🏴‍☠️'],[/ace\b|fogo|fire|chama|inferno/i,'🔥'],[/ragnar|viking|thor|odin/i,'⚡'],[/king|rei\b|rainha|queen|soul/i,'👑'],[/clandest|segredo|secret|msp/i,'🕶️'],[/lua|moon/i,'🌙'],[/sol\b|sun/i,'☀️'],[/noite|night/i,'🌌'],[/diab|devil/i,'😈'],[/anjo|angel/i,'😇'],[/mar\b|ocean|sea|onda/i,'🌊'],[/flor|rosa|flower/i,'🌸'],[/amor|love|paix/i,'❤️'],[/dragon|drag[aã]o/i,'🐉'],[/caveira|skull|morte/i,'💀'],[/cobra|serpente|snake/i,'🐍'],[/gato|cat\b/i,'🐈‍⬛'],[/ouro|gold|dourad/i,'🏆'],[/tropic|praia/i,'🏝️']];
const ICONE_ING=[[/lichia/i,'🍒'],[/morango/i,'🍓'],[/maracuj/i,'💛'],[/caju/i,'🥭'],[/manga/i,'🥭'],[/abacaxi/i,'🍍'],[/coco\b/i,'🥥'],[/melancia/i,'🍉'],[/uva/i,'🍇'],[/ma[cç][aã]/i,'🍏'],[/laranja|aperol/i,'🍊'],[/caf[eé]|espresso/i,'☕'],[/chocolate|cacau/i,'🍫'],[/mel\b|rapadura/i,'🍯'],[/gengibre/i,'🫚'],[/pimenta|jalape/i,'🌶️'],[/hortel|menta|manjeric/i,'🌿'],[/lim[aã]o|lima/i,'🍋'],[/canela/i,'✨']];
const iconeAuto=i=>{if(ehClassico(i))for(const [r,e] of ICONE_CLASSICO)if(r.test(i.n))return e;for(const [r,e] of ICONE_NOME)if(r.test(i.n))return e;for(const [r,e] of ICONE_ING)if(r.test(i.d||''))return e;return '🍸'};
const corDrink=i=>{let h=0;for(const ch of String(i.n||''))h=(h*31+ch.charCodeAt(0))>>>0;const hue=[275,330,15,35,190,160,300,250,350,200][h%10];return `hsl(${hue} 70% 44%)`};
const iconeItem=i=>i.e||(ehDestaque(i)?iconeAuto(i):iconeCat(i.c||'Outros'));
const porOrdem=(x,y)=>(x.o??1e9)-(y.o??1e9)||x.n.localeCompare(y.n,'pt');
const totalCarrinho=()=>Object.entries(carrinho).reduce((s,[id,q])=>{const i=itens.find(x=>x.id===id);return s+(i?i.p*q:0)},0);
const qtdCarrinho=()=>Object.values(carrinho).reduce((a,b)=>a+b,0);
const daNoite=()=>vendas.filter(v=>v.noite===ver).sort((a,b)=>b.t-a.t);
function resumo(lista){
  const r={total:0,n:lista.length,pg:{dinheiro:0,pix:0,credito:0,debito:0},via:{},itens:{}};
  lista.forEach(v=>{r.total+=v.total;r.pg[v.pg]=(r.pg[v.pg]||0)+v.total;if(v.via){r.via[v.via]=(r.via[v.via]||0)+v.total}
    (v.itens||[]).forEach(x=>{const k=x.n;r.itens[k]=r.itens[k]||{q:0,v:0};r.itens[k].q+=x.q;r.itens[k].v+=x.p*x.q})});
  return r;
}
const nomeVia=id=>{const m=cfg.maquinas.find(x=>x.id===id);if(m)return m.n;const c=cfg.contas.find(x=>x.id===id);return c?c.n:id};

/* ---------- Mercado Pago Point (maquininha ligada ao app) ----------
   O app manda o valor para a maquininha (modo integrado/PDV) e acompanha até aprovar.
   A chave (Access Token) fica SÓ neste celular: ela dá acesso à conta Mercado Pago, então
   não vai para a nuvem do bar nem para o backup. Só funciona no APK (o navegador bloqueia). */
const MP={tk:()=>localStorage.getItem('mp-token')||'',dev:()=>localStorage.getItem('mp-device')||'',maq:()=>localStorage.getItem('mp-maquina')||'mp'};
const mpLigada=()=>!!(MP.tk()&&MP.dev());
let mpEst={devs:null,msg:'',busy:false},mpCob=null;
async function mpReq(method,path,body){
  const url='https://api.mercadopago.com'+path,headers={Authorization:'Bearer '+MP.tk(),'Content-Type':'application/json'};
  if(method==='POST')headers['X-Idempotency-Key']='bar-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  let H=null;try{H=(window.parent.Capacitor||window.Capacitor).Plugins.CapacitorHttp}catch(e){}
  let st,data;
  if(H){const r=await H.request({url,method,headers,data:body});st=r.status;data=r.data;if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){}}}
  else{const r=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined});st=r.status;data=await r.json().catch(()=>({}))}
  if(st>=400){const m=(data&&(data.message||data.error))||('erro '+st);const e=new Error(st===401?'chave (Access Token) inválida ou sem permissão':m);e.status=st;throw e}
  return data;
}
window.__mpReq=mpReq;
async function mpBuscar(){
  mpEst.busy=true;mpEst.msg='Buscando suas maquininhas…';draw();
  try{const d=await mpReq('GET','/point/integration-api/devices');mpEst.devs=(d&&d.devices)||[];
    mpEst.msg=mpEst.devs.length?'✅ Conectado ao Mercado Pago. Escolha a maquininha:':'Conectado, mas nenhuma maquininha Point apareceu nessa conta. Ligue a maquininha e confira se ela está vinculada à mesma conta.'}
  catch(e){mpEst.devs=null;mpEst.msg='❌ Não consegui conectar: '+(e.message||e)+(window.parent.Capacitor?'':' (a ligação só funciona no app instalado, APK)')}
  mpEst.busy=false;draw();
}
async function mpModoPDV(id){
  mpEst.msg='Ativando o modo integrado…';draw();
  try{await mpReq('PATCH','/point/integration-api/devices/'+encodeURIComponent(id),{operating_mode:'PDV'});await mpBuscar();mpEst.msg='✅ Modo integrado ativado. Reinicie a maquininha (desligue e ligue) para valer.';draw()}
  catch(e){mpEst.msg='❌ Não consegui ativar: '+(e.message||e);draw()}
}
async function mpCobrar(){
  const total=Math.round(totalCarrinho()*100);if(!total||!folha)return;
  mpCob={estado:'enviando',msg:'Enviando '+R(total/100)+' para a maquininha…'};desenharFolha();
  try{
    const r=await mpReq('POST','/point/integration-api/devices/'+encodeURIComponent(MP.dev())+'/payment-intents',
      {amount:total,additional_info:{external_reference:'bar-'+Date.now(),print_on_terminal:true},payment:{type:folha.pg==='debito'?'debit_card':'credit_card',installments:1,installments_cost:'seller'}});
    mpCob={id:r.id,estado:'OPEN',msg:'📲 Valor enviado. Peça para o cliente aproximar ou inserir o cartão na maquininha.'};desenharFolha();mpAcompanhar(r.id);
  }catch(e){mpCob={estado:'erro',msg:'❌ '+(e.message||e)+'. Confira se a maquininha está ligada, no modo integrado e sem outra cobrança aberta.'};desenharFolha()}
}
async function mpAcompanhar(id){
  for(let i=0;i<120&&mpCob&&mpCob.id===id;i++){
    await new Promise(r=>setTimeout(r,3000));if(!mpCob||mpCob.id!==id)return;
    let d;try{d=await mpReq('GET','/point/integration-api/payment-intents/'+encodeURIComponent(id))}catch(e){continue}
    const st=d&&d.state;
    if(st==='FINISHED'){
      let ok=true,pid=d.payment&&d.payment.id;
      if(pid){try{const p=await mpReq('GET','/v1/payments/'+pid);ok=p.status==='approved'}catch(e){}}
      if(ok){mpCob={id,estado:'aprovado',msg:'✅ Pagamento aprovado na maquininha.'};desenharFolha();await confirmarVenda({mp:String(pid||id)});return}
      mpCob={id,estado:'erro',msg:'❌ O pagamento não foi aprovado. Tente outro cartão ou outra forma.'};desenharFolha();return}
    if(st==='CANCELED'||st==='ABANDONED'||st==='ERROR'){mpCob={id,estado:'erro',msg:st==='CANCELED'?'Cobrança cancelada na maquininha.':'❌ A maquininha não concluiu ('+st+'). Envie de novo.'};desenharFolha();return}
    mpCob.msg=st==='PROCESSING'?'⏳ Processando o pagamento…':st==='ON_TERMINAL'?'📲 Na maquininha: aguardando o cartão do cliente…':mpCob.msg;desenharFolha();
  }
  if(mpCob&&mpCob.id===id){mpCob.estado='erro';mpCob.msg='Tempo esgotado. Confira na maquininha; se aprovou, confirme a venda à mão.';desenharFolha()}
}
async function mpCancelar(){
  const c=mpCob;if(!c||!c.id){mpCob=null;desenharFolha();return}
  mpCob={estado:'erro',msg:'Cancelando na maquininha…'};desenharFolha();
  try{await mpReq('DELETE','/point/integration-api/devices/'+encodeURIComponent(MP.dev())+'/payment-intents/'+encodeURIComponent(c.id));mpCob={estado:'erro',msg:'Cobrança cancelada.'}}
  catch(e){mpCob={estado:'erro',msg:'Não consegui cancelar pelo app ('+(e.message||e)+'). Cancele na própria maquininha.'}}
  desenharFolha();
}

/* ---------- cobrança ---------- */
function abrirCobranca(){
  const total=totalCarrinho();if(!total)return;
  folha={pg:'',via:'',recebido:''};desenharFolha();
}
function desenharFolha(){
  let f=$('#folha');if(!folha){if(f)f.remove();return}
  if(!f){f=document.createElement('div');f.id='folha';f.className='fundo';document.body.appendChild(f);f.addEventListener('click',e=>{if(e.target===f){folha=null;desenharFolha()}})}
  const total=totalCarrinho(),F=folha;
  let h=`<div class="folha"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Cobrar</h2><button class="x" id="fFechar">✕</button></div><div class="tot" style="text-align:center;margin:6px 0 10px">${R(total)}</div>
  <div class="pgs">${Object.entries(PG).map(([k,n])=>`<button data-pg="${k}" class="${F.pg===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(F.pg==='dinheiro'){const rec=nv(F.recebido),tr=rec-total;
    h+=`<label>Valor recebido<input data-k="rec" id="rec" inputmode="decimal" placeholder="${campo(total)}" value="${esc(F.recebido)}" style="font-size:20px;text-align:right"></label><div class="row" style="gap:6px;margin-top:6px">${[total,...[10,20,50,100,200].filter(v=>v>total).slice(0,3)].map(v=>`<button class="btn sec" style="margin:0;padding:9px" data-rec="${v}">${R(v)}</button>`).join('')}</div>
    <p class="big" style="text-align:center;margin:12px 0 0;color:${tr<0?'var(--bad)':'var(--ok)'}">${rec?(tr<0?'Falta '+R(-tr):'Troco '+R(tr)):''}</p>`}
  if(F.pg==='credito'||F.pg==='debito'){
    h+=`<label>Qual maquininha?</label><div class="opc">${cfg.maquinas.map(m=>`<button data-via="${m.id}" class="${F.via===m.id?'on':''}">${esc(m.n)}</button>`).join('')}</div>`;
    if(F.via&&F.via===MP.maq()&&mpLigada()){
      if(!mpCob)h+=`<button class="btn" id="mpEnviar" style="background:#009ee3;color:#fff">📲 Enviar ${R(total)} para a maquininha</button><p class="msg">Ou passe à mão e confirme abaixo.</p>`;
      else h+=`<div class="card" style="margin-top:10px;border-color:#009ee3"><p class="msg" style="font-size:15px;font-weight:600;color:var(--tx);margin:0">${esc(mpCob.msg)}</p>${mpCob.estado==='OPEN'||mpCob.estado==='enviando'?'<button class="btn sec" id="mpCancelar">Cancelar cobrança</button>':''}${mpCob.estado==='erro'?'<button class="btn sec" id="mpDeNovo">Tentar de novo</button>':''}</div>`;
    }
    else if(F.via)h+=`<p class="msg" style="font-size:15px">Passe <b>${R(total)}</b> no <b>${F.pg==='credito'?'crédito':'débito'}</b> da <b>${esc(nomeVia(F.via))}</b> e confirme quando aprovar.</p>`}
  if(F.pg==='pix'){
    h+=`<label>Receber em qual conta?</label><div class="opc">${cfg.contas.map(c=>`<button data-via="${c.id}" class="${F.via===c.id?'on':''}">${esc(c.n)}<small>${esc(c.tipo||'')}${c.chave?' · chave '+esc(c.chave):' · sem chave Pix cadastrada'}</small></button>`).join('')}</div>`;
    const c=cfg.contas.find(x=>x.id===F.via);
    if(c){const cod=pixCodigo(c,total);
      if(cod){let img='';try{const q=qrcode(0,'M');q.addData(cod);q.make();img=q.createImgTag(5,0)}catch(e){}
        h+=`<div class="qr">${img}</div><p class="msg">O cliente lê o QR Code no app do banco e paga <b>${R(total)}</b> direto na conta <b>${esc(c.n)}</b>. Confira no extrato e confirme.</p><div class="copia" id="pixCod">${esc(cod)}</div><button class="btn sec" id="pixCopiar">📋 Copiar Pix copia e cola</button>`}
      else h+=`<p class="msg">Essa conta não tem chave Pix. ${dono?'Cadastre em <b>💳 Receber</b>.':'Peça ao dono para cadastrar.'} Você ainda pode confirmar se o cliente pagou pelo QR Code da conta.</p>`}}
  const pode=F.pg&&(F.pg==='dinheiro'?(!F.recebido||nv(F.recebido)>=total):!!F.via)&&!(mpCob&&mpCob.estado!=='erro');
  h+=`<button class="btn ok" id="fConfirmar" ${pode?'':'disabled'}>✅ Confirmar venda</button></div>`;
  f.innerHTML=h;
}
async function confirmarVenda(extra){
  const total=totalCarrinho();if(!total||!folha||!folha.pg)return;
  const lista=Object.entries(carrinho).map(([id,q])=>{const i=itens.find(x=>x.id===id);return i?{i:id,n:i.n,p:i.p,q}:null}).filter(Boolean);
  const t=Date.now(),v={itens:lista,total:Math.round(total*100)/100,pg:folha.pg,noite:noiteDe(t),t,quem:(localStorage.getItem('bar-nome')||'').trim()};
  if(folha.via)v.via=folha.via;
  if(extra&&extra.mp)v.mp=extra.mp;
  if(folha.pg==='dinheiro'&&nv(folha.recebido)){v.recebido=nv(folha.recebido);v.troco=Math.round((v.recebido-total)*100)/100}
  try{await db.collection('vendas').add(v);carrinho={};folha=null;mpCob=null;desenharFolha();ver=noiteDe(Date.now());toast('✅ Venda de '+R(v.total)+' registrada'+(v.troco?' · troco '+R(v.troco):''));draw()}
  catch(e){toast('Não consegui salvar a venda: '+(e.message||e))}
}

function relatorio(){
  const L=daNoite(),r=resumo(L);
  const T=['*VENDAS DO CARDÁPIO - '+ver.split('-').reverse().join('/')+'*','','*DINHEIRO*: '+R(r.pg.dinheiro),'*CARTÃO*: '+R(r.pg.credito+r.pg.debito)+' (crédito '+R(r.pg.credito)+' · débito '+R(r.pg.debito)+')','*PIX*: '+R(r.pg.pix),'_Total_: '+R(r.total)+' · '+r.n+' vendas'];
  const vias=Object.entries(r.via);if(vias.length){T.push('','*POR MAQUININHA / CONTA*');vias.forEach(([k,v])=>T.push(nomeVia(k)+': '+R(v)))}
  const top=Object.entries(r.itens).sort((a,b)=>b[1].v-a[1].v);if(top.length){T.push('','*ITENS*');top.forEach(([n,x])=>T.push(x.q+'× '+n+': '+R(x.v)))}
  return T.join('\n');
}
let armado=false;
function aplicarCaixa(){
  const r=resumo(daNoite()),P=window.parent,msg=$('#vMsg');
  let days={};try{days=JSON.parse(P.localStorage.getItem('caixa-bar'))||{}}catch(e){}
  const dia=days[ver]||{},novo={bd:campo(r.pg.dinheiro),bc:campo(r.pg.credito+r.pg.debito),bp:campo(r.pg.pix)};
  if(!armado){armado=true;msg.textContent='Vou gravar no Caixa (bar) de '+ver.split('-').reverse().join('/')+': Dinheiro '+(dia.bd||'vazio')+' → '+novo.bd+' · Cartão '+(dia.bc||'vazio')+' → '+novo.bc+' · Pix '+(dia.bp||'vazio')+' → '+novo.bp+'. Toque de novo para confirmar.';setTimeout(()=>armado=false,8000);return}
  armado=false;days[ver]=Object.assign({},dia,novo);P.localStorage.setItem('caixa-bar',JSON.stringify(days));
  try{const f=P.document.getElementById('f-caixa');if(f&&f.src)f.contentWindow.location.reload()}catch(e){}
  msg.textContent='✅ Aplicado no Caixa de '+ver.split('-').reverse().join('/')+'. Abra a aba Caixa para conferir.';
}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast('✅ Copiado')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('✅ Copiado')}catch(x){toast('Não consegui copiar')}a.remove()}}

/* ---------- foto do cardápio ---------- */
/* ---------- Scanner: leitor de texto do Android (ML Kit) ----------
   Lê a foto em ~1 s, no celular e sem internet, e devolve cada linha com a posição.
   Com a posição o cardápio é remontado: nome à esquerda + preço à direita na mesma linha,
   e colunas separadas. Fora do APK, usa o leitor do navegador (mais lento). */
const leitorNativo=()=>{try{const P=window.parent;return P&&P.Capacitor&&P.Capacitor.isPluginAvailable&&P.Capacitor.isPluginAvailable('LeitorTexto')?P.Capacitor.Plugins.LeitorTexto:null}catch(e){return null}};
async function paraBase64(arq,max){
  const P=window.parent,url=(P.URL||URL).createObjectURL(arq);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=url});
    const e=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*e);c.height=Math.round(img.height*e);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.9)}finally{(P.URL||URL).revokeObjectURL(url)}
}
function montarTexto(linhas){
  const L=(linhas||[]).filter(l=>l&&l.t&&l.h>0).map(l=>({t:String(l.t),x:+l.x||0,w:+l.w||0,h:+l.h,cy:(+l.y||0)+(+l.h)/2}));
  if(!L.length)return '';
  const SO_PRECO=t=>/^(?:R\s?\$\s*)?\d{1,3}(?:\s?[.,]\s?\d{1,2})?[,.\-]*$/.test(t.trim());
  const hs=L.filter(l=>!SO_PRECO(l.t)).map(l=>l.h).sort((a,b)=>a-b),hm=hs[Math.floor(hs.length/2)]||10;
  // colunas: maior vão entre os começos (x) das linhas de texto
  const xs=L.filter(l=>!SO_PRECO(l.t)).map(l=>l.x).sort((a,b)=>a-b),larg=Math.max(...L.map(l=>l.x+l.w))||1;
  // o corte fica logo antes de onde começa o texto da coluna da direita (os preços da coluna
  // da esquerda ficam antes dele)
  let corte=Infinity,maior=0;for(let i=1;i<xs.length;i++){const g=xs[i]-xs[i-1];if(g>maior){maior=g;corte=xs[i]-hm*.5}}
  if(maior<larg*.22||xs.filter(x=>x>corte).length<3)corte=Infinity;
  L.sort((a,b)=>a.cy-b.cy);
  const rows=[];
  for(const l of L){const r=rows.length?rows[rows.length-1]:null;
    if(r&&Math.abs(r.cy-l.cy)<hm*.6){r.it.push(l);r.cy=r.it.reduce((s,x)=>s+x.cy,0)/r.it.length}else rows.push({cy:l.cy,it:[l]})}
  const junta=it=>{it.sort((a,b)=>a.x-b.x);let s='';it.forEach((l,k)=>{const t=(!SO_PRECO(l.t)&&l.h>=hm*1.8?'§ ':'')+l.t;if(!k){s=t;return}s+=(SO_PRECO(l.t)&&!SO_PRECO(it[k-1].t)?' ':'     ')+t});return s};
  return rows.map(r=>{
    if(corte===Infinity)return junta(r.it);
    const a=r.it.filter(l=>l.x<corte),b=r.it.filter(l=>l.x>=corte);
    return (a.length?junta(a):'¦')+(b.length?'     '+junta(b):'')}).join('\n');
}
window.__montarTexto=montarTexto;
async function escanear(arq,prog){
  const nat=leitorNativo();
  if(nat){prog('Escaneando…');const r=await nat.ler({imagem:await paraBase64(arq,2200)});prog('Montando o cardápio…');return {texto:montarTexto(r.linhas)||r.texto||'',nativo:true}}
  const ocr=window.parent.__barOCR;if(!ocr)throw new Error('a leitura de foto só funciona dentro do app');
  const t=(await ocr(arq,m=>{if(m.status==='recognizing text')prog('Escaneando… '+Math.round(m.progress*100)+'%')},1600)).texto;
  return {texto:t,nativo:false};
}
function telaScan(arq,on){
  let el=$('#scan');if(!on){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='scan';el.className='scan';document.body.appendChild(el)}
  let src='';try{src=(window.parent.URL||URL).createObjectURL(arq)}catch(e){}
  el.innerHTML=`<div class="quadro">${src?`<img src="${src}" alt="">`:''}<div class="linha"></div><i class="canto c1"></i><i class="canto c2"></i><i class="canto c3"></i><i class="canto c4"></i></div><b>📷 Escaneando o cardápio</b><p id="scanMsg">Preparando…</p>`;
}
async function miniatura(src){const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=src});
  const e=Math.min(1,260/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*e);c.height=Math.round(img.height*e);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
// guarda a foto: grande em "fotosg" (só baixa ao abrir) e miniatura em "fotos" (lista leve)
async function guardarFoto(img,extra){try{const mini=await miniatura(img);const g=await db.collection('fotosg').add({img});await db.collection('fotos').add({v:2,mini,g:g.id,t:Date.now(),quem:(localStorage.getItem('bar-nome')||'').trim(),...(extra||{})})}catch(e){}}
async function comprimir(arq){
  const url=URL.createObjectURL(arq);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=url});
    let max=1200,q=.65,out='';
    for(let k=0;k<6;k++){const e=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*e);c.height=Math.round(img.height*e);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<450000)break;max=Math.round(max*.82);q=Math.max(.45,q-.07)}
    return out}finally{URL.revokeObjectURL(url)}
}
const deDataUrl=async u=>{const r=await fetch(u);const b=await r.blob();return new File([b],'cardapio.jpg',{type:b.type||'image/jpeg'})};
async function lerFotos(arqs,guardar=true){
  if(!arqs||!arqs.length||(leitura&&leitura.lendo))return;
  leitura={lendo:true,msg:'📷 Escaneando o cardápio…'};aba='vender';editar=false;draw();
  telaScan(arqs[0],true);
  const msg=t=>{leitura.msg=t;const el=$('#scanMsg');if(el)el.textContent=t};
  const lidos=[];let erro='',novos=0,atual=0,textoLido='',nativo=false;const t0=Date.now();const base=itens.reduce((m,i)=>Math.max(m,(i.o??0)+1),0);
  try{
    for(const [k,a] of arqs.entries()){
      const pre=arqs.length>1?'Foto '+(k+1)+' de '+arqs.length+' · ':'';
      if(k)telaScan(a,true);
      try{
        const r=await escanear(a,t=>msg(pre+t));nativo=r.nativo;
        let lista=lerCardapio(r.texto);
        if(!lista.length&&!r.nativo){msg(pre+'Escaneando de outro jeito…');const t2=(await window.parent.__barOCR(a,()=>{},1600,4)).texto,l2=lerCardapio(t2);if(l2.length){lista=l2;r.texto=t2}}
        if(!lista.length)lista=lerCardapio(r.texto,true);
        textoLido+=(textoLido?'\n----\n':'')+r.texto;nomeDoBar(r.texto);
        {const b0=lidos.length;lista.forEach(x=>x.o=b0+(x.o||0))}
        lidos.push(...lista);
      }catch(e){erro=(e&&e.message)||String(e)}
    }
    msg('Montando o cardápio…');
    {const r=await salvarLidos(lidos);novos=r.novos;atual=r.atual;if(r.erro)erro=r.erro}
  }catch(e){erro=(e&&e.message)||String(e)}
  finally{
    const seg=((Date.now()-t0)/1000).toFixed(1).replace('.',','),semP=lidos.filter(x=>!x.p).length;
    leitura={lendo:false,texto:textoLido,msg:lidos.length?`✅ Cardápio escaneado em ${seg} s: ${novos} itens novos${atual?' ('+atual+' já estavam, mantive o preço)':''}.${semP?' '+semP+' ficaram sem preço: preencha.':''} Confira e toque em ✅ Pronto para vender.`
      :'❌ Não consegui achar itens nessa foto'+(erro?' (erro: '+erro+')':'')+'. Tente de novo mais perto, bem reta e sem reflexo.'};
    telaScan(null,false);aba='vender';editar=lidos.length>0;draw();
  }
  if(guardar)arqs.forEach(a=>comprimir(a).then(img=>guardarFoto(img)).catch(()=>{}));
}
// nome do bar: primeira linha em letra bem maior que não é grupo (ex.: CLANDESTINO)
function nomeDoBar(tx){if((cfg.nome||'').trim())return;const l=String(tx||'').split('\n').map(x=>x.split(/\s{3,}/)[0].trim()).find(x=>/^§/.test(x));if(!l)return;const t=l.replace(/^§\s*/,'').trim();if(!t||CATKW.test(t)||/\d/.test(t)||t.split(' ').length>4)return;cfg.nome=titulo(t);salvarCfg()}
// 🍸 Puxar os drinks da Ficha técnica (aba Caixa): nome + ingredientes em "Drinks Autorais"
async function puxarFichas(){
  let lista=null;try{const f=window.parent.document.getElementById('f-caixa');lista=f&&f.contentWindow.__cxFichasLista&&f.contentWindow.__cxFichasLista()}catch(e){}
  if(!lista||!lista.length){toast('Não achei fichas técnicas. Abra a aba Caixa → Ficha técnica uma vez e tente de novo.');return}
  const base=itens.reduce((m,i)=>Math.max(m,(i.o??0)+1),0),salvos=[];let novos=0,atual=0;
  lista.forEach((f,k)=>{const nome=String(f.n||'').trim();if(!nome)return;const d=(f.ing||[]).join(', ').toLowerCase();
    const ja=itens.find(i=>i.n.toLowerCase()===nome.toLowerCase());
    if(ja){atual++;const up={};if(d&&!ja.d)up.d=d;if(!ja.c||/^(card[aá]pio|outros)$/i.test(ja.c))up.c='Drinks Autorais';if(Object.keys(up).length)salvos.push(db.collection('itens').doc(ja.id).set({...strip(ja),...up}).catch(()=>{}));return}
    const it={n:nome,c:'Drinks Autorais',p:0,on:true,t:Date.now(),o:base+k,ficha:true};if(d)it.d=d;if(f.custo)it.custo=Math.round(f.custo*100)/100;
    salvos.push(db.collection('itens').add(it).catch(()=>{}));novos++});
  await Promise.race([Promise.all(salvos),new Promise(r=>setTimeout(r,3000))]);
  leitura={lendo:false,msg:`🍸 Ficha técnica: ${lista.length} drinks. ${novos} novos em Drinks Autorais${atual?', '+atual+' já estavam (mantive o preço)':''}.${novos?' Preencha o preço dos novos (estão com R$ 0,00) e toque em ✅ Pronto.':''}`};
  aba='vender';editar=true;draw();
}
let substituir=false; // 🔄 Atualizar pela foto: o cardápio novo substitui o antigo
async function salvarLidos(lidos){
  let novos=0,atual=0,erro='';const salvos=[];
  if(substituir&&lidos.length){substituir=false;const velhos=[...itens];itens=[];velhos.forEach(i=>salvos.push(db.collection('itens').doc(i.id).delete().catch(()=>{})))}
  const base=itens.reduce((m,i)=>Math.max(m,(i.o??0)+1),0);
  for(const x of lidos){const ja=itens.find(i=>i.n.toLowerCase()===x.n.toLowerCase());
    if(ja){atual++;const up={};if(x.c&&(!ja.c||/^(card[aá]pio|outros)$/i.test(ja.c))&&ja.c!==x.c)up.c=x.c;if(x.d&&!ja.d)up.d=x.d;if(Object.keys(up).length)salvos.push(db.collection('itens').doc(ja.id).set({...strip(ja),...up}).catch(()=>{}));continue}
    const it={n:x.n,c:x.c||'Cardápio',p:x.p,on:true,t:Date.now(),o:base+(x.o||0)};if(x.d)it.d=x.d;salvos.push(db.collection('itens').add(it).catch(e=>{erro=e.message||String(e)}));novos++}
  await Promise.race([Promise.all(salvos),new Promise(r=>setTimeout(r,3000))]);
  return {novos,atual,erro};
}
const scannerNativo=()=>{const n=leitorNativo();return n&&typeof n.digitalizar==='function'?n:null};
// 📷 Scanner do Google: acha as bordas, recorta, endireita e deixa nítido; depois lê as informações
async function digitalizar(){
  const n=scannerNativo();if(!n){try{window.parent.__barFotoCardapio(true)}catch(e){}return}
  if(leitura&&leitura.lendo)return;
  let r;
  try{r=await n.digitalizar({paginas:4})}
  catch(e){const c=e&&(e.code||'');if(/CANCEL/i.test(c+(e.message||'')))return;
    if(/INDISPON/i.test(c+(e.message||''))){toast('Scanner do Google indisponível neste celular. Abrindo a câmera…');try{window.parent.__barFotoCardapio(true)}catch(x){}return}
    leitura={lendo:false,msg:'❌ Não consegui digitalizar: '+((e&&e.message)||e)};draw();return}
  const pags=(r&&r.paginas)||[];if(!pags.length)return;
  const t0=Date.now();leitura={lendo:true,msg:'Montando o cardápio…'};aba='vender';editar=false;draw();
  let el=document.createElement('div');el.id='scan';el.className='scan';document.body.appendChild(el);
  el.innerHTML=`<div class="quadro"><img src="${pags[0].imagem}" alt=""><div class="linha"></div><i class="canto c1"></i><i class="canto c2"></i><i class="canto c3"></i><i class="canto c4"></i></div><b>✅ Cardápio digitalizado</b><p id="scanMsg">Montando o cardápio…</p>`;
  const lidos=[];let textoLido='';
  pags.forEach(p=>{const tx=montarTexto(p.linhas)||p.texto||'';nomeDoBar(tx);textoLido+=(textoLido?'\n----\n':'')+tx;let l=lerCardapio(tx);if(!l.length)l=lerCardapio(tx,true);const b0=lidos.length;l.forEach(x=>x.o=b0+(x.o||0));lidos.push(...l)});
  const {novos,atual,erro}=await salvarLidos(lidos);
  // guarda as páginas digitalizadas (já recortadas e nítidas) na nuvem do bar
  pags.forEach(p=>{const img=p.imagem;(img.length<700000?Promise.resolve(img):deDataUrl(img).then(comprimir)).then(im=>guardarFoto(im,{digitalizada:true})).catch(()=>{})});
  const seg=((Date.now()-t0)/1000).toFixed(1).replace('.',','),semP=lidos.filter(x=>!x.p).length;
  await new Promise(r=>setTimeout(r,500));el.remove();
  leitura={lendo:false,texto:textoLido,msg:lidos.length?`✅ Cardápio digitalizado (${pags.length} ${pags.length>1?'páginas':'página'}) e montado ${(Date.now()-t0)<1500?"na hora":"em "+seg+" s"}: ${novos} itens novos${atual?' ('+atual+' já estavam, mantive o preço)':''}.${semP?' '+semP+' ficaram sem preço: preencha.':''} A imagem digitalizada fica em 📋 Cardápio → Fotos. Confira e toque em ✅ Pronto.`
    :'❌ Digitalizei, mas não achei itens'+(erro?' (erro: '+erro+')':'')+'. Veja a imagem em 📋 Cardápio → Fotos e tente de novo mais perto.'};
  aba='vender';editar=lidos.length>0;draw();
}

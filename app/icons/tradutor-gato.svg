    <path d="M136 282 Q142 228 196 226 Q250 228 256 282" fill="none" stroke="#07060b" stroke-width="9" stroke-linecap="round"/>
    <path d="M376 282 Q370 228 316 226 Q262 228 256 282" fill="none" stroke="#07060b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="178" cy="268" r="13" fill="#fff"/><circle cx="294" cy="268" r="13" fill="#fff"/>
    <use href="#brilho" transform="translate(222 320) scale(9)" fill="#fff"/>
    <use href="#brilho" transform="translate(338 320) scale(9)" fill="#fff"/>
    <!-- bochechas -->
    <ellipse cx="152" cy="350" rx="30" ry="15" fill="url(#rubor)"/>
    <ellipse cx="360" cy="350" rx="30" ry="15" fill="url(#rubor)"/>
    <!-- nariz, boca e dentinho -->
    <path d="M246 344 L266 344 L256 355 Z" fill="#f9a8d4" stroke="#f9a8d4" stroke-width="5" stroke-linejoin="round"/>
    <path d="M256 355 Q256 371 242 371 Q231 369 231 359 M256 355 Q256 371 270 371 Q281 369 281 359" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
    <path d="M263 370 L268 382 L273 368 Z" fill="#fff"/>

    <linearGradient id="orelha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="rubor" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f472b6" stop-opacity=".75"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <path id="brilho" d="M0 -1 Q.12 -.12 1 0 Q.12 .12 0 1 Q-.12 .12 -1 0 Q-.12 -.12 0 -1 Z"/>
  </defs>
  <rect class="fundo" width="512" height="512" rx="112" fill="url(#fundo)"/>


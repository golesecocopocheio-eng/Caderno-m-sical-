    <path d="M140 292 Q144 236 196 234 Q246 236 250 292 Q246 346 196 348 Q144 346 140 292 Z" fill="url(#olho)"/>
    <path d="M372 292 Q368 236 316 234 Q266 236 262 292 Q266 346 316 348 Q368 346 372 292 Z" fill="url(#olho)"/>
    <ellipse cx="198" cy="294" rx="11" ry="38" fill="#07060b"/>

    <g stroke="#ede9fe" stroke-width="3.5" stroke-linecap="round" opacity=".85">
      <path d="M150 334 L80 322 M150 348 L84 356 M362 334 L432 322 M362 348 L428 356"/>
    </g>
    <!-- coleira e medalha -->
    <path d="M182 396 Q256 432 330 396" fill="none" stroke="#2e1065" stroke-width="22" stroke-linecap="round"/>
    <path d="M182 396 Q256 432 330 396" fill="none" stroke="url(#ouro)" stroke-width="14" stroke-linecap="round"/>
    <path d="M228 410 h56 a17 17 0 0 1 17 17 v20 a17 17 0 0 1 -17 17 h-20 l-11 11 v-11 h-25 a17 17 0 0 1 -17 -17 v-20 a17 17 0 0 1 17 -17 z" fill="url(#ouro)" stroke="#92400e" stroke-width="2"/>
    <circle cx="242" cy="437" r="5" fill="#4c1d95"/><circle cx="256" cy="437" r="5" fill="#4c1d95"/><circle cx="270" cy="437" r="5" fill="#4c1d95"/>
    <!-- brilhos -->
    <g fill="url(#ouro)">
      <use href="#brilho" transform="translate(430 120) scale(28)"/>
      <use href="#brilho" transform="translate(80 150) scale(16)"/>

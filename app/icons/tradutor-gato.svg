    <circle cx="256" cy="262" r="204" fill="none" stroke="url(#ouro)" stroke-width="8"/>
    <circle cx="256" cy="262" r="189" fill="none" stroke="url(#ouro)" stroke-width="2.5" opacity=".6"/>

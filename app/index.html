<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bar">
<title>Bar · Caixa, Portaria e Estoque</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#f2f3f7;color:#161826;font:16px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){html,body{background:#0f1018;color:#ecedf6}}
body{display:flex;flex-direction:column}
.frames{flex:1;position:relative}
iframe,.painel{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;box-sizing:border-box}
iframe.on,.painel.on{display:block}
.painel{overflow:auto;padding:24px 18px;max-width:480px;margin:0 auto;left:0;right:0}
.painel h1{font-size:22px;margin:0 0 6px}
.painel p{color:#667085;font-size:14px;margin:0 0 16px}
.painel label{display:block;font-size:13px;color:#667085;margin:12px 0 4px}
.painel input{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:1px solid #dcdfe8;border-radius:12px;background:#fff;color:#161826}
.painel button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#6d28d9;color:#fff;font-size:16px;font-weight:700}
.painel button.sec{background:#dcdfe8;color:#161826}
.painel .info{background:#fff;border:1px solid #dcdfe8;border-radius:12px;padding:12px;font-size:15px;line-height:1.7}
@media (prefers-color-scheme:dark){.painel input,.painel .info{background:#1a1b27;color:#ecedf6;border-color:#2c2e40}.painel p,.painel label{color:#9aa0b5}}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:#161826;padding-bottom:env(safe-area-inset-bottom,0px)}
nav[hidden]{display:none}
nav button{border:0;background:none;color:#9aa0b5;padding:8px 0 10px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:#fff;font-weight:700}
</style>
<script src="firebase-config.js"></script>
<script src="claude-local.js"></script>
</head>
<body>
<div class="frames">
  <iframe id="f-caixa" title="Caixa bar" data-src="caixa.html"></iframe>
  <iframe id="f-portaria" title="Portaria do Bar" data-src="portaria.html"></iframe>
  <iframe id="f-estoque" title="Estoque do Bar" data-src="estoque.html"></iframe>

  <form class="painel" id="entrar">
    <h1>🍸 Entrar no bar</h1>
    <p>Use o mesmo código do bar em todos os celulares da equipe para os dados sincronizarem. Quem cria o código primeiro vira o dono.</p>
    <label for="codigo">Código do bar</label>
    <input id="codigo" required minlength="6" autocomplete="off" autocapitalize="none" placeholder="ex.: barzinho-centro-2026">
    <label for="nome">Seu nome</label>
    <input id="nome" required autocomplete="name" placeholder="ex.: Ana">
    <button type="submit">Entrar</button>
    <p style="margin-top:14px">Escolha um código difícil de adivinhar: quem souber o código consegue ver e mudar os dados.</p>
  </form>

  <div class="painel" id="f-ajustes">
    <h1>⚙️ Ajustes</h1>
    <div class="info" id="info"></div>
    <button class="sec" id="trocar">Trocar de bar ou de nome</button>
    <button class="sec" id="recarregar">Recarregar o aplicativo</button>
    <button class="sec" id="importar">📥 Importar dados de um arquivo</button>
    <input type="file" id="arquivo" accept=".json,application/json" hidden>
    <p id="msgImport" style="margin-top:12px"></p>
  </div>
</div>
<nav id="nav">
  <button data-tab="caixa"><span>🍸</span>Caixa</button>
  <button data-tab="portaria"><span>🚪</span>Portaria</button>
  <button data-tab="estoque"><span>📦</span>Estoque</button>
  <button data-tab="ajustes"><span>⚙️</span>Ajustes</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const nuvem=!!window.FIREBASE_CONFIG;
const codigo=()=>(localStorage.getItem('bar-codigo')||'').trim();
const nome=()=>(localStorage.getItem('bar-nome')||'').trim();

function abrir(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('iframe,.painel').forEach(f=>f.classList.toggle('on',f.id==='f-'+t));
  localStorage.setItem('bar-aba',t);
}
function carregarAbas(){
  document.querySelectorAll('iframe').forEach(f=>{if(!f.src)f.src=f.dataset.src});
}
function mostrarInfo(){
  $('#info').innerHTML=nuvem&&codigo()
    ?`☁️ <b>Sincronizando entre os celulares</b><br>Bar: <b>${codigo().replace(/</g,'&lt;')}</b><br>Você: <b>${(nome()||'—').replace(/</g,'&lt;')}</b>`
    :`📱 <b>Dados salvos só neste aparelho</b><br>${nuvem?'Entre com o código do bar para sincronizar.':'A sincronização ainda não foi configurada (Firebase).'}`;
  $('#trocar').hidden=!nuvem;
}
function iniciar(){
  $('#nav').hidden=false;
  $('#entrar').classList.remove('on');
  carregarAbas();mostrarInfo();
  abrir(localStorage.getItem('bar-aba')||'caixa');
}
$('#entrar').onsubmit=e=>{
  e.preventDefault();
  const c=$('#codigo').value.trim().toLowerCase().replace(/\s+/g,'-').replace(/\//g,'-');
  if(c.length<6)return;
  localStorage.setItem('bar-codigo',c);
  localStorage.setItem('bar-nome',$('#nome').value.trim());
  location.reload();
};
$('#trocar').onclick=()=>{
  $('#codigo').value=codigo();$('#nome').value=nome();
  localStorage.removeItem('bar-codigo');
  $('#nav').hidden=true;
  document.querySelectorAll('iframe,.painel').forEach(f=>f.classList.remove('on'));
  $('#entrar').classList.add('on');
};
$('#recarregar').onclick=()=>location.reload();
$('#importar').onclick=()=>$('#arquivo').click();
$('#arquivo').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const msg=$('#msgImport');
  try{
    const dados=JSON.parse(await f.text());
    if(!dados||!dados.apps)throw new Error('formato');
    const n=Object.values(dados.apps).reduce((s,cols)=>s+Object.values(cols).reduce((a,d)=>a+Object.keys(d).length,0),0);
    if(!confirm('Importar '+n+' registros de Caixa, Portaria e Estoque?\n\nRegistros iguais que já estiverem no app serão substituídos.'))return;
    msg.textContent='Importando…';
    const r=await window.__barImportar(dados);
    msg.textContent='✅ '+r.total+' registros importados '+(r.onde==='nuvem'?'na nuvem (todos os celulares do bar vão receber)':'neste aparelho')+'. Recarregando…';
    setTimeout(()=>location.reload(),1800);
  }catch(err){msg.textContent='❌ Não consegui importar este arquivo. Confira se é o arquivo de dados do bar.'}
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>abrir(b.dataset.tab));

if(nuvem&&!codigo()){
  $('#nav').hidden=true;$('#nome').value=nome();
  $('#entrar').classList.add('on');
}else iniciar();

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

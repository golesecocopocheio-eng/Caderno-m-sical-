<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bar">
<title>Bar · Caixa e Portaria</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
html,body{margin:0;height:100%;background:#f2f3f7;font:16px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){html,body{background:#0f1018}}
body{display:flex;flex-direction:column}
.frames{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
iframe.on{display:block}
nav{display:grid;grid-template-columns:1fr 1fr;background:#161826;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;color:#9aa0b5;padding:8px 0 10px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="frames">
  <iframe id="f-caixa" title="Caixa bar" src="caixa.html"></iframe>
  <iframe id="f-portaria" title="Portaria do Bar" src="portaria.html"></iframe>
</div>
<nav>
  <button data-tab="caixa"><span>🍸</span>Caixa</button>
  <button data-tab="portaria"><span>🚪</span>Portaria</button>
</nav>
<script>
function abrir(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('iframe').forEach(f=>f.classList.toggle('on',f.id==='f-'+t));
  localStorage.setItem('bar-aba',t);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>abrir(b.dataset.tab));
abrir(localStorage.getItem('bar-aba')||'caixa');
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

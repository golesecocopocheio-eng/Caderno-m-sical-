<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760">
  <!-- Lampião e Maria Bonita em estilo xilogravura de cordel (desenho original do Bar Conect) -->
  <g fill="#f5c542">
    <!-- sol do sertão -->
    <g transform="translate(300 150)">
      <circle r="62"/>
      <g id="raio"><path d="M-9 -78 L0 -118 L9 -78 Z"/></g>
      <use href="#raio" transform="rotate(22.5)"/><use href="#raio" transform="rotate(45)"/><use href="#raio" transform="rotate(67.5)"/>
      <use href="#raio" transform="rotate(90)"/><use href="#raio" transform="rotate(112.5)"/><use href="#raio" transform="rotate(135)"/>
      <use href="#raio" transform="rotate(157.5)"/><use href="#raio" transform="rotate(180)"/><use href="#raio" transform="rotate(202.5)"/>
      <use href="#raio" transform="rotate(225)"/><use href="#raio" transform="rotate(247.5)"/><use href="#raio" transform="rotate(270)"/>
      <use href="#raio" transform="rotate(292.5)"/><use href="#raio" transform="rotate(315)"/><use href="#raio" transform="rotate(337.5)"/>
    </g>
    <!-- mandacarus -->
    <path d="M40 760 V520 q0-16 14-16 t14 16 V760 Z M40 600 h-18 q-10 0-10-10 v-50 q0-12 10-12 t10 12 v38 h8 Z M68 640 h18 q10 0 10-10 v-62 q0-12-10-12 t-10 12 v50 h-8 Z"/>
    <path d="M532 760 V500 q0-16 14-16 t14 16 V760 Z M532 590 h-18 q-10 0-10-10 v-56 q0-12 10-12 t10 12 v44 h8 Z M560 625 h18 q10 0 10-10 v-70 q0-12-10-12 t-10 12 v58 h-8 Z"/>
    <!-- chão -->
    <path d="M0 760 V712 Q150 680 300 704 T600 700 V760 Z"/>

    <!-- LAMPIÃO -->
    <g transform="translate(205 0)">
      <!-- chapéu de couro em meia-lua com a estrela -->
      <path d="M-92 268 Q0 150 92 268 Q60 238 0 236 Q-60 238 -92 268 Z"/>
      <path d="M-46 250 Q0 196 46 250 Z"/>
      <!-- rosto -->
      <ellipse cx="0" cy="286" rx="34" ry="40"/>
      <!-- corpo com gibão -->
      <path d="M-70 360 Q-40 326 0 330 Q40 326 70 360 L82 540 Q40 552 0 548 Q-40 552 -82 540 Z"/>
      <!-- pernas e alpercatas -->
      <path d="M-58 540 L-50 700 L-14 700 L-6 548 Z M6 548 L14 700 L50 700 L58 540 Z"/>
      <path d="M-62 700 h52 v10 h-52 Z M10 700 h52 v10 h-52 Z"/>
      <!-- braço com o rifle -->
      <path d="M62 356 L104 470 L88 478 L50 380 Z"/>
      <path d="M118 300 L126 300 L118 640 L106 640 Z"/>
      <path d="M100 620 L124 620 L128 668 L96 668 Z"/>
      <!-- braço esquerdo -->
      <path d="M-62 356 L-96 470 L-80 478 L-48 380 Z"/>
    </g>

    <!-- MARIA BONITA -->
    <g transform="translate(405 14)">
      <!-- chapéu menor -->
      <path d="M-74 262 Q0 166 74 262 Q48 238 0 236 Q-48 238 -74 262 Z"/>
      <path d="M-36 248 Q0 204 36 248 Z"/>
      <!-- cabelo solto até os ombros -->
      <path d="M-38 262 Q-48 330 -34 358 L34 358 Q48 330 38 262 Z"/>
      <!-- rosto -->
      <ellipse cx="0" cy="284" rx="29" ry="35"/>
      <!-- blusa -->
      <path d="M-58 362 Q-30 334 0 338 Q30 334 58 362 L50 470 L-50 470 Z"/>
      <!-- saia rodada -->
      <path d="M-50 466 L50 466 L96 690 Q0 716 -96 690 Z"/>
      <!-- pés -->
      <path d="M-40 690 h34 v14 h-34 Z M6 690 h34 v14 h-34 Z"/>
      <!-- braços -->
      <path d="M52 362 L84 452 L70 460 L42 384 Z"/>
      <path d="M-52 362 L-84 452 L-70 460 L-42 384 Z"/>
    </g>
  </g>

  <!-- detalhes "entalhados" (cor do fundo por cima, como na xilogravura) -->
  <g fill="#2a0f47">
    <!-- estrela do chapéu de Lampião -->
    <path transform="translate(205 222) scale(0.9)" d="M0 -18 L5 -6 L18 -6 L8 2 L12 15 L0 7 L-12 15 L-8 2 L-18 -6 L-5 -6 Z"/>
    <!-- estrela do chapéu de Maria -->
    <path transform="translate(405 236) scale(0.7)" d="M0 -18 L5 -6 L18 -6 L8 2 L12 15 L0 7 L-12 15 L-8 2 L-18 -6 L-5 -6 Z"/>
    <!-- óculos redondos de Lampião -->
    <g fill="none" stroke="#2a0f47" stroke-width="4">
      <circle cx="191" cy="282" r="9"/><circle cx="219" cy="282" r="9"/><path d="M200 282 h10"/>
    </g>
    <!-- cartucheiras cruzadas -->
    <path d="M140 362 L262 520 L252 530 L130 372 Z M270 362 L148 520 L158 530 L280 372 Z" opacity=".9"/>
    <path d="M128 492 h154 v12 h-154 Z"/>
    <!-- lenço e detalhes de Maria Bonita -->
    <path d="M375 362 L405 400 L435 362 L428 358 L405 388 L382 358 Z"/>
    <path d="M330 600 Q405 620 480 600 L482 608 Q405 630 328 608 Z M318 650 Q405 674 492 650 L494 658 Q405 684 316 658 Z"/>
    <!-- costuras do gibão -->
    <path d="M180 410 v120 M230 410 v120" stroke="#2a0f47" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <!-- textura de chão -->
    <path d="M60 730 h40 M150 740 h60 M260 726 h30 M360 742 h50 M470 730 h40" stroke="#2a0f47" stroke-width="3" fill="none"/>
  </g>
</svg>

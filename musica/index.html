<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clan music</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#09090B">

<style>
@font-face{font-family:"Bricolage";src:url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"JBMono";src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"JBMono";src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--bg:#FAF7EF;--card:#FFFFFF;--ink:#14110A;--mute:#6D6552;--line:#E9E1CB;--chord:#8A5A00;--acc:#14110A;--accT:#F5C242;--hl:#F5C242;--hlT:#2A1A00;--rec:#E5484D;--danger:#C0322F;
--ui:"Bricolage",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JBMono",ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#09090B;--card:#151417;--ink:#F6F1E4;--mute:#A39C8A;--line:#2A2619;--chord:#F5C242;--acc:#F5C242;--accT:#14110A;--rec:#FF6B70;--danger:#FF8A80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--ui)}
#app{max-width:620px;margin:0 auto;padding:0 16px 120px}
h1,h2{font-family:var(--ui)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 15px;cursor:pointer}
button:active{transform:scale(.98)}
button.pri{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
button.ic{padding:8px;line-height:0;border-radius:12px;flex:0 0 auto}
button.ic svg{width:22px;height:22px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;align-items:center}

/* início */
.top{padding:20px 0 4px}
.brand{flex:1;margin:0;font:800 38px/1 var(--ui);letter-spacing:-.02em}
.stat{margin:6px 0 10px;color:var(--mute);font-size:15px}
.staff{height:37px;background:repeating-linear-gradient(to bottom,var(--line) 0 1.5px,transparent 1.5px 9px);margin:0 0 6px;-webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}
.staff.big{height:55px;margin:34px 0 18px}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0;padding:11px 13px;border-radius:12px;background:color-mix(in srgb,var(--hl) 26%,var(--card));font-size:14px}
.alert button{flex:0 0 auto;padding:7px 12px;font-weight:700}
.songs{margin-top:10px}
.song{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 2px}
.key{font:700 18px/1 var(--mono);min-width:56px;text-align:center;padding:9px 6px;color:var(--hlT);background:linear-gradient(transparent 8%,var(--hl) 8% 94%,transparent 94%);border-radius:5px 12px 6px 11px;transform:rotate(-2deg)}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info b{font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:12px var(--mono);color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:8px 10px}
.empty h2{color:var(--ink);font-size:22px;margin:0 0 6px}
.cta{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:15px 26px;border-radius:999px;background:var(--acc);color:var(--accT);border:0;font-weight:700;font-size:17px;box-shadow:0 10px 28px rgba(20,24,58,.3);white-space:nowrap}

/* música */
.sh{display:flex;gap:6px;align-items:flex-start;padding:14px 0 6px}
.tt{flex:1;min-width:0}
.ti{font:800 27px/1.15 var(--ui);border:0;background:transparent;padding:6px 4px;letter-spacing:-.01em}
.ar{border:0;background:transparent;padding:2px 4px;color:var(--mute);font-size:16px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.sv{font:12px var(--mono);color:var(--mute);min-height:16px;white-space:nowrap}
.meta2{display:flex;gap:8px;margin:2px 0 12px}
.sel{display:flex;align-items:center;gap:8px;flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 12px}
.sel span{color:var(--mute);font-size:14px}
.sel select{border:0;background:transparent;padding:10px 6px;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:0;background:transparent;color:var(--mute);padding:9px 2px 8px;font-size:12px;font-weight:500}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--hl)}
textarea.code{font:15px/1.55 var(--mono);min-height:52vh;white-space:pre;overflow:auto;resize:vertical}
pre.view{font:15px/1.7 var(--mono);margin:12px 0;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:40vh}
.ch{color:var(--chord);font-weight:700}
.tone{min-width:60px;text-align:center;font:700 16px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.deg{display:flex;flex-direction:column;align-items:center;padding:14px 6px;gap:2px}
.deg small{color:var(--mute)}
.deg b{font:700 24px var(--mono);color:var(--chord)}
.hint{color:var(--mute);font-size:14px;margin:8px 0}
.card2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.au{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.au .row{margin-top:6px}
.au .nm{font-weight:700;padding:7px 9px}
.chk{display:flex;gap:9px;align-items:center;margin:9px 0;font-size:14px}.chk input{width:auto}
.fb{flex:1;text-align:center;padding:11px;border-radius:12px;cursor:pointer;background:var(--acc);color:var(--accT);font-weight:700}
.fb2{display:block;text-align:center;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tg.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
.au input[type=range],.card2 input[type=range],.fx input[type=range]{padding:0;border:0;background:none;width:100%}
.pc{min-width:58px;text-align:right;font:14px var(--mono)}
h2.mh{margin:16px 0 6px;font-size:20px;font-weight:800}
input[type=range],input[type=checkbox]{accent-color:var(--acc)}
button.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:700}
.fx{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.fx summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none}
.fx summary::-webkit-details-marker{display:none}
.fx summary::before{content:"+";display:inline-block;width:18px;font:700 16px var(--mono)}
.fx[open] summary::before{content:"–"}
.fx label.l{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:6px}
.fx label.l small{flex:0 0 74px;color:var(--mute)}
.fx progress{width:100%;height:8px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.upd{background:var(--hl);color:var(--hlT);padding:10px 16px;font-size:14px;text-align:center}.upd a{color:inherit;font-weight:700}

.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--accT)}
.song.now b{color:var(--chord)}
.song[data-pid] .key{flex:0 0 46px;width:46px;height:46px;min-width:0;display:grid;place-items:center;border-radius:50%;background:var(--hl);color:var(--hlT);padding:0}
.song[data-pid] .key .i{width:20px;height:20px}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}.eq i{width:4px;background:currentColor;border-radius:2px;animation:eq .9s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}@media(prefers-reduced-motion:reduce){.eq i{animation:none;height:12px}}
.pbar{position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(20,30,80,.12);z-index:5}
.pbar .pi{display:flex;flex-direction:column;min-width:0}.pbar .pi b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pbar .pi small{color:var(--mute)}
.pbar .ps{display:flex;align-items:center;gap:10px;margin:6px 0}.pbar .ps input{flex:1;padding:0;border:0;background:none}.tm{font:12px var(--mono);color:var(--mute);min-width:34px}
.pbar .pc{display:flex;justify-content:space-between;align-items:center}
.pbar .pc .ic{color:var(--mute)}.pbar .pc .ic.on{color:var(--acc)}.pbar .pc .ic .i{width:24px;height:24px}
.pb{width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--accT);border:0;display:grid;place-items:center;padding:0}.pb .i{width:28px;height:28px}
#app:has(#pbar){padding-bottom:240px}

.stc .stt{display:flex;align-items:center;gap:14px;margin-bottom:12px}.tmr{font:700 34px var(--mono);letter-spacing:-1px}
.lvl{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.lvl i{display:block;height:100%;width:0;background:var(--rec);transition:width .08s}
.recbig{flex:1;padding:16px;font-size:17px;font-weight:800;background:var(--rec);color:#fff;border-color:var(--rec)}.recbig.rec{background:var(--ink);border-color:var(--ink)}
.live{min-height:26px;color:var(--mute);font-size:19px;margin:10px 0 6px;font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.chips button{padding:6px 11px;border-radius:999px;font-size:13px}
.bd{display:flex;gap:8px;justify-content:center;margin:12px 0}.bd i{width:18px;height:18px;border-radius:50%;background:var(--line)}.bd i.on{background:var(--acc)}
.tun{margin-top:10px}.tnn{font:800 56px var(--ui);text-align:center;line-height:1.1}
.nb{position:relative;height:14px;background:var(--line);border-radius:8px;margin:10px 8px}.nb .nz{position:absolute;left:47.5%;width:5%;top:0;bottom:0;background:var(--hl);opacity:.6}.nb .nd{position:absolute;top:-5px;width:6px;height:24px;margin-left:-3px;border-radius:3px;background:var(--ink)}.nb .nd.okk{background:#1f9d55}
.take{border-bottom:1px solid var(--line);padding:8px 0}.take:last-child{border:0}
details.card2>summary{cursor:pointer;list-style:none}details.card2>summary::-webkit-details-marker{display:none}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:6px;z-index:4}.savebar button{width:100%;padding:15px;font-size:16px;box-shadow:0 6px 20px rgba(20,30,80,.25)}
.ic{position:relative}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);vertical-align:middle}.ic .dot{position:absolute;right:5px;top:5px;border:2px solid var(--card);width:11px;height:11px;box-sizing:border-box}.dot.on{background:#1f9d55}
.code2{font:700 24px var(--mono);text-align:center;padding:16px 8px;margin:10px 0;background:var(--bg);border:1px dashed var(--line);border-radius:12px;word-break:break-all;user-select:all}

/* visual 2.0 */
body{background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-size:31px;white-space:nowrap}.brand .mk{height:40px;width:auto;flex:0 0 auto;filter:drop-shadow(0 2px 6px rgba(245,194,66,.35))}
.songs{display:flex;flex-direction:column;gap:10px}
.songs>.song,.rrow>.song{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.song.now{border-color:var(--hl)}
.key{transform:none;border-radius:11px;background:linear-gradient(135deg,#FFE9A0,#F5C242);box-shadow:inset 0 -2px 0 rgba(120,70,0,.18);min-width:52px}
.seg{border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}.seg button{border-radius:12px;padding:10px 4px}
.card2{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card2.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--hl) 16%,var(--card)),var(--card) 60%)}
.cta{background:var(--acc);color:var(--accT);bottom:calc(92px + env(safe-area-inset-bottom,0px));box-shadow:0 12px 30px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){.cta{background:linear-gradient(135deg,#FFE9A0,#F5C242);box-shadow:0 12px 30px rgba(0,0,0,.5)}}
.nav{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:22px;padding-bottom:0;box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:600px;margin:0 auto;overflow:hidden}
.nav button.on::before{top:0;height:3px;background:var(--hl)}
.savebar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button.pri{box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 30%,transparent)}button:disabled{opacity:.45}
.rrow{display:flex;gap:6px;align-items:center}.rrow>.song{flex:1;min-width:0}.rrow .num{font:700 15px var(--mono);color:var(--mute);width:22px;text-align:center}
.rrow .ic.sel{background:var(--hl);color:var(--hlT);border-color:var(--hl)}
#set .rrow{padding:8px 0;border-bottom:1px solid var(--line)}#set .rrow:last-child{border:0}#set .rrow>.song{background:none;border:0;box-shadow:none;padding:2px 4px;border-radius:0}
.plw{max-height:34vh;overflow:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.pal{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:20;padding-top:env(safe-area-inset-top,0px)}
.phd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}.phd .pt{flex:1;min-width:0;display:flex;flex-direction:column}.phd .pt b{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phd .pt small{color:var(--mute)}
.pbody{flex:1;overflow:auto;padding:10px 16px;-webkit-overflow-scrolling:touch}
.pbody pre.view{border:0;background:none;padding:0;margin:0;min-height:0;line-height:1.55;white-space:pre}
.pctl{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.pctl .row{gap:6px;justify-content:space-between}.pctl .ic{min-width:44px;min-height:44px;font:700 15px var(--ui)}.pctl input[type=range]{flex:1;padding:0;border:0;background:none}

/* início e topo preto e dourado */
.hero2{margin:0 -16px 14px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;background:radial-gradient(90% 120% at 100% 0,rgba(245,194,66,.28),transparent 60%),linear-gradient(160deg,#050505,#171106);color:#F7D774;border-radius:0 0 28px 28px}
.hero2 .brand{color:#F7D774;font-size:27px}.hero2 .hi{margin:12px 0 10px;font:700 22px/1.2 var(--ui);color:#FFF6DC}
.hero2 .stats{display:flex;gap:18px;color:#CDBE94;font-size:14px}.hero2 .stats b{color:#F7D774;font:700 18px var(--mono);margin-right:3px}
button.gh{background:rgba(255,255,255,.07);border-color:rgba(245,194,66,.35);color:#F7D774}.hero2 .dot{border-color:#14110A}
.ov{display:block;color:var(--mute);font-size:13px;margin-bottom:8px;letter-spacing:.2px}
.cont .big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:none;padding:0}.cont .big b{font-size:26px;line-height:1.15}.cont .big span{color:var(--mute);font-size:15px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips2 span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}.chips2 span.ok{color:var(--ink);border-color:var(--hl);background:color-mix(in srgb,var(--hl) 20%,var(--card))}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;border-radius:20px;min-height:104px}.qa button span{line-height:0;margin-bottom:8px}.qa button span .i{width:26px;height:26px}.qa b{font-size:16px}.qa small{color:var(--mute);font-size:13px}
.qa button.gold{background:linear-gradient(145deg,#FFE9A0,#F5C242 60%,#D9A21F);border-color:#D9A21F;color:#2A1A00}.qa button.gold small{color:#5A3E00}
button{white-space:nowrap}
h2.sec{font:700 18px var(--ui);margin:20px 2px 8px}
.fch{margin:0 0 10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.fch button{white-space:nowrap;padding:8px 14px;font-size:14px}.fch button.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
.fz{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 5px 0 0;background:var(--mute)}.fz-ideia{background:#4DA3FF}.fz-compondo{background:#F5C242}.fz-pronta{background:#34C27A}
.hn{max-width:560px}.pbar{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#app:has(.hn){padding-bottom:150px}#app:has(#pbar){padding-bottom:330px}
.hn button.on::before{background:var(--hl)}
.lane{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lc);border-radius:18px;padding:12px;margin:12px 0}
.lane .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lane .lh b{font-size:17px}.lane .lh small{color:var(--mute)}.lane .ei{font-size:22px;line-height:1}
.lane .lh button.rec{background:var(--rec);color:#fff;border-color:var(--rec)}.lane .fb.mini{padding:9px 12px;font-size:14px;width:auto;flex:0 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.lane .au{border:0;border-top:1px solid var(--line);border-radius:0;margin:10px 0 0;padding:10px 0 0;background:none}
.isel{flex:1;padding:7px 10px;font-size:14px}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}.shin{max-width:560px;margin:0 auto;padding:16px 16px 90px}
.wv{position:relative;height:90px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin:12px 0}.wv canvas{width:100%;height:100%;display:block}.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);left:0;pointer-events:none}
.edc{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--card)}.edc summary{font-weight:700;cursor:pointer}.edc .row{margin-top:8px}.edc select{width:100%}
#toast{z-index:80}

const NOISE=/^(\|+|-+|\.+|~+|\(?\d+x\)?|x\d+|\(|\)|—)$/i;

let sr=null,srOn=false,recTipo='mix',recBk=true,recNS=true;
function stopSR(){srOn=false;try{sr&&sr.stop()}catch(e){}}
/* ---------- mixer ---------- */
const mx={ac:null,buf:{},bad:{},src:[],gn:{},master:null,playing:false,t0:0,pos:0,dur:0,raf:0,mv:1};
const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
function AC(){if(!mx.ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;mx.ac=new C()}if(mx.ac.state==='suspended')mx.ac.resume().catch(()=>{});return mx.ac}
async function loadBufs(s){const ac=AC();if(!ac)return false;
 for(const a of s.audios){if(mx.buf[a.id]||mx.bad[a.id]||!a.blob)continue;try{mx.buf[a.id]=await ac.decodeAudioData(await a.blob.arrayBuffer())}catch(e){mx.bad[a.id]=1}}return true}
const anySolo=s=>s.audios.some(a=>a.solo);
const eff=(s,a)=>(anySolo(s)?a.solo:!a.mute)?(a.vol==null?1:a.vol):0;
const durOf=s=>Math.max(0,...s.audios.filter(a=>mx.buf[a.id]).map(a=>mx.buf[a.id].duration+Math.max(0,(a.off||0)/1000)));
const mixPos=()=>mx.playing?Math.max(0,mx.ac.currentTime-mx.t0):mx.pos;
function killSrc(){mx.src.forEach(x=>{try{x.stop()}catch(e){}try{x.disconnect()}catch(e){}});mx.src=[];mx.gn={};try{mx.master&&mx.master.disconnect()}catch(e){}try{mx.mc&&mx.mc.disconnect()}catch(e){}}
function impulse(ctx){const sr=ctx.sampleRate,len=Math.floor(sr*1.8),b=ctx.createBuffer(2,len,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return b}
/* efeitos de uma faixa: cortar graves, equalizador de 3 bandas, compressor e reverb */
function chain(ctx,a,dest){const fx=a.fx||{},input=ctx.createGain();let last=input;
 const add=n=>{last.connect(n);last=n;return n};
 const bq=(type,f,g,q)=>{const n=ctx.createBiquadFilter();n.type=type;n.frequency.value=f;if(g!=null)n.gain.value=g;if(q)n.Q.value=q;return add(n)};
 if(fx.hp)bq('highpass',90,null,0.707);
 if(fx.low)bq('lowshelf',120,fx.low);
 if(fx.mid)bq('peaking',1500,fx.mid,0.9);
 if(fx.high)bq('highshelf',6000,fx.high);
 if(fx.comp){const L=fx.comp===true?2:Math.max(1,Math.min(3,+fx.comp)),c=ctx.createDynamicsCompressor();c.threshold.value=[-20,-26,-32][L-1];c.knee.value=22;c.ratio.value=[2,3.5,6][L-1];c.attack.value=0.012;c.release.value=0.22;add(c)}
 const fader=ctx.createGain();add(fader);
 if(fx.rev>0){const cv=ctx.createConvolver();cv.buffer=impulse(ctx);const w=ctx.createGain();w.gain.value=Math.min(1,fx.rev)*0.55;fader.connect(cv);cv.connect(w);w.connect(dest)}
 fader.connect(dest);return{input:input,fader:fader}}
/* masterização: corta rumble, realça graves e brilho, comprime e limita */
function masterChain(ctx,mode,dest){const inp=ctx.createGain();if(!mode){inp.connect(dest);return inp}
 const f=mode===2,mk=(t,fr,g)=>{const n=ctx.createBiquadFilter();n.type=t;n.frequency.value=fr;if(g!=null)n.gain.value=g;return n};
 const hp=mk('highpass',30),lo=mk('lowshelf',110,f?2:1),hi=mk('highshelf',9000,f?3:1.5);
 const co=ctx.createDynamicsCompressor();co.threshold.value=f?-22:-18;co.knee.value=20;co.ratio.value=f?4:2.2;co.attack.value=0.02;co.release.value=0.25;
 const mu=ctx.createGain();mu.gain.value=f?1.6:1.25;
 const li=ctx.createDynamicsCompressor();li.threshold.value=-2;li.knee.value=0;li.ratio.value=20;li.attack.value=0.002;li.release.value=0.08;
 inp.connect(hp);hp.connect(lo);lo.connect(hi);hi.connect(co);co.connect(mu);mu.connect(li);li.connect(dest);return inp}
function mixStart(s,from,only){const ac=AC();if(!ac)return false;if(only!==undefined)mx.only=only;killSrc();
 mx.master=ac.createGain();mx.master.gain.value=mx.mv;mx.mc=masterChain(ac,s.mast||0,ac.destination);mx.master.connect(mx.mc);
 const now=ac.currentTime+0.05;mx.dur=mx.only?Math.max(0,...s.audios.filter(a=>mx.only.has(a.id)&&mx.buf[a.id]).map(a=>mx.buf[a.id].duration+Math.max(0,(a.off||0)/1000))):durOf(s);
 s.audios.forEach(a=>{const b=mx.buf[a.id];if(!b)return;if(mx.only&&!mx.only.has(a.id))return;const c=chain(ac,a,mx.master);c.fader.gain.value=mx.only?(a.vol==null?1:a.vol):eff(s,a);mx.gn[a.id]=c.fader;
  const src=ac.createBufferSource();src.buffer=b;src.connect(c.input);const tp=from-(a.off||0)/1000;
  if(tp>=b.duration)return;if(tp>=0)src.start(now,tp);else src.start(now-tp,0);mx.src.push(src)});
 mx.t0=now-from;mx.playing=true;tick();return true}
function mixStop(){killSrc();cancelAnimationFrame(mx.raf);mx.playing=false;mx.pos=0;uiMix()}
function mixPause(){const p=mixPos();killSrc();cancelAnimationFrame(mx.raf);mx.playing=false;mx.pos=p;uiMix()}
function tick(){cancelAnimationFrame(mx.raf);const f=()=>{if(!mx.playing)return;const p=mixPos();if(mx.dur&&p>=mx.dur){mixStop();return}uiMix(p);mx.raf=requestAnimationFrame(f)};f()}
function uiMix(p){const b=$('#mxp');if(!b)return;if(p==null)p=mixPos();b.textContent=mx.playing?'⏸ Pausar':'▶ Tocar tudo';
 document.querySelectorAll('[data-ls]').forEach(x=>{const ids=x.dataset.ls.split(','),on=mx.playing&&mx.only&&ids.length===mx.only.size&&ids.every(i=>mx.only.has(i));const t=on?'■ Parar':(x.dataset.lane?'▶ Ouvir pista':'▶ Ouvir');if(x.textContent!==t)x.textContent=t});const t=$('#mxt');if(t)t.textContent=fmt(p)+' / '+fmt(mx.dur);const r=$('#mxs');if(r&&document.activeElement!==r){r.max=mx.dur||1;r.value=p}}
function wav(b){const ch=b.numberOfChannels,n=b.length,sr=b.sampleRate,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
 const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*ch*2,true);
 const d=[];let pk=0;for(let c=0;c<ch;c++){const x=b.getChannelData(c);d.push(x);for(let i=0;i<n;i++){const y=Math.abs(x[i]);if(y>pk)pk=y}}
 const k=pk>1?1/pk:1;let o=44;
 for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,d[c][i]*k));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}
 return new Blob([ab],{type:'audio/wav'})}
function normalize(b,db,pk){let sum=0,n=0,peak=0;
 for(let c=0;c<b.numberOfChannels;c++){const x=b.getChannelData(c);for(let i=0;i<x.length;i++){const y=x[i];sum+=y*y;const ay=y<0?-y:y;if(ay>peak)peak=ay}n+=x.length}
 if(!peak||!n)return;const rms=Math.sqrt(sum/n),g=Math.min(Math.pow(10,db/20)/rms,pk/peak);
 for(let c=0;c<b.numberOfChannels;c++){const x=b.getChannelData(c);for(let i=0;i<x.length;i++)x[i]*=g}}
async function bounce(s){const act=s.audios.filter(a=>mx.buf[a.id]&&eff(s,a)>0);if(!act.length){toast('Nenhuma faixa audível para juntar.');return}
 const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OC){toast('Este aparelho não consegue juntar as faixas.');return}
 toast(s.mast?'Juntando e masterizando…':'Juntando as faixas…');
 const sr=44100,tail=act.some(a=>a.fx&&a.fx.rev>0)?2:0,d=durOf(s)+tail,oc=new OC(2,Math.max(1,Math.ceil(d*sr)),sr);
 const m=oc.createGain();m.gain.value=mx.mv;m.connect(masterChain(oc,s.mast||0,oc.destination));
 act.forEach(a=>{const c=chain(oc,a,m);c.fader.gain.value=eff(s,a);const src=oc.createBufferSource();src.buffer=mx.buf[a.id];src.connect(c.input);const o=(a.off||0)/1000;if(o>=0)src.start(o);else src.start(0,-o)});
 try{const r=await oc.startRendering();if(s.mast)normalize(r,s.mast===2?-13:-16,0.97);
  s.audios.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,5),tipo:'mix',name:(s.mast?'Mix masterizado ':'Mix ')+new Date().toLocaleString('pt-BR'),blob:wav(r),vol:1});save(s);put(s);toast('Mix salvo como nova faixa');if(cur===s&&tab==='audio')audioTab($('#pane'))}
 catch(e){toast('Não consegui juntar as faixas.')}}

/* redutor de ruído: subtração espectral (aprende o ruído nos trechos mais silenciosos) */
function fftPlan(n){const rev=new Uint32Array(n),cs=new Float64Array(n/2),sn=new Float64Array(n/2);let lg=0;while((1<<lg)<n)lg++;
 for(let i=0;i<n;i++){let r=0;for(let b=0;b<lg;b++)if(i&(1<<b))r|=1<<(lg-1-b);rev[i]=r}
 for(let i=0;i<n/2;i++){cs[i]=Math.cos(2*Math.PI*i/n);sn[i]=-Math.sin(2*Math.PI*i/n)}return{rev,cs,sn,n}}
function fft(re,im,P){const{rev,cs,sn,n}=P;
 for(let i=0;i<n;i++){const j=rev[i];if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
 for(let len=2;len<=n;len<<=1){const half=len>>1,step=n/len;for(let i=0;i<n;i+=len){for(let j=0,k=0;j<half;j++,k+=step){const a=i+j,b=a+half,wr=cs[k],wi=sn[k],xr=re[b]*wr-im[b]*wi,xi=re[b]*wi+im[b]*wr;re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi}}}}
async function denoise(x,strength,prog){
 const N=2048,H=1024,P=fftPlan(N),len=x.length,pad=N-H,win=new Float64Array(N);for(let i=0;i<N;i++)win[i]=Math.sin(Math.PI*(i+.5)/N);
 const y=new Float64Array(pad+len+N+H);y.set(x,pad);const F=Math.floor((y.length-N)/H)+1,o=new Float64Array(y.length);
 const en=new Float64Array(F);for(let f=0;f<F;f++){let s=0;const b=f*H;for(let i=0;i<N;i++){const v=y[b+i];s+=v*v}en[f]=s}
 const live=[];for(let f=0;f<F;f++)if(en[f]>1e-9)live.push(f);
 if(live.length<4)return Float32Array.from(x);
 live.sort((a,b)=>en[a]-en[b]);const nn=Math.max(6,Math.floor(live.length*0.1)),pick=live.slice(0,nn),K=N/2+1,np=new Float64Array(K),re=new Float64Array(N),im=new Float64Array(N);
 for(const f of pick){const b=f*H;for(let i=0;i<N;i++){re[i]=y[b+i]*win[i];im[i]=0}fft(re,im,P);for(let k=0;k<K;k++)np[k]+=re[k]*re[k]+im[k]*im[k]}
 const nm=new Float64Array(K);for(let k=0;k<K;k++)nm[k]=Math.sqrt(np[k]/pick.length);
 const nsm=new Float64Array(K);for(let k=0;k<K;k++){let s=0,c=0;for(let j=-2;j<=2;j++){const q=k+j;if(q>=0&&q<K){s+=nm[q];c++}}nsm[k]=s/c}
 const alpha=1.2+strength*1.8,beta=0.06+(1-strength)*0.12,gs=new Float64Array(K).fill(1);
 for(let f=0;f<F;f++){const b=f*H;for(let i=0;i<N;i++){re[i]=y[b+i]*win[i];im[i]=0}fft(re,im,P);
  for(let k=0;k<K;k++){const mag=Math.hypot(re[k],im[k]);let g=1;if(mag>1e-12){g=Math.max(mag-alpha*nsm[k],beta*mag)/mag}gs[k]=g>gs[k]?0.7*g+0.3*gs[k]:0.4*g+0.6*gs[k];
   re[k]*=gs[k];im[k]*=gs[k];if(k>0&&k<N/2){re[N-k]=re[k];im[N-k]=-im[k]}}
  for(let i=0;i<N;i++)im[i]=-im[i];fft(re,im,P);
  for(let i=0;i<N;i++)o[b+i]+=(re[i]/N)*win[i];
  if(f%24===0){if(prog)prog(f/F);await new Promise(r=>setTimeout(r,0))}}
 return Float32Array.from(o.subarray(pad,pad+len))}
async function nrTrack(s,a,strength){const b=mx.buf[a.id];if(!b){toast('Esta faixa ainda não foi lida.');return}
 const ac=AC(),bar=$('#np_'+a.id),bt=document.querySelector('[data-nr="'+a.id+'"]');if(bar){bar.hidden=false;bar.value=0}if(bt)bt.disabled=true;
 try{const nb=ac.createBuffer(b.numberOfChannels,b.length,b.sampleRate);
  for(let c=0;c<b.numberOfChannels;c++){const out=await denoise(b.getChannelData(c),strength,v=>{const e=$('#np_'+a.id);if(e)e.value=(c+v)/b.numberOfChannels});nb.copyToChannel(out,c)}
  s.audios.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,5),tipo:'limpo',name:a.name+' (sem ruído)',blob:wav(nb),vol:1});save(s);put(s);toast('Faixa sem ruído criada. A original foi mantida.');
  if(cur===s&&tab==='audio')audioTab($('#pane'))}
 catch(e){toast('Não consegui reduzir o ruído desta faixa.');if(bt)bt.disabled=false;if(bar)bar.hidden=true}}

function audioTab(p){const s=cur,rc=rec&&rec.state==='recording';
 p.innerHTML=`<button class="pri" id="dawb" style="width:100%;margin-bottom:10px;padding:14px">🎛 Mixer estúdio (igual BandLab)</button><div class="card2"><select id="tp" aria-label="O que vou gravar">${tipoOpts()}</select>
 <label class="chk"><input type="checkbox" id="bkc" ${recBk?'checked':''}> Tocar as outras faixas enquanto gravo (use fones)</label>
 <label class="chk"><input type="checkbox" id="nsc" ${recNS?'checked':''}> Filtro de ruído do celular ao gravar</label>
 <div class="row"><label class="fb">Adicionar arquivo<input id="fl" type="file" accept="audio/*" multiple hidden></label><button id="rc" class="${rc?'rec':''}" style="flex:1">${rc?'■ Parar gravação':'● Gravar'}</button></div>

 const mode=/m$/.test(key)?'m':'M';key=key.replace(/m$/,'');if(!N.includes(key)){const i=F.indexOf(key);key=i>=0?N[i]:'C'}
 return{cifra:t,letra,key,mode,acordes:t.split('\n').filter(chordish).length}}

 app.innerHTML=`<header class="sh"><button class="ic" id="back" aria-label="Voltar">${IC.back}</button><div class="tt"><h1 class="ti" style="margin:0;font-size:24px">Cifra de outro artista</h1></div></header>
 <div class="card2"><b>1. Procurar</b><div class="row" style="margin:10px 0 8px"><input id="ia" placeholder="Artista" value="${esc((lk&&lk.artist)||'')}"><input id="it" placeholder="Música" value="${esc((lk&&lk.title)||pre.title||'')}"></div><button class="pri" id="go" style="width:100%;padding:13px">${IC.ext} Abrir no Cifra Club</button><p class="hint" style="margin:8px 0 0">Abre o site do Cifra Club no navegador. Escolha a cifra, selecione o texto dela e copie.</p></div>
 <div class="card2"><b>2. Colar a cifra</b><textarea class="code" id="tx" wrap="off" spellcheck="false" style="min-height:220px;margin-top:10px" placeholder="Cole aqui a cifra copiada">${esc(raw0)}</textarea><div class="row" style="margin-top:8px"><button id="pc" style="flex:1">Colar do celular</button><button id="ck">Conferir</button></div><p class="hint" id="pv" style="margin:8px 0 0"></p></div>
 <label class="chk"><input type="checkbox" id="st" checked> Colocar no set do show</label>
 <button class="pri" id="sv2" style="width:100%;padding:15px;margin-top:8px">Guardar no repertório</button>`;
 $('#back').onclick=()=>{hv='rep';list()};
 const read=()=>{const p=parseCifra($('#tx').value);const e=$('#pv');e.textContent=p.cifra?p.acordes+' linhas de acordes · '+p.letra.split('\n').filter(x=>x.trim()).length+' linhas de letra · tom '+p.key+(p.mode==='m'?'m':''):'Nada colado ainda.';return p};
 $('#go').onclick=()=>{const t=($('#ia').value+' '+$('#it').value).trim();openExt('https://www.cifraclub.com.br/'+(t?'?q='+encodeURIComponent(t):''))};
 $('#pc').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(!t.trim())return toast('A área de cópia está vazia.');const u=fromUrl(t);if(u&&!/\n/.test(t.trim())){$('#ia').value=u.artist;$('#it').value=u.title;toast('Reconheci o link. Agora copie o texto da cifra, não o link.');return}$('#tx').value=t;read()}catch(e){toast('Toque e segure no campo e escolha Colar.')}};
 $('#ck').onclick=read;$('#tx').oninput=()=>{const t=$('#tx').value;if(t.length<400&&/^\s*https?:\/\/\S+\s*$/.test(t)){const u=fromUrl(t);if(u){$('#ia').value=u.artist;$('#it').value=u.title;$('#tx').value='';toast('Reconheci o link. Agora cole o texto da cifra.')}}};
 if(raw0)read();
 $('#sv2').onclick=()=>{const p=read();if(!p.cifra)return toast('Cole o texto da cifra primeiro.');const ti=$('#it').value.trim(),ar=$('#ia').value.trim();if(!ti)return toast('Escreva o nome da música.');
  const k=norm(ti)+'|'+norm(ar);let s=songs.find(x=>norm(x.title)+'|'+norm(x.artist)===k);
  if(s){if(!(s.cifra||'').trim()){s.cifra=p.cifra}else if(!s.cifra.includes(p.cifra.slice(0,60))){toast('Já existe: abri a que você tinha.')}}
  else{s=newSong(ti,ar);s.outro=true;s.cifra=p.cifra;s.letra=p.letra;s.key=p.key;s.mode=p.mode;songs.push(s)}
  if(!(s.letra||'').trim())s.letra=p.letra;s.upd=Date.now();if($('#st').checked&&!(s.rep>0))setAdd(s);put(s);toast('Guardada no repertório');hv='rep';list()}}
/* palco */
const pal={i:0,L:[],fs:20,spd:0,sh:0,mode:'cifra',raf:0,t:0,fr:0,wl:null,follow:true};
function palco(i,L){pal.L=(L||setList()).filter(Boolean);if(!pal.L.length)return toast('O set está vazio.');pal.i=Math.max(0,Math.min(i||0,pal.L.length-1));pal.sh=0;pal.spd=0;pal.mode='cifra';pal.fr=0;try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>pal.wl=w).catch(()=>{})}catch(e){}palDraw()}
function palEnd(){cancelAnimationFrame(pal.raf);pal.raf=0;try{pal.wl&&pal.wl.release()}catch(e){}pal.wl=null;if(pl.id&&!pl.el.paused)pl.el.pause();list()}
function palTxt(s){const fl=flatKey((idx(s.key||'C')+pal.sh+120)%12,s.mode==='M');
 if(pal.mode==='letra'||!(s.cifra||'').trim()){return{html:esc((s.letra||'').trim()||(s.cifra||'')||'Sem texto. Toque em Sair e abra a música para escrever.'),fl}}
 const tx=pal.sh?transpose(s.cifra,pal.sh,fl):s.cifra;return{html:tx.split('\n').map(l=>isChordLine(l)?`<span class="ch">${esc(l)}</span>`:esc(l)).join('\n'),fl}}
function palDraw(){const s=pal.L[pal.i],fl=flatKey((idx(s.key||'C')+pal.sh+120)%12,s.mode==='M'),nm=fl?F:N,kk=nm[(idx(s.key||'C')+pal.sh+120)%12]+(s.mode==='m'?'m':''),t=palTxt(s),hasA=!!pickA(s);
 app.innerHTML=`<div class="pal"><header class="phd"><button class="ic" id="px" aria-label="Sair do palco">${IC.back}</button><div class="pt"><b>${sname(s)}</b><small>${esc(s.artist)||''} · tom ${kk}</small></div><span class="tag">${pal.i+1}/${pal.L.length}</span></header>
 <div class="pbody" id="pb"><pre class="view big" id="pv" style="font-size:${pal.fs}px">${t.html}</pre><div style="height:60vh"></div></div>
 <div class="pctl"><div class="row"><button class="ic" id="pa1" aria-label="Música anterior">${IC.prev}</button><button class="ic" id="fm" aria-label="Letra menor">A−</button><button class="ic" id="fp" aria-label="Letra maior">A+</button><button class="ic" id="tm" aria-label="Descer meio tom">−½</button><button class="ic" id="tp" aria-label="Subir meio tom">+½</button><button class="ic" id="md2" aria-label="Alternar cifra e letra">${pal.mode==='cifra'?'Letra':'Cifra'}</button><button class="ic" id="pa2" aria-label="Próxima música">${IC.next}</button></div>
 <div class="row" style="margin-top:8px;align-items:center"><button id="ro" class="${pal.spd?'pri':''}" style="min-width:104px">${pal.spd?'■ Parar':'▶ Rolar'}</button><input id="sp" type="range" min="0" max="100" value="${pal.spd||30}" aria-label="Velocidade da rolagem">${hasA?`<button id="au" class="ic" aria-label="Tocar áudio">${!pl.el.paused&&pl.id===s.id?IC.pause:IC.play}</button>`:''}</div>${hasA?'<p class="hint" style="margin:6px 0 0;text-align:center">Com o áudio tocando, a letra acompanha sozinha.</p>':''}</div></div>`;
 $('#px').onclick=palEnd;const go=d=>{pal.i=(pal.i+d+pal.L.length)%pal.L.length;pal.sh=0;pal.fr=0;if(pl.id&&!pl.el.paused)pl.el.pause();palDraw()};
 $('#pa1').onclick=()=>go(-1);$('#pa2').onclick=()=>go(1);$('#fm').onclick=()=>{pal.fs=Math.max(12,pal.fs-2);$('#pv').style.fontSize=pal.fs+'px'};$('#fp').onclick=()=>{pal.fs=Math.min(44,pal.fs+2);$('#pv').style.fontSize=pal.fs+'px'};
 $('#tm').onclick=()=>{pal.sh--;palDraw()};$('#tp').onclick=()=>{pal.sh++;palDraw()};$('#md2').onclick=()=>{pal.mode=pal.mode==='cifra'?'letra':'cifra';palDraw()};
 $('#ro').onclick=()=>{pal.spd=pal.spd?0:+$('#sp').value;pal.fr=$('#pb').scrollTop;$('#ro').textContent=pal.spd?'■ Parar':'▶ Rolar';$('#ro').classList.toggle('pri',!!pal.spd)};
 $('#sp').oninput=e=>{if(pal.spd)pal.spd=+e.target.value||1};
 const pb=$('#pb');pb.ontouchstart=pb.onwheel=()=>{if(pal.spd){pal.spd=0;$('#ro').textContent='▶ Rolar';$('#ro').classList.remove('pri')}};
 if($('#au'))$('#au').onclick=()=>{if(pl.id===s.id){pl.el.paused?pl.el.play():pl.el.pause()}else{pl.q=[s];plLoad(0,true)}setTimeout(()=>{const b=$('#au');if(b)b.innerHTML=!pl.el.paused?IC.pause:IC.play},150)};
 cancelAnimationFrame(pal.raf);pal.t=performance.now();const tick=n=>{const dt=(n-pal.t)/1000;pal.t=n;const b=$('#pb');if(!b||!$('#px')){return}
  if(pl.id===s.id&&!pl.el.paused&&pl.el.duration){b.scrollTop=pl.el.currentTime/pl.el.duration*Math.max(0,b.scrollHeight-b.clientHeight)}
  else if(pal.spd){pal.fr+=pal.spd*1.1*dt;b.scrollTop=pal.fr;if(b.scrollTop<pal.fr-2)pal.fr=b.scrollTop}
  pal.raf=requestAnimationFrame(tick)};pal.raf=requestAnimationFrame(tick)}

(async()=>{await openDB();songs=await getAll();const rn=await recoverRecs();list();if(rn)toast(rn+' gravação(ões) interrompida(s) recuperada(s)');clStart();const sp=new URLSearchParams(location.search);if(sp.get('share')){hv='rep';cifraImp({raw:(sp.get('text')||''),url:sp.get('url')||'',title:sp.get('title')||''})}})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caderno Musical</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#0f3d3e">

<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14231f;--mute:#657873;--line:#d3dcd9;--chord:#0a6bd6;--acc:#0f5c4f;--accT:#fff;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#17221f;--ink:#e8f0ed;--mute:#8da39d;--line:#2a3a36;--chord:#6db3ff;--acc:#3fbf9f;--accT:#06251e;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#17221f;--ink:#e8f0ed;--mute:#8da39d;--line:#2a3a36;--chord:#6db3ff;--acc:#3fbf9f;--accT:#06251e;--danger:#ff8a80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px 90px}
header{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
h1{flex:1;margin:0;font:700 22px/1.2 Georgia,"Times New Roman",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
button.ic{padding:6px 12px;font-size:20px;line-height:1}
.songs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.song{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-left:5px solid var(--acc)}
.song span{color:var(--mute);font-size:14px}
.empty{color:var(--mute);text-align:center;margin-top:40px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;background:var(--acc);color:var(--accT);border:0;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.meta{display:grid;gap:8px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:0;background:none;color:var(--mute);padding:10px 4px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
textarea.code{font:15px/1.5 "SF Mono",Menlo,Consolas,monospace;min-height:55vh;white-space:pre;overflow:auto;resize:vertical}
pre.view{font:15px/1.6 "SF Mono",Menlo,Consolas,monospace;margin:12px 0;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:40vh}
.ch{color:var(--chord);font-weight:700}
.tone{min-width:60px;text-align:center;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.deg{display:flex;flex-direction:column;align-items:center;padding:14px 6px;gap:2px}
.deg small{color:var(--mute)}
.deg b{font-size:24px;color:var(--chord)}
.au{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.card2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}.chk input{width:auto}
.fb{flex:1;text-align:center;padding:10px;border-radius:10px;cursor:pointer;background:var(--acc);color:var(--accT);font-weight:600}
.fb2{display:block;text-align:center;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tg.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
.au input[type=range],.card2 input[type=range]{padding:0;border:0;background:none;width:100%}
.au .nm{font-weight:700;padding:6px 8px}
.pc{min-width:56px;text-align:right;font-size:14px}
h2.mh{margin:14px 0 4px;font-size:18px}
input[type=range],input[type=checkbox]{accent-color:var(--acc)}

.hint{color:var(--mute);font-size:14px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const idx=n=>{let i=N.indexOf(n);return i<0?F.indexOf(n):i};
const flatKey=(r,maj)=>maj?[5,10,3,8,1].includes(r):[0,2,5,7,10,3].includes(r);
const CR=/^([A-G][#b]?)((?:maj|min|dim|aug|sus|add|m|M|°|º|\+|-|b|#|\d|\(|\))*)(?:\/([A-G][#b]?))?$/;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s),app=$('#app');
let inst=null,db,mem={},songs=[],cur=null,tab='cifra',edit=false,shift=0,q='',sev=false,rec=null,saveT;

function openDB(){return new Promise(r=>{try{const o=indexedDB.open('caderno',2);o.onupgradeneeded=()=>{const d=o.result;if(!d.objectStoreNames.contains('s'))d.createObjectStore('s',{keyPath:'id'});if(!d.objectStoreNames.contains('a'))d.createObjectStore('a',{keyPath:'id'})};o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r();o.onblocked=()=>r()}catch(e){r()}})}
const rd=(st,id)=>new Promise(r=>{try{const q=db.transaction(st).objectStore(st).get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function getAll(){if(!db)return[];
 const ss=await new Promise(r=>{try{const o=db.transaction('s').objectStore('s').getAll();o.onsuccess=()=>r(o.result||[]);o.onerror=()=>r([])}catch(e){r([])}});
 for(const s of ss){s.audios=s.audios||[];let leg=false;for(const a of s.audios){if(a.blob){leg=true}else{const x=await rd('a',a.id);a.blob=x?x.blob:null;a._p=true}}if(leg)put(s)}
 return ss}
function put(s){try{if(!db)return;const tx=db.transaction(['s','a'],'readwrite'),as=tx.objectStore('a');
 const m={...s,audios:s.audios.map(a=>{if(!a._p&&a.blob){as.put({id:a.id,blob:a.blob});a._p=true}const{blob,_p,...r}=a;return r})};
 tx.objectStore('s').put(m);tx.onerror=()=>toast('Não foi possível salvar neste aparelho.')}catch(e){toast('Não foi possível salvar neste aparelho.')}}
function delBlob(id){try{if(db)db.transaction('a','readwrite').objectStore('a').delete(id)}catch(e){}}
function del(id){try{if(db)db.transaction('s','readwrite').objectStore('s').delete(id)}catch(e){}}
function delSong(s){(s.audios||[]).forEach(a=>delBlob(a.id));del(s.id)}
const sT=new Map();
function save(o){o=o||cur;if(!o)return;o.upd=Date.now();clearTimeout(sT.get(o.id));sT.set(o.id,setTimeout(()=>put(o),300))}
function twice(b,fn){if(b.dataset.arm){fn();return}b.dataset.arm='1';const o=b.textContent;b.textContent='Confirmar?';toast('Toque de novo para excluir');setTimeout(()=>{b.dataset.arm='';b.textContent=o},3000)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}

function transpose(text,s,flat){const nm=flat?F:N;
 const mv=c=>{const m=c.match(CR);if(!m)return c;const r=idx(m[1]);return nm[(r+s+120)%12]+m[2]+(m[3]?'/'+nm[(idx(m[3])+s+120)%12]:'')};
 return text.split('\n').map(l=>isChordLine(l)?l.replace(/\S+/g,mv):l).join('\n')}
function isChordLine(l){const t=l.trim().split(/\s+/);return l.trim()!==''&&t.every(x=>CR.test(x))}

function rows(){const f=songs.filter(s=>((s.title||'')+(s.artist||'')).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.upd-a.upd);
 $('#rows').innerHTML=f.map(s=>`<button class="song" data-id="${s.id}"><b>${esc(s.title)||'Sem título'}</b><span>${esc(s.artist)||'Sem artista'}${s.key?' · Tom '+s.key+(s.mode==='m'?'m':''):''}</span></button>`).join('')||'<p class="empty">Nenhuma música ainda. Toque em + para escrever sua primeira cifra.</p>';
 document.querySelectorAll('.song').forEach(b=>b.onclick=()=>{cur=songs.find(s=>s.id===b.dataset.id);tab='cifra';shift=0;edit=!(cur.cifra||'').trim();song()})}
function list(){cur=null;
 app.innerHTML=`<header><h1>Caderno musical</h1>${inst?'<button id="in">Instalar</button>':''}<button id="bk">Backup</button></header>${late()?'<p class="hint">Faça um backup: seus dados ficam só neste aparelho.</p>':''}<input id="q" type="search" placeholder="Buscar música ou artista" value="${esc(q)}"><div class="songs" id="rows"></div><button class="fab" id="new" aria-label="Nova música">+</button>`;
 $('#q').oninput=e=>{q=e.target.value;rows()};
 $('#new').onclick=()=>{cur={id:'s'+Date.now(),title:'',artist:'',key:'C',mode:'M',cifra:'',letra:'',audios:[],upd:Date.now()};songs.push(cur);put(cur);tab='cifra';shift=0;edit=true;song()};
 $('#bk').onclick=backup;if(inst)$('#in').onclick=()=>{inst.prompt();inst=null;list()};
 rows()}

function song(){const s=cur;
 app.innerHTML=`<header><button class="ic" id="back" aria-label="Voltar">‹</button><h1 id="h">${esc(s.title)||'Nova música'}</h1><button class="ic" id="del" aria-label="Excluir">🗑</button></header>
 <div class="meta"><input id="ti" placeholder="Título" value="${esc(s.title)}"><input id="ar" placeholder="Artista" value="${esc(s.artist)}">
 <div class="row"><select id="ky" aria-label="Tom">${N.map(n=>`<option ${n===s.key?'selected':''}>${n}</option>`).join('')}</select><select id="md" aria-label="Modo"><option value="M" ${s.mode==='M'?'selected':''}>Maior</option><option value="m" ${s.mode==='m'?'selected':''}>Menor</option></select></div></div>
 <nav class="tabs">${[['cifra','Cifra'],['letra','Letra'],['ouvir','Ouvir'],['campo','Campo'],['audio','Áudio']].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav><div id="pane"></div>`;
 $('#back').onclick=()=>{stopSR();mixStop();if(rec&&rec.state==='recording')rec.stop();else if(!s.title&&!s.cifra&&!s.letra&&!s.ouvido&&!s.audios.length){songs=songs.filter(x=>x!==s);delSong(s)}list()};
 $('#del').onclick=()=>twice($('#del'),()=>{stopSR();mixStop();if(rec&&rec.state==='recording')rec.stop();songs=songs.filter(x=>x!==s);delSong(s);toast('Música excluída');list()});
 $('#ti').oninput=e=>{s.title=e.target.value;$('#h').textContent=s.title||'Nova música';save()};
 $('#ar').oninput=e=>{s.artist=e.target.value;save()};
 $('#ky').onchange=e=>{s.key=e.target.value;shift=0;save();pane()};
 $('#md').onchange=e=>{s.mode=e.target.value;save();pane()};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab!=='audio'&&!(rec&&rec.state==='recording'))mixStop();document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));pane()});
 pane()}

function pane(){const p=$('#pane'),s=cur;
 if(tab==='cifra'){
  const r=(idx(s.key)+shift+120)%12,fl=flatKey(r,s.mode==='M'),nm=fl?F:N;
  if(edit){p.innerHTML=`<div class="row"><button class="pri" id="ver">Ver cifra</button></div><p class="hint">Escreva os acordes numa linha acima da letra, separados por espaços.</p><textarea class="code" id="cf" wrap="off" spellcheck="false" placeholder="C      G\nParabéns pra você">${esc(s.cifra)}</textarea>`;
   $('#cf').oninput=e=>{s.cifra=e.target.value;save()};$('#ver').onclick=()=>{edit=false;shift=0;pane()}}
  else{const tx=shift?transpose(s.cifra||'',shift,fl):(s.cifra||'');
   p.innerHTML=`<div class="row"><button id="ed">Editar</button><span style="flex:1"></span><button id="mn" aria-label="Descer meio tom">−</button><span class="tone">${nm[r]}${s.mode==='m'?'m':''}</span><button id="pl" aria-label="Subir meio tom">+</button></div>${shift?'<div class="row" style="margin-top:8px"><button class="pri" id="ap">Salvar neste tom</button><button id="rs">Voltar ao original</button></div>':''}
   <pre class="view">${tx.trim()?tx.split('\n').map(l=>isChordLine(l)?`<span class="ch">${esc(l)}</span>`:esc(l)).join('\n'):'Nenhuma cifra ainda. Toque em Editar.'}</pre>`;
   $('#ed').onclick=()=>{edit=true;pane()};
   $('#mn').onclick=()=>{shift--;pane()};$('#pl').onclick=()=>{shift++;pane()};
   if(shift){$('#ap').onclick=()=>{s.cifra=tx;s.key=nm[r];shift=0;save();$('#ky').value=s.key;toast('Cifra salva no novo tom');pane()};$('#rs').onclick=()=>{shift=0;pane()}}}}
 else if(tab==='letra'){p.innerHTML=`<textarea class="code" id="lt" style="white-space:pre-wrap" placeholder="Escreva a letra aqui">${esc(s.letra)}</textarea>`;$('#lt').oninput=e=>{s.letra=e.target.value;save()}}
 else if(tab==='ouvir')ouvir(p);
 else if(tab==='campo'){
  const r=idx(s.key||'C'),mj=s.mode==='M',nm=flatKey(r,mj)?F:N,iv=mj?[0,2,4,5,7,9,11]:[0,2,3,5,7,8,10];
  const q3=mj?['','m','m','','','m','dim']:['m','dim','','m','m','',''],q7=mj?['maj7','m7','m7','maj7','7','m7','m7b5']:['m7','m7b5','maj7','m7','m7','maj7','7'];
  const rom=mj?['I','ii','iii','IV','V','vi','vii°']:['i','ii°','III','iv','v','VI','VII'];
  p.innerHTML=`<div class="row"><b style="flex:1">Campo harmônico de ${nm[r]}${mj?'':'m'}</b><button id="sv" class="${sev?'pri':''}">${sev?'Com 7ª':'Tríades'}</button></div><p class="hint">Toque num acorde para acrescentá-lo ao fim da cifra.</p>
  <div class="grid">${iv.map((v,i)=>{const c=nm[(r+v)%12]+(sev?q7[i]:q3[i]);return `<button class="deg" data-c="${c}"><small>${rom[i]}</small><b>${c}</b></button>`}).join('')}</div>`;
  $('#sv').onclick=()=>{sev=!sev;pane()};
  document.querySelectorAll('.deg').forEach(b=>b.onclick=()=>{s.cifra=(s.cifra||'')+(s.cifra&&!s.cifra.endsWith('\n')?'  ':'')+b.dataset.c;save();toast(b.dataset.c+' adicionado à cifra')})}
 else audioTab(p)}

let sr=null,srOn=false,recTipo='mix',recBk=true;
function stopSR(){srOn=false;try{sr&&sr.stop()}catch(e){}}
function ouvir(p){const s=cur,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 p.innerHTML=`<div class="row"><button class="pri" id="sr" style="flex:1">${srOn?'Parar de ouvir':'Começar a ouvir'}</button><button id="tl" style="flex:1">Passar para a Letra</button></div>
 <p class="hint" id="sst">${SR?(srOn?'Ouvindo… deixe a música tocar perto do microfone ou cante.':'Toque em Começar e deixe a música tocar ou cante perto do microfone.'):'Este navegador não reconhece voz. Abra no Chrome.'}</p>
 <textarea class="code" id="ou" style="white-space:pre-wrap;min-height:42vh" placeholder="A letra aparece aqui enquanto você ouve">${esc(s.ouvido||'')}</textarea>
 <div class="row" style="margin-top:8px"><button id="lp" style="flex:1">Limpar</button></div>
 <p class="hint">A letra é escrita e gravada sozinha. Em música com instrumentos o reconhecimento erra bastante, então revise o texto. Precisa de internet.</p>`;
 $('#ou').oninput=e=>{s.ouvido=e.target.value;save()};
 $('#tl').onclick=()=>{if(!(s.ouvido||'').trim())return toast('Ainda não há texto para passar.');s.letra=(s.letra?s.letra.replace(/\s+$/,'')+'\n\n':'')+s.ouvido;save();toast('Passada para a aba Letra')};
 $('#lp').onclick=()=>twice($('#lp'),()=>{s.ouvido='';save();ouvir(p)});
 $('#sr').onclick=()=>{
  if(srOn){stopSR();ouvir(p);return}
  if(!SR)return toast('Este navegador não reconhece voz. Abra no Chrome.');
  sr=new SR();sr.lang='pt-BR';sr.continuous=true;sr.interimResults=true;srOn=true;
  sr.onresult=e=>{if(cur!==s)return;let fin='',itm='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t.trim()+'\n';else itm+=t}
   if(fin){s.ouvido=(s.ouvido?s.ouvido.replace(/\s+$/,'')+'\n':'')+fin.replace(/\s+$/,'');save();const ta=$('#ou');if(ta)ta.value=s.ouvido}
   const st=$('#sst');if(st)st.textContent=itm?'Ouvindo: '+itm:'Ouvindo…'};
  sr.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;srOn=false;toast(e.error==='network'?'O reconhecimento de voz precisa de internet.':'Sem permissão para o microfone aqui. Abra o app direto no Chrome.');if(cur===s&&tab==='ouvir')ouvir($('#pane'))};
  sr.onend=()=>{if(srOn&&cur===s){try{sr.start()}catch(e){}}};
  try{sr.start();ouvir(p)}catch(e){srOn=false;toast('Não consegui iniciar o microfone.')}}}
function startLetra(s){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return false;
 try{stopSR();sr=new SR();sr.lang='pt-BR';sr.continuous=true;sr.interimResults=false;srOn=true;
  sr.onresult=e=>{let fin='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)fin+=e.results[i][0].transcript.trim()+'\n';
   if(fin.trim()){s.letra=(s.letra?s.letra.replace(/\s+$/,'')+'\n':'')+fin.replace(/\s+$/,'');save(s);const st=$('#gst');if(st)st.textContent='Letra salva: '+fin.trim().slice(0,70)}};
  sr.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;srOn=false;const st=$('#gst');if(st)st.textContent='Não consegui escrever a letra durante a gravação ('+e.error+'). O áudio continua gravando. Use a aba Ouvir se precisar.'};
  sr.onend=()=>{if(srOn&&rec&&rec.state==='recording'){try{sr.start()}catch(e){}}};
  sr.start();return true}catch(e){srOn=false;return false}}
/* ---------- mixer ---------- */
const mx={ac:null,buf:{},bad:{},src:[],gn:{},master:null,playing:false,t0:0,pos:0,dur:0,raf:0,mv:1};
const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
function AC(){if(!mx.ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;mx.ac=new C()}if(mx.ac.state==='suspended')mx.ac.resume().catch(()=>{});return mx.ac}
async function loadBufs(s){const ac=AC();if(!ac)return false;
 for(const a of s.audios){if(mx.buf[a.id]||mx.bad[a.id]||!a.blob)continue;try{mx.buf[a.id]=await ac.decodeAudioData(await a.blob.arrayBuffer())}catch(e){mx.bad[a.id]=1}}return true}
const anySolo=s=>s.audios.some(a=>a.solo);
const eff=(s,a)=>(anySolo(s)?a.solo:!a.mute)?(a.vol==null?1:a.vol):0;
const durOf=s=>Math.max(0,...s.audios.filter(a=>mx.buf[a.id]).map(a=>mx.buf[a.id].duration+Math.max(0,(a.off||0)/1000)));
const mixPos=()=>mx.playing?Math.max(0,mx.ac.currentTime-mx.t0):mx.pos;
function killSrc(){mx.src.forEach(x=>{try{x.stop()}catch(e){}try{x.disconnect()}catch(e){}});mx.src=[];mx.gn={};try{mx.master&&mx.master.disconnect()}catch(e){}}
function mixStart(s,from){const ac=AC();if(!ac)return false;killSrc();
 mx.master=ac.createGain();mx.master.gain.value=mx.mv;mx.master.connect(ac.destination);
 const now=ac.currentTime+0.05;mx.dur=durOf(s);
 s.audios.forEach(a=>{const b=mx.buf[a.id];if(!b)return;const g=ac.createGain();g.gain.value=eff(s,a);g.connect(mx.master);mx.gn[a.id]=g;
  const src=ac.createBufferSource();src.buffer=b;src.connect(g);const tp=from-(a.off||0)/1000;
  if(tp>=b.duration)return;if(tp>=0)src.start(now,tp);else src.start(now-tp,0);mx.src.push(src)});
 mx.t0=now-from;mx.playing=true;tick();return true}
function mixStop(){killSrc();cancelAnimationFrame(mx.raf);mx.playing=false;mx.pos=0;uiMix()}
function mixPause(){const p=mixPos();killSrc();cancelAnimationFrame(mx.raf);mx.playing=false;mx.pos=p;uiMix()}
function tick(){cancelAnimationFrame(mx.raf);const f=()=>{if(!mx.playing)return;const p=mixPos();if(mx.dur&&p>=mx.dur){mixStop();return}uiMix(p);mx.raf=requestAnimationFrame(f)};f()}
function uiMix(p){const b=$('#mxp');if(!b)return;if(p==null)p=mixPos();b.textContent=mx.playing?'⏸ Pausar':'▶ Tocar tudo';
 const t=$('#mxt');if(t)t.textContent=fmt(p)+' / '+fmt(mx.dur);const r=$('#mxs');if(r&&document.activeElement!==r){r.max=mx.dur||1;r.value=p}}
function wav(b){const ch=b.numberOfChannels,n=b.length,sr=b.sampleRate,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
 const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*ch*2,true);
 const d=[];let pk=0;for(let c=0;c<ch;c++){const x=b.getChannelData(c);d.push(x);for(let i=0;i<n;i++){const y=Math.abs(x[i]);if(y>pk)pk=y}}
 const k=pk>1?1/pk:1;let o=44;
 for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,d[c][i]*k));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}
 return new Blob([ab],{type:'audio/wav'})}
async function bounce(s){const act=s.audios.filter(a=>mx.buf[a.id]&&eff(s,a)>0);if(!act.length){toast('Nenhuma faixa audível para juntar.');return}
 const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OC){toast('Este aparelho não consegue juntar as faixas.');return}
 toast('Juntando as faixas…');const sr=44100,d=durOf(s),oc=new OC(2,Math.max(1,Math.ceil(d*sr)),sr);
 const m=oc.createGain();m.gain.value=mx.mv;m.connect(oc.destination);
 act.forEach(a=>{const g=oc.createGain();g.gain.value=eff(s,a);g.connect(m);const src=oc.createBufferSource();src.buffer=mx.buf[a.id];src.connect(g);const o=(a.off||0)/1000;if(o>=0)src.start(o);else src.start(0,-o)});
 try{const r=await oc.startRendering();s.audios.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,5),tipo:'mix',name:'Mix '+new Date().toLocaleString('pt-BR'),blob:wav(r),vol:1});save(s);put(s);toast('Mix salvo como nova faixa');if(cur===s&&tab==='audio')audioTab($('#pane'))}
 catch(e){toast('Não consegui juntar as faixas.')}}

function audioTab(p){const s=cur,rc=rec&&rec.state==='recording';
 p.innerHTML=`<div class="card2"><select id="tp" aria-label="Tipo de gravação"><option value="mix">Gravar voz + violão juntos</option><option value="violao">Gravar só o violão</option><option value="voz">Gravar só a voz</option></select>
 <label class="chk"><input type="checkbox" id="bkc" ${recBk?'checked':''}> Tocar as outras faixas enquanto gravo (use fones)</label>
 <div class="row"><label class="fb">Adicionar arquivo<input id="fl" type="file" accept="audio/*" multiple hidden></label><button id="rc" style="flex:1">${rc?'Parar gravação':'Gravar'}</button></div>
 <label class="fb2">Gravar com o gravador do celular<input id="cap" type="file" accept="audio/*" capture hidden></label>
 <p class="hint" id="gst">${rc?'Gravando…':''}</p></div><h2 class="mh">Mixer</h2><div id="mxb"><p class="hint">Carregando faixas…</p></div>`;
 $('#tp').value=recTipo;$('#tp').onchange=e=>{recTipo=e.target.value};$('#bkc').onchange=e=>{recBk=e.target.checked};
 $('#rc').onclick=toggleRec;
 $('#fl').onchange=$('#cap').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;fs.forEach(f=>s.audios.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,6),tipo:'arquivo',name:f.name,blob:f,vol:1}));save(s);put(s);mixStop();audioTab(p)};
 loadBufs(s).then(()=>{if(cur===s&&tab==='audio'&&$('#mxb'))mixUI(s)})}

function mixUI(s){const b=$('#mxb');mx.dur=durOf(s);
 const tr=s.audios.map(a=>`<div class="au"><div class="row"><input class="nm" data-n="${a.id}" value="${esc(a.name)}" aria-label="Nome da faixa"><button data-x="${a.id}" aria-label="Remover faixa" style="flex:0 0 auto">✕</button></div>
 ${a.blob&&!mx.bad[a.id]?'':'<p class="hint" style="color:var(--danger)">Não consegui ler este áudio.</p>'}
 <div class="row"><button class="tg ${a.mute?'on':''}" data-m="${a.id}" style="flex:0 0 auto">Mudo</button><button class="tg ${a.solo?'on':''}" data-so="${a.id}" style="flex:0 0 auto">Solo</button><input type="range" min="0" max="150" value="${Math.round((a.vol==null?1:a.vol)*100)}" data-v="${a.id}" aria-label="Volume"><b class="pc" id="pv_${a.id}">${Math.round((a.vol==null?1:a.vol)*100)}%</b></div>
 <div class="row"><small class="hint" style="flex:0 0 auto;margin:0">Atraso</small><input type="range" min="-500" max="500" step="5" value="${a.off||0}" data-o="${a.id}" aria-label="Atraso em milissegundos"><b class="pc" id="po_${a.id}">${a.off||0} ms</b></div></div>`).join('');
 b.innerHTML=s.audios.length?`<div class="card2"><div class="row"><button class="pri" id="mxp" style="flex:1">▶ Tocar tudo</button><button id="mxst" aria-label="Parar" style="flex:0 0 auto">■</button><span id="mxt" class="tone" style="min-width:90px">0:00 / ${fmt(mx.dur)}</span></div>
 <input type="range" id="mxs" min="0" max="${mx.dur||1}" step="0.01" value="${mixPos()}" aria-label="Posição" style="margin-top:8px">
 <div class="row" style="margin-top:6px"><small class="hint" style="flex:0 0 auto;margin:0">Volume geral</small><input type="range" id="mxv" min="0" max="150" value="${Math.round(mx.mv*100)}"><b class="pc" id="pvm">${Math.round(mx.mv*100)}%</b></div>
 <button id="mxj" style="width:100%;margin-top:8px">Juntar tudo numa nova faixa</button>
 <p class="hint" style="margin-bottom:0">Se a voz gravada ficou adiantada ou atrasada em relação ao violão, ajuste o Atraso da faixa.</p></div>${tr}`:'<p class="empty">Nenhuma faixa. Adicione um arquivo ou grave agora.</p>';
 if(!s.audios.length)return;uiMix();
 const upd=()=>{if(mx.playing)s.audios.forEach(a=>{if(mx.gn[a.id])mx.gn[a.id].gain.value=eff(s,a)})};
 $('#mxp').onclick=()=>{if(mx.playing){mixPause();return}if(!s.audios.some(a=>mx.buf[a.id]))return toast('Nenhuma faixa pôde ser lida.');mixStart(s,mx.pos>=mx.dur?0:mx.pos)};
 $('#mxst').onclick=mixStop;
 $('#mxs').oninput=e=>{const t=$('#mxt');if(t)t.textContent=fmt(+e.target.value)+' / '+fmt(mx.dur)};
 $('#mxs').onchange=e=>{const v=+e.target.value;if(mx.playing)mixStart(s,v);else mx.pos=v;uiMix()};
 $('#mxv').oninput=e=>{mx.mv=e.target.value/100;$('#pvm').textContent=e.target.value+'%';if(mx.master)mx.master.gain.value=mx.mv};
 $('#mxj').onclick=()=>bounce(s);
 const A=id=>s.audios.find(x=>x.id===id);
 b.querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>{const a=A(i.dataset.n);a.name=i.value.trim()||'Faixa';save(s)});
 b.querySelectorAll('[data-x]').forEach(i=>i.onclick=()=>twice(i,()=>{mixStop();const a=A(i.dataset.x);s.audios=s.audios.filter(x=>x!==a);delete mx.buf[a.id];delBlob(a.id);save(s);put(s);toast('Faixa removida');mixUI(s)}));
 b.querySelectorAll('[data-m]').forEach(i=>i.onclick=()=>{const a=A(i.dataset.m);a.mute=!a.mute;i.classList.toggle('on',a.mute);save(s);upd()});
 b.querySelectorAll('[data-so]').forEach(i=>i.onclick=()=>{const a=A(i.dataset.so);a.solo=!a.solo;i.classList.toggle('on',a.solo);save(s);upd()});
 b.querySelectorAll('[data-v]').forEach(i=>i.oninput=()=>{const a=A(i.dataset.v);a.vol=i.value/100;$('#pv_'+a.id).textContent=i.value+'%';save(s);upd()});
 b.querySelectorAll('[data-o]').forEach(i=>{i.oninput=()=>{const a=A(i.dataset.o);a.off=+i.value;$('#po_'+a.id).textContent=i.value+' ms';save(s)};i.onchange=()=>{if(mx.playing)mixStart(s,mixPos())}})}

async function toggleRec(){const s=cur;
 if(rec&&rec.state==='recording'){rec.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder){toast('Abrindo o gravador do celular…');$('#cap').click();return}
 const tipo=recTipo,useBk=recBk&&tipo!=='mix'&&s.audios.some(a=>a.blob);
 mixStop();if(useBk){AC();await loadBufs(s)}
 let st;
 try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:useBk,noiseSuppression:false,autoGainControl:false}})}
 catch(e){toast('Sem acesso ao microfone. Abrindo o gravador do celular…');const c=$('#cap');if(c)c.click();return}
 try{
  const ch=[],mr=new MediaRecorder(st);rec=mr;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  mr.onerror=()=>toast('A gravação falhou. Tente de novo.');
  mr.onstop=()=>{stopSR();mixStop();st.getTracks().forEach(t=>t.stop());const blob=new Blob(ch,{type:mr.mimeType||'audio/webm'});
   if(blob.size){s.audios.push({id:'a'+Date.now(),tipo:tipo,name:({mix:'Gravação',violao:'Violão',voz:'Voz'})[tipo]+' '+new Date().toLocaleString('pt-BR'),blob:blob,vol:1});s.upd=Date.now();put(s);toast('Gravação salva')}
   else toast('A gravação saiu vazia. Tente de novo.');
   if(cur===s&&tab==='audio')audioTab($('#pane'))};
  mr.start(1000);
  const okL=tipo==='violao'?false:startLetra(s);
  if(useBk)mixStart(s,0);
  audioTab($('#pane'));const g=$('#gst');
  if(g)g.textContent=tipo==='violao'?'Gravando o violão…':(okL?'Gravando… o que você cantar vai sendo escrito e salvo na aba Letra.':'Gravando. Este aparelho não escreve a letra sozinho.');
 }catch(e){st.getTracks().forEach(t=>t.stop());rec=null;toast('Não consegui gravar neste aparelho. Abrindo o gravador do celular…');const c=$('#cap');if(c)c.click()}}

addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;if(!cur&&$('#bk'))list()});
const lk=()=>{try{return +localStorage.getItem('lastBk')||0}catch(e){return 0}};
const late=()=>songs.length&&Date.now()-lk()>6048e5;
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const d2b=d=>{const [h,b]=d.split(','),m=h.match(/:(.*?);/)[1],bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m})};
function backup(){cur=null;const d=lk();
 app.innerHTML=`<header><button class="ic" id="back" aria-label="Voltar">‹</button><h1>Backup</h1></header>
 <p>${songs.length} música(s) e ${songs.reduce((n,s)=>n+s.audios.length,0)} áudio(s) neste aparelho.</p>
 <p class="hint">Último backup: ${d?new Date(d).toLocaleString('pt-BR'):'nunca'}. O arquivo guarda cifras, letras e áudios. Guarde-o no Drive, WhatsApp ou e-mail.</p>
 <div class="row"><button class="pri" id="ex" style="flex:1">Exportar tudo</button><label style="flex:1;text-align:center;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer">Importar<input id="im" type="file" accept=".json,application/json" hidden></label></div>
 <p class="hint">Ao importar, músicas novas são adicionadas e as existentes só são trocadas se o backup for mais recente.</p>`;
 $('#back').onclick=list;$('#ex').onclick=exportAll;
 $('#im').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());let n=0;
  for(const s of j.songs){const o=songs.find(x=>x.id===s.id);if(o&&o.upd>=s.upd)continue;
   const m={...s,audios:s.audios.map(a=>{const{data,...r}=a;return{...r,blob:d2b(data)}})};
   if(o){o.audios.forEach(a=>delBlob(a.id));songs[songs.indexOf(o)]=m}else songs.push(m);put(m);n++}
  toast(n+' música(s) importada(s)');setTimeout(list,900)}catch(x){toast('Arquivo de backup inválido.')}}}
async function exportAll(){toast('Preparando backup…');
 const out=[];for(const s of songs)out.push({...s,audios:await Promise.all(s.audios.filter(a=>a.blob).map(async a=>{const{blob,_p,...r}=a;return{...r,data:await b2d(a.blob)}}))});
 const name='caderno-musical-'+new Date().toISOString().slice(0,10)+'.json',blob=new Blob([JSON.stringify({v:1,songs:out})],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
 try{localStorage.setItem('lastBk',Date.now())}catch(e){}
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return backup()}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();toast('Backup salvo em Downloads');backup()}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{await openDB();songs=await getAll();list()})();
</script>
